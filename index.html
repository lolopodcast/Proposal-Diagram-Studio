<script>
/* ---------- Front-end protection (Domain lock · iframe busting · smart right-click) ---------- */
(function(){
  var ALLOWED = ['lolopodcast.github.io','localhost','127.0.0.1'];
  var REDIRECT = 'https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo';
  var okHost = location.protocol === 'file:' || ALLOWED.some(function(d){ return location.hostname === d || location.hostname.endsWith('.'+d); });
  if (!okHost) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1><p>This resource is not authorised on this domain.</p></div>';
    window.__PDS_BLOCKED = true;
    setTimeout(function(){ location.href = REDIRECT; }, 3000);
    return;
  }
  if (window.self !== window.top) {
    try { window.top.location.href = window.self.location.href; }
    catch(e) { document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Frame Blocked</h1><p>This content cannot be embedded.</p></div>'; window.__PDS_BLOCKED = true; }
  }
  var toast = function(){ if (window.__pdsCopyright) window.__pdsCopyright(); };
  document.addEventListener('contextmenu', function(e){
    var sel = (window.getSelection() || '').toString().trim();
    var tag = (e.target.tagName || '').toLowerCase();
    if (sel.length > 0 || tag === 'input' || tag === 'textarea') return true;
    e.preventDefault(); toast();
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || (e.ctrlKey && k === 'u') || (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) >= 0)) { e.preventDefault(); toast(); }
  });
  document.addEventListener('dragstart', function(e){ if (e.target.tagName === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault(); });
})();
</script>

/* ============================================================
   ENGINE — text measuring, node boxes, layout, geometry
   (plain JS, no JSX)
   ============================================================ */
const G = {
  TOP: 118, PADX: 12, PADY: 11, GAPY: 22,
  FRAME_TOP: 32, FRAME_BOT: 50, FRAME_PADX: 14,
  LANE_LABEL_W: 34, LANE_GAP: 34,
  FONT: "Inter, 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif",
  SERIF: "Merriweather, 'Noto Serif TC', 'Noto Sans TC', 'Microsoft JhengHei', serif"
};

const WIDE_RE = /[⺀-鿿豈-﫿︰-﹏＀-￯　-〿①-⓿★☆]/;
function textW(s, fs) {
  let w = 0;
  for (const ch of String(s)) {
    if (WIDE_RE.test(ch)) w += fs;
    else if (ch === ' ') w += fs * 0.3;
    else if (/[il.,:;|!'’()\[\]\/]/.test(ch)) w += fs * 0.32;
    else if (/[A-Z0-9%&@#MW]/.test(ch)) w += fs * 0.66;
    else w += fs * 0.55;
  }
  return w;
}
function wrapText(s, maxW, fs) {
  s = String(s || '');
  if (!s) return [];
  const tokens = s.match(/[⺀-鿿豈-﫿︰-﹏＀-￯　-〿]|[^\s⺀-鿿豈-﫿︰-﹏＀-￯　-〿]+|\s+/g) || [];
  const lines = []; let cur = '';
  for (let t of tokens) {
    if (/^\s+$/.test(t)) { if (cur) cur += ' '; continue; }
    if (textW(cur + t, fs) <= maxW) { cur += t; continue; }
    // closing punctuation stays on the current line
    if (/^[，。、；：？！）」』,.;:?!)]$/.test(t) && cur) { cur += t; continue; }
    if (cur.trim()) lines.push(cur.trimEnd());
    cur = '';
    while (textW(t, fs) > maxW) {
      let i = 1;
      while (i < t.length && textW(t.slice(0, i + 1), fs) <= maxW) i++;
      lines.push(t.slice(0, i)); t = t.slice(i);
    }
    cur = t;
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  return lines;
}

const getText = (n) => (n.variants ? n.variants[n.variant || 'auto'] : n.text) || { zh: { title: '', items: [] }, en: { title: '', items: [] } };
const roleOf = (tpl, id) => tpl.roles.find(r => r.id === id) || tpl.roles[0];

/* Build the drawable lines of a node for a display mode (zh | en | both). */
function nodeBox(n, tpl, mode) {
  const role = roleOf(tpl, n.role), W = role.w || tpl.nodeW;
  const sx = role.shape === 'decision' ? 12 : 0; /* hexagon: keep text clear of the pointed sides */
  const inner = W - G.PADX * 2 - sx * 2;
  const txt = getText(n);
  const prim = mode === 'en' ? 'en' : 'zh';
  const lines = [];
  let y = G.PADY;
  const badgeIndent = (role.badge ? 24 : 0) + sx;
  const push = (arr, o) => arr.forEach(t => { y += o.lh; lines.push({ t, x: o.x, y: y - o.lh * 0.28, fs: o.fs, fw: o.fw || 400, fill: o.fill || '#1f2937', fi: o.fi || 'normal' }); });
  // title
  const tPrim = (txt[prim] && txt[prim].title) || (txt.zh && txt.zh.title) || '';
  push(wrapText(tPrim, inner - badgeIndent, 14.5), { x: G.PADX + badgeIndent, fs: 14.5, fw: 700, lh: 19, fill: '#0f172a' });
  if (mode === 'both' && txt.en && txt.en.title) {
    push(wrapText(txt.en.title, inner - badgeIndent, 11.5), { x: G.PADX + badgeIndent, fs: 11.5, lh: 15, fill: '#475569', fi: 'italic' });
  }
  let pillY = null;
  if (n.variants) { y += 5; pillY = y; y += 18; }
  y += 5;
  const iz = (txt[prim] && txt[prim].items) || [];
  const ie = (txt.en && txt.en.items) || [];
  const count = Math.max(iz.length, mode === 'both' ? ie.length : 0);
  const bullets = [];
  for (let i = 0; i < count; i++) {
    const a = (iz[i] || '').trim(), b = (ie[i] || '').trim();
    if (!a && !(mode === 'both' && b)) continue;
    const startY = y;
    if (a) push(wrapText(a, inner - 11, 12), { x: G.PADX + 11 + sx, fs: 12, lh: 16.5, fill: '#1f2937' });
    if (mode === 'both' && b) push(wrapText(b, inner - 11, 10.5), { x: G.PADX + 11 + sx, fs: 10.5, lh: 14, fill: '#64748b', fi: 'italic' });
    bullets.push(startY + 16.5 * 0.72);
    y += 3;
  }
  let tagY = null;
  const owner = tpl.owners && n.owner ? tpl.owners.find(o => o.id === n.owner) : null;
  if (n.tag || owner || n.xref) { y += 4; tagY = y; y += 18; }
  y += G.PADY + (role.shape === 'doc' ? 8 : 0);
  return { w: W, h: Math.max(y, 54), lines, bullets, pillY, tagY, badgeIndent, sx, owner };
}

function laneOn(tpl) { return !!(tpl.lanes && tpl.lanes.enabled); }
function rowPhases(tpl) { return !!(tpl.phases && tpl.phaseDir === 'row'); }
function leftX(tpl) { return laneOn(tpl) || rowPhases(tpl) ? 14 + G.LANE_LABEL_W + 20 : 36; }
function colX(tpl, c) { return leftX(tpl) + c * (tpl.nodeW + tpl.gapX) + ((tpl.colShift && tpl.colShift[c]) || 0); }
const colOfN = (tpl, n) => (n.col !== undefined ? n.col : roleOf(tpl, n.role).col);
const rowOfN = (tpl, n) => (n.row !== undefined ? n.row : (roleOf(tpl, n.role).row !== undefined ? roleOf(tpl, n.role).row : 1));
const inBand = (tpl, n) => !!(tpl.band && tpl.band.roles.includes(n.role));
function isPerLane(tpl, n) { return laneOn(tpl) && !!roleOf(tpl, n.role).perLane; }

/* Auto layout: returns a new nodes array with x/y set. */
function autoLayout(d, tpl, mode) {
  const boxes = {}; d.nodes.forEach(n => boxes[n.id] = nodeBox(n, tpl, mode));
  const gRole = {}; (tpl.groups || []).forEach(g => g.roles.forEach(r => gRole[r] = g.id));
  const order = {}; tpl.roles.forEach((r, i) => order[r.id] = i);
  const sortFn = (a, b) => (order[a.role] - order[b.role]) || (a.y - b.y);
  const place = (arr, y0) => {
    let y = y0, prevG = null; const pos = {};
    arr.forEach((n, i) => {
      const g = gRole[n.role] || null;
      if (i > 0) y += G.GAPY;
      if (g !== prevG) { if (prevG) y += G.FRAME_BOT - 8; if (g) y += G.FRAME_TOP; }
      pos[n.id] = y; y += boxes[n.id].h; prevG = g;
    });
    if (prevG) y += G.FRAME_BOT;
    return { pos, h: y - y0 };
  };
  const colOf = n => (n.col !== undefined ? n.col : roleOf(tpl, n.role).col);
  if (tpl.grid) {
    const rowOf = n => (n.row !== undefined ? n.row : (roleOf(tpl, n.role).row !== undefined ? roleOf(tpl, n.role).row : 1));
    const cells = {};
    d.nodes.forEach(n => { const k = colOf(n) + '_' + rowOf(n); (cells[k] = cells[k] || []).push(n); });
    const nRows = Math.max(1, ...d.nodes.map(n => rowOf(n) + 1));
    const rowH = Array(nRows).fill(0);
    Object.entries(cells).forEach(([k, arr]) => { arr.sort(sortFn); const r = +k.split('_')[1]; rowH[r] = Math.max(rowH[r], place(arr, 0).h); });
    const rowTop = []; let yy = G.TOP + (tpl.topPad || 0);
    for (let r = 0; r < nRows; r++) { rowTop[r] = yy; yy += (rowH[r] || 0) + (rowH[r] ? (tpl.rowGap || G.GAPY * 2) : 0); }
    const pos = {};
    Object.entries(cells).forEach(([k, arr]) => {
      const [c, r] = k.split('_').map(Number); const h = place(arr, 0).h;
      const res = place(arr, rowTop[r] + (tpl.alignTop ? 0 : (rowH[r] - h) / 2));
      arr.forEach(n => pos[n.id] = { x: colX(tpl, c), y: Math.round(res.pos[n.id]) });
    });
    return d.nodes.map(n => pos[n.id] ? { ...n, ...pos[n.id] } : n);
  }
  const lanes = laneOn(tpl) ? d.lanes.length : 1;
  const newPos = {};
  const bandTop = [], bandH = [];
  let cursor = G.TOP;
  for (let l = 0; l < lanes; l++) {
    const laneNodes = d.nodes.filter(n => laneOn(tpl) ? (isPerLane(tpl, n) && n.lane === l) : true);
    let maxH = 90;
    const cols = {};
    laneNodes.forEach(n => { (cols[colOf(n)] = cols[colOf(n)] || []).push(n); });
    Object.values(cols).forEach(arr => { arr.sort(sortFn); maxH = Math.max(maxH, place(arr, 0).h); });
    bandTop[l] = cursor; bandH[l] = maxH;
    Object.entries(cols).forEach(([c, arr]) => {
      const r = place(arr, 0); const y0 = cursor + (maxH - r.h) / 2;
      const r2 = place(arr, y0);
      arr.forEach(n => newPos[n.id] = { x: colX(tpl, +c), y: Math.round(r2.pos[n.id]) });
    });
    cursor += maxH + G.LANE_GAP;
  }
  if (laneOn(tpl)) {
    const totalH = cursor - G.LANE_GAP - G.TOP;
    const shared = d.nodes.filter(n => !isPerLane(tpl, n));
    const cols = {};
    shared.forEach(n => { (cols[colOf(n)] = cols[colOf(n)] || []).push(n); });
    Object.entries(cols).forEach(([c, arr]) => {
      arr.sort(sortFn);
      const r = place(arr, 0); const y0 = G.TOP + Math.max(0, (totalH - r.h) / 2);
      const r2 = place(arr, y0);
      arr.forEach(n => newPos[n.id] = { x: colX(tpl, +c), y: Math.round(r2.pos[n.id]) });
    });
  }
  return d.nodes.map(n => newPos[n.id] ? { ...n, ...newPos[n.id] } : n);
}

/* Geometry helpers ------------------------------------------------ */
function computeGeometry(d, tpl, mode) {
  const boxes = {}; d.nodes.forEach(n => boxes[n.id] = nodeBox(n, tpl, mode));
  const rects = {}; d.nodes.forEach(n => rects['n:' + n.id] = { x: n.x, y: n.y, w: boxes[n.id].w, h: boxes[n.id].h });
  // frames
  const frames = [];
  const lanes = laneOn(tpl) ? d.lanes.map((_, i) => i) : [null];
  (tpl.groups || []).forEach(g => {
    lanes.forEach(l => {
      const ns = d.nodes.filter(n => g.roles.includes(n.role) && (l === null || n.lane === l));
      if (!ns.length) return;
      const x1 = Math.min(...ns.map(n => n.x)), y1 = Math.min(...ns.map(n => n.y));
      const x2 = Math.max(...ns.map(n => n.x + boxes[n.id].w)), y2 = Math.max(...ns.map(n => n.y + boxes[n.id].h));
      const ref = 'g:' + g.id + ':' + (l === null ? 0 : l);

  .replace(/\s*★\s*/g, lang === 'zh' ? '星號' : ' star ')
  .replace(/[①-⑨☆ⓘ🔊💾🗑▶]/g, '')
  .replace(/\s*(→|->|⇒)\s*/g, lang === 'zh' ? '，' : ', then ')
  .replace(/([A-Za-z])\/(?=[A-Za-z])/g, '$1 ')
  .replace(/\/(?=[\s，。、）)]|$)/g, '')
  .replace(/_{2,}/g, ' ')
  .replace(/\s*[／|｜]\s*/g, lang === 'zh' ? '、' : ', ')
  .replace(/\s*[·・]\s*/g, lang === 'zh' ? '，' : ', ')
  .replace(/\s+/g, ' ').trim();
/* Join sentences without doubling end punctuation. */
const joinSay = (arr, lang) => arr.filter(Boolean).map(s => String(s).trim()).filter(Boolean)
  .map(s => /[。．.!?！？；;:：]$/.test(s) ? s : s + (lang === 'zh' ? '。' : '.')).join(' ');
const speak = (text, lang, onEnd) => {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(ttsClean(text, lang));
  u.rate = 0.95;
  const voices = speechSynthesis.getVoices();
  if (lang === 'zh') {
    const v = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
    if (v) u.voice = v; u.lang = 'zh-TW';
  } else {
    const v = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
    if (v) u.voice = v; u.lang = 'en-GB';
  }
  if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
  speechSynthesis.speak(u);
};

/* ---------------- Diagram (SVG) ---------------- */
/* Outline path of a node by shape (step | decision | doc | terminal) */
const shapePath = (shape, w, h) => {
  if (shape === 'decision') { const k = 16; return `M0,${h / 2} L${k},0 L${w - k},0 L${w},${h / 2} L${w - k},${h} L${k},${h} Z`; }
  if (shape === 'doc') { const r = 10, b = h - 8; return `M${r},0 L${w - r},0 Q${w},0 ${w},${r} L${w},${b} C${w * 0.75},${b - 10} ${w * 0.62},${h + 6} ${w / 2},${b} C${w * 0.38},${b - 10} ${w * 0.25},${h + 6} 0,${b} L0,${r} Q0,0 ${r},0 Z`; }
  const r = shape === 'terminal' ? Math.min(h / 2, 26) : 10;
  return `M${r},0 L${w - r},0 Q${w},0 ${w},${r} L${w},${h - r} Q${w},${h} ${w - r},${h} L${r},${h} Q0,${h} 0,${h - r} L0,${r} Q0,0 ${r},0 Z`;
};
const LOOP_COLOR = '#B45309';

const Diagram = ({ doc, dia, tpl, mode, selected, onSelect, onDragNode, onDragEnd, connect, onConnectPick, zoom, svgRef, onInfo }) => {
  const d = dia;
  const geo = useMemo(() => computeGeometry(d, tpl, mode), [d, tpl, mode]);
  const legend = useMemo(() => legendLines(d, tpl, mode, geo.codes, geo.W), [d, tpl, mode, geo]);
  const drag = useRef(null);

  const toSvg = (evt) => {
    const svg = svgRef.current; const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  useEffect(() => {
    const move = (e) => {
      const s = drag.current; if (!s) return;
      const p = toSvg(e);
      const nx = Math.round((s.ox + p.x - s.sx) / 2) * 2, ny = Math.round((s.oy + p.y - s.sy) / 2) * 2;
      if (!s.moved && Math.abs(p.x - s.sx) + Math.abs(p.y - s.sy) < 3) return;
      s.moved = true; onDragNode(s.id, nx, ny);
    };
    const up = () => { const s = drag.current; drag.current = null; if (s && s.moved) onDragEnd(s.snapshot); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  });

  const nodeDown = (e, n) => {
    e.stopPropagation();
    if (connect) { onConnectPick('n:' + n.id); return; }
    onSelect({ type: 'node', id: n.id });
    const p = toSvg(e);
    drag.current = { id: n.id, sx: p.x, sy: p.y, ox: n.x, oy: n.y, moved: false, snapshot: JSON.stringify(doc) };
  };

  const disp = (bi) => { if (!bi) return ''; return mode === 'en' ? (bi.en || bi.zh) : (bi.zh || bi.en); };
  // header
  const titleMain = disp(d.title);
  const legendTop = geo.contentBottom + 34;
  let ly = legendTop - 8;
  const legendRows = legend.map(row => { const y0 = ly; ly += row.head ? 26 : row.gap ? 10 : row.lines.length * (row.fs + 5) + 4; return { ...row, y0 }; });
  const H = Math.ceil(ly + 36);
  const W = geo.W;
  const selColor = '#D97706';

  return (
    <svg ref={svgRef} xmlns="http://www.w3.org/2000/svg" viewBox={`0 0 ${W} ${H}`} width={W * zoom} height={H * zoom}
      style={{ display: 'block', fontFamily: G.FONT, userSelect: 'none', touchAction: 'none' }}
      onPointerDown={() => { if (!connect) onSelect(null); }}
      data-w={W} data-h={H}>
      <defs>
        <marker id="arMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#004030" /></marker>
        <marker id="arFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" /></marker>
 <marker id="arLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={LOOP_COLOR} /></marker>
        <marker id="arSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={selColor} /></marker>
      </defs>
      <rect x="0" y="0" width={W} height={H} fill="#ffffff" />
      {/* Title block */}
      <rect x="0" y="0" width={W} height="6" fill="#004030" />
      <text x="28" y="44" fontFamily={G.SERIF} fontSize="22" fontWeight="700" fill="#004030">{titleMain}</text>
      {mode === 'both' && d.title.en && <text x="28" y="66" fontSize="13.5" fontStyle="italic" fill="#475569">{d.title.en}</text>}
      <text x="28" y={mode === 'both' ? 88 : 68} fontSize="12.5" fill="#64748b">{mode === 'both' ? [d.subtitle.zh, d.subtitle.en].filter(Boolean).join('  ·  ') : disp(d.subtitle)}</text>
      <line x1="28" y1={mode === 'both' ? 100 : 82} x2={W - 28} y2={mode === 'both' ? 100 : 82} stroke="#D8C3A5" strokeWidth="1.5" />

      {/* Phase bands (B): I-P-O columns or thesis-chapter rows */}
      {geo.phases.map(p => p.w ? (
        <g key={'ph' + p.i}>
          <rect x={p.x} y={p.y} width={p.w} height={p.h} rx="12" fill={p.ph.fill} stroke={p.ph.color} strokeOpacity="0.35" strokeWidth="1.2" />
          <rect x={p.x} y={p.y} width={p.w} height="30" rx="12" fill={p.ph.color} />
          <rect x={p.x} y={p.y + 18} width={p.w} height="12" fill={p.ph.color} />
          <text x={p.x + p.w / 2} y={p.y + 20} textAnchor="middle" fontSize="12.5" fontWeight="700" fill="#ffffff">{disp(p.ph.label)}</text>
          {p.ph.out && <text x={p.x + p.w / 2} y={p.y + p.h - 11} textAnchor="middle" fontSize="11.5" fontWeight="700" fill={p.ph.color}>{disp(p.ph.out)}</text>}
        </g>
      ) : (
        <g key={'ph' + p.i}>
          <rect x="14" y={p.y} width={W - 28} height={p.h} rx="10" fill={p.i % 2 ? '#f8fafc' : '#f4f8f6'} stroke="#cbd5e1" strokeDasharray="4 4" />
          <rect x="14" y={p.y} width={G.LANE_LABEL_W} height={p.h} rx="10" fill="#004030" opacity="0.9" />
          <text transform={`translate(${14 + G.LANE_LABEL_W / 2 + 5},${p.y + p.h / 2}) rotate(-90)`} textAnchor="middle" fontSize="11.5" fontWeight="700" fill="#ffffff">{disp(p.ph.label)}</text>
        </g>
      ))}
      {geo.xband && (
        <g>
          <rect x={geo.xband.x} y={geo.xband.y} width={geo.xband.w} height={geo.xband.h} rx="12" fill="#F8FAFC" stroke="#475569" strokeWidth="1.2" strokeDasharray="7 4" />
          <text x={geo.xband.x + 14} y={geo.xband.y + 21} fontSize="12.5" fontWeight="700" fill="#334155">{disp(tpl.band.label)}</text>
        </g>
      )}

      {/* Comparison-row bands */}
      {geo.bands.map((b, i) => (
        <g key={'band' + b.lane}>
          <rect x="14" y={b.y} width={W - 28} height={b.h} rx="10" fill={b.lane % 2 ? '#f8fafc' : '#f4f8f6'} stroke="#cbd5e1" strokeDasharray="4 4" />
          <rect x="14" y={b.y} width={G.LANE_LABEL_W} height={b.h} rx="10" fill="#004030" opacity="0.9" />
          <text transform={`translate(${14 + G.LANE_LABEL_W / 2 + 5},${b.y + b.h / 2}) rotate(-90)`} textAnchor="middle" fontSize="12" fontWeight="700" fill="#ffffff">{disp(b.ln.text)}</text>
        </g>
      ))}

      {/* Frames */}
      {geo.frames.map(f => (
        <g key={f.ref} onPointerDown={(e) => { if (connect) { e.stopPropagation(); onConnectPick(f.ref); } }} style={{ cursor: connect ? 'crosshair' : 'default' }}>
          <rect x={f.x} y={f.y} width={f.w} height={f.h} rx="12" fill={f.g.color ? '#ffffff' : '#FFFBF2'} fillOpacity={f.g.color ? 0.55 : 1} stroke={f.g.color || '#B45309'} strokeOpacity={f.g.color ? 0.55 : 1} strokeWidth="1.4" strokeDasharray="6 4" />
          <text x={f.x + 12} y={f.y + 20} fontSize="12.5" fontWeight="700" fill={f.g.color || '#92400E'}>{disp(f.g.label)}</text>
          {(() => { const ls = wrapText(disp(f.g.note), f.w - 24, 10.5).slice(0, 2); return ls.map((l, i) => <text key={i} x={f.x + 12} y={f.y + f.h - 10 - (ls.length - 1 - i) * 14} fontSize="10.5" fill={f.g.color || '#92400E'}>{l}</text>); })()}
          {connect && <rect className="no-export" x={f.x} y={f.y} width={f.w} height={f.h} rx="12" fill="none" stroke={selColor} strokeWidth="1" strokeDasharray="2 3" />}
        </g>
      ))}

      {/* Edges */}
      {d.edges.map(e => {
        const g = geo.edgeGeo[e.id]; if (!g) return null;
        const sel = selected && selected.type === 'edge' && selected.id === e.id;
        const src = d.nodes.find(n => 'n:' + n.id === e.from), dst = d.nodes.find(n => 'n:' + n.id === e.to);
        const dashed = (src && src.optional) || (dst && dst.optional);
        const main = e.kind === 'main';
        const loop = main && tpl.mainStyle === 'loop';
        return (
          <g key={e.id}>
            <path d={g.d} fill="none" stroke={sel ? selColor : loop ? LOOP_COLOR : main ? '#004030' : '#94a3b8'} strokeWidth={main ? 2 : 1.6}
              strokeDasharray={loop ? '7 5' : dashed ? '6 4' : undefined} markerEnd={`url(#${sel ? 'arSel' : loop ? 'arLoop' : main ? 'arMain' : 'arFlow'})`} />
            <path className="no-export" d={g.d} fill="none" stroke="transparent" strokeWidth="14" style={{ cursor: connect ? 'crosshair' : 'pointer' }}
              onPointerDown={(ev) => { ev.stopPropagation(); if (connect) onConnectPick('e:' + e.id); else onSelect({ type: 'edge', id: e.id }); }} />
          </g>
        );
      })}

      {/* Nodes */}
      {d.nodes.map(n => {
        const b = geo.boxes[n.id]; const role = roleOf(tpl, n.role);
        const sel = selected && selected.type === 'node' && selected.id === n.id;
        const terms = (role.terms || []).filter(k => tpl.glossary[k]);
        return (
          <g key={n.id} transform={`translate(${n.x},${n.y})`} onPointerDown={(e) => nodeDown(e, n)} style={{ cursor: connect ? 'crosshair' : 'move' }}>
            {role.shape && role.shape !== 'step'
              ? <path d={shapePath(role.shape, b.w, b.h)} fill={role.fill} stroke={role.color} strokeWidth={role.shape === 'terminal' ? 2.2 : 1.6} strokeDasharray={n.optional ? '6 4' : undefined} />
              : <><rect x="0" y="0" width={b.w} height={b.h} rx="10" fill={role.fill} stroke={role.color} strokeWidth={1.6} strokeDasharray={n.optional ? '6 4' : undefined} />
                <rect x="0" y="0" width="5" height={b.h} rx="2" fill={role.color} /></>}
            {role.badge && <g><circle cx={G.PADX + 9} cy={G.PADY + 10} r="10" fill={role.color} /><text x={G.PADX + 9} y={G.PADY + 14.5} textAnchor="middle" fontSize="12" fontWeight="700" fill="#fff">{role.badge}</text></g>}
            {b.lines.map((l, i) => <text key={i} x={l.x} y={l.y} fontSize={l.fs} fontWeight={l.fw} fontStyle={l.fi} fill={l.fill}>{l.t}</text>)}
            {b.bullets.map((y, i) => <circle key={'b' + i} cx={G.PADX + 3.5 + b.sx} cy={y - 4} r="2.2" fill={role.color} />)}
            {b.pillY !== null && (
              <g>
                <rect x={G.PADX + b.badgeIndent} y={b.pillY} width={mode === 'en' ? (n.variant === 'semi' ? 108 : 78) : 62} height="17" rx="8.5" fill={role.color} />
                <text x={G.PADX + b.badgeIndent + 8} y={b.pillY + 12.5} fontSize="10.5" fontWeight="700" fill="#fff">{mode === 'en' ? (n.variant === 'semi' ? 'SEMI-AUTOMATIC' : 'AUTOMATIC') : (n.variant === 'semi' ? '半自動' : '自動')}</text>
              </g>
            )}
            {b.tagY !== null && (() => {
              let x = G.PADX + b.sx; const out = [];
              if (b.owner) { const lb = mode === 'en' ? b.owner.en : b.owner.zh; const w = textW(lb, 10.5) + 14; out.push(<g key="ow"><rect x={x} y={b.tagY} width={w} height="17" rx="8.5" fill={b.owner.color} /><text x={x + 7} y={b.tagY + 12.3} fontSize="10.5" fontWeight="700" fill="#ffffff">{lb}</text></g>); x += w + 5; }
              if (n.tag) { const w = Math.min(b.w - x - G.PADX, String(n.tag).length * 6.4 + 14); out.push(<g key="tg"><rect x={x} y={b.tagY} width={w} height="17" rx="4" fill="#ffffff" stroke={role.color} strokeWidth="0.8" /><text x={x + 7} y={b.tagY + 12.3} fontSize="10.5" fontFamily="'JetBrains Mono', Menlo, Consolas, monospace" fill={role.color}>{n.tag}</text></g>); }
              if (n.xref) { const lb = '→ ' + n.xref; const w = textW(lb, 10.5) + 12; out.push(<g key="xr"><rect x={b.w - G.PADX - b.sx - w} y={b.tagY} width={w} height="17" rx="4" fill="#004030" /><text x={b.w - G.PADX - b.sx - w / 2} y={b.tagY + 12.3} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="#D8C3A5">{lb}</text></g>); }
              return <g>{out}</g>;
            })()}
            {terms.length > 0 && (
              <g className="no-export" style={{ cursor: 'help' }}
                onPointerDown={(e) => { e.stopPropagation(); onInfo(n, terms, e.clientX, e.clientY, true); }}
                onMouseEnter={(e) => onInfo(n, terms, e.clientX, e.clientY, false)}>
                <circle cx={b.w - 13} cy="13" r="8" fill="#fff" stroke={role.color} />
                <text x={b.w - 13} y="17" textAnchor="middle" fontSize="11" fontWeight="700" fontStyle="italic" fill={role.color}>i</text>
              </g>
            )}
            {sel && <rect className="no-export" x="-5" y="-5" width={b.w + 10} height={b.h + 10} rx="13" fill="none" stroke={selColor} strokeWidth="2.5" strokeDasharray="7 4" />}
          </g>
        );
      })}

      {/* Edge labels (on top) */}
      {d.edges.map(e => {
        const g = geo.edgeGeo[e.id]; if (!g) return null;
        const sel = selected && selected.type === 'edge' && selected.id === e.id;
        let label = '';
        if (e.kind === 'main') label = geo.codes[e.id] + (tpl.signs && e.sign ? ` (${e.sign === '-' ? '−' : '+'})` : '');
        else label = disp(e.text);
        if (!label) return null;
        const w = textW(label, 11.5) + 16;
        return (
          <g key={'lb' + e.id} onPointerDown={(ev) => { ev.stopPropagation(); if (connect) onConnectPick('e:' + e.id); else onSelect({ type: 'edge', id: e.id }); }} style={{ cursor: 'pointer' }}>
            <rect x={g.label.x - w / 2} y={g.label.y - 10} width={w} height="20" rx="10" fill={e.kind === 'main' ? (sel ? selColor : tpl.mainStyle === 'loop' ? LOOP_COLOR : '#004030') : '#ffffff'} stroke={e.kind === 'main' ? 'none' : '#94a3b8'} />
            <text x={g.label.x} y={g.label.y + 4} textAnchor="middle" fontSize="11.5" fontWeight="700" fill={e.kind === 'main' ? '#ffffff' : '#475569'}>{label}</text>
          </g>
        );
      })}

      {/* Legend */}
      {legendRows.length > 0 && (
        <g>
          <line x1="28" y1={legendTop - 12} x2={W - 28} y2={legendTop - 12} stroke="#e2e8f0" />
          {legendRows.map((r, i) => r.head ? <text key={'lg' + i} x="28" y={r.y0 + 16} fontSize="13.5" fontWeight="700" fill="#004030">{r.head}</text> : (
            <g key={'lg' + i}>
              {r.dot && <circle cx="33" cy={r.y0 + r.fs - 4} r="4" fill={r.dot} />}
              {r.code && <text x={r.dot ? 42 : 30} y={r.y0 + r.fs} fontSize={r.fs} fontWeight="700" fill={r.codeFill || '#004030'}>{r.code}</text>}
              {r.lines.map((t, j) => <text key={j} x={30 + r.hw} y={r.y0 + r.fs + j * (r.fs + 5)} fontSize={r.fs} fontStyle={r.fi || 'normal'} fill={r.fill}>{t}</text>)}
            </g>
          ))}
        </g>
      )}
      <text x={W - 24} y={H - 14} textAnchor="end" fontSize="9.5" fill="#94a3b8">Proposal Diagram Studio · Prof. Shihmin Lo, NCNU IBS</text>
    </svg>
  );
};

/* ---------------- Small UI helpers ---------------- */
const Btn = ({ children, onClick, active, danger, disabled, title, className = '' }) => (
  <button type="button" title={title} disabled={disabled} onClick={onClick}
    className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium border transition-colors disabled:opacity-40 whitespace-nowrap
      ${danger ? 'border-red-400 text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/30'
        : active ? 'bg-[#004030] text-white border-[#004030] dark:bg-[#D8C3A5] dark:text-[#004030] dark:border-[#D8C3A5]'
          : 'border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700'} ${className}`}>{children}</button>
);
const Field = ({ label, children }) => (
  <label className="block mb-3"><span className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">{label}</span>{children}</label>
);
const inputCls = 'w-full px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#004030] dark:focus:ring-[#D8C3A5]';
const H3 = ({ children }) => <h3 className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5] mb-3 text-base">{children}</h3>;

/* ---------------- Side panel ---------------- */
const Panel = ({ t, lang, tab, setTab, doc, dia, tpl, selected, api, mode }) => {
  const d = dia;
  const node = selected && selected.type === 'node' ? d.nodes.find(n => n.id === selected.id) : null;
  const edge = selected && selected.type === 'edge' ? d.edges.find(e => e.id === selected.id) : null;
  const L = lang;
  const [addRole, setAddRole] = useState(tpl.defaultRole || tpl.roles[0].id);
  const [addLane, setAddLane] = useState(0);
  useEffect(() => { setAddRole(tpl.defaultRole || tpl.roles[0].id); setAddLane(0); }, [tpl]);
  const refName = (ref) => {
    if (ref.startsWith('n:')) { const n = d.nodes.find(x => 'n:' + x.id === ref); return n ? getText(n)[L === 'en' ? 'en' : 'zh'].title || n.id : '?'; }
    if (ref.startsWith('g:')) { const [, gid, l] = ref.split(':'); const g = tpl.groups.find(x => x.id === gid); return g ? g.label[L].split(' · ')[0] + (laneOn(tpl) ? ` [${String.fromCharCode(65 + +l)}]` : '') : '?'; }
    if (ref.startsWith('e:')) { const geo = computeGeometry(d, tpl, mode); return geo.codes[ref.slice(2)] || 'link'; }
    return ref;
  };
  const tabs = [['edit', t.tab_edit], ['add', t.tab_add], ['terms', t.tab_terms], ['help', t.tab_help]];

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex border-b border-slate-200 dark:border-slate-700 shrink-0" role="tablist">
        {tabs.map(([k, lbl]) => (
          <button key={k} role="tab" aria-selected={tab === k} onClick={() => setTab(k)}
            className={`flex-1 py-2.5 text-sm font-semibold border-b-2 ${tab === k ? 'border-[#004030] text-[#004030] dark:border-[#D8C3A5] dark:text-[#D8C3A5]' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>{lbl}</button>
        ))}
      </div>
      <div className="p-4 overflow-y-auto flex-1 min-h-0 text-sm">
        {tab === 'edit' && !node && !edge && (
          <div className="animate-fade-in">
            <p className="text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">{t.none_selected}</p>

/* ---------------- Access code + vault ---------------- */
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(code) {
  if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PDS_VAULT.salt), iterations: PDS_VAULT.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PDS_VAULT.iv) }, key, b64(PDS_VAULT.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function applyVault(p) {
  const tq = TEMPLATES.rp_quant;
  tq.title = p.title; tq.subtitle = p.subtitle; tq.nodes = p.nodes; tq.edges = p.edges;
  Object.assign(tq.glossary, p.glossary);
  tq.roles.forEach(r => { if (p.roleTerms[r.id]) r.terms = p.roleTerms[r.id]; });
  tq.encrypted = false;
  if (p.B) { const tb = TEMPLATES_B.rp_quant; tb.title = p.B.title; tb.subtitle = p.B.subtitle; tb.nodes = p.B.nodes; tb.edges = p.B.edges; tb.encrypted = false; }
}

/* ---------------- Onboarding tour ---------------- */
const TOUR_TARGETS = ['template', 'view', 'mode', 'canvas', 'connect', 'panel', 'export'];
const LS_TOUR = 'PDS_tour_done_v1';
const Tour = ({ t, onClose }) => {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const steps = t.tour_steps;
  useEffect(() => {
    const el = document.querySelector(`[data-tour="${TOUR_TARGETS[i]}"]`);
    if (!el) { setRect(null); return; }
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const measure = () => { const r = el.getBoundingClientRect(); setRect({ x: r.left, y: r.top, w: r.width, h: r.height }); };
    measure(); const id = setTimeout(measure, 250);
    window.addEventListener('resize', measure);
    return () => { clearTimeout(id); window.removeEventListener('resize', measure); };
  }, [i]);
  const finish = () => { try { localStorage.setItem(LS_TOUR, '1'); } catch (e) { } onClose(); };
  useEffect(() => { const h = e => { if (e.key === 'Escape') finish(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); });
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 6;
  const r = rect ? { x: Math.max(4, rect.x - pad), y: Math.max(4, rect.y - pad), w: Math.min(rect.w + pad * 2, vw - 8), h: Math.min(rect.h + pad * 2, vh - 8) } : null;
  const cardW = Math.min(340, vw - 24);
  let cx = 12, cy = vh / 2 - 90;
  if (r) {
    cx = Math.min(Math.max(12, r.x), vw - cardW - 12);
    const below = r.y + r.h + 12, above = r.y - 12 - 200;
    if (below + 200 < vh) cy = below; else if (above > 8) cy = above; else { cy = Math.max(12, Math.min(vh - 220, r.y + 20)); cx = Math.max(12, Math.min(vw - cardW - 12, r.x + r.w / 2 - cardW / 2)); }
  }
  return (
    <div className="fixed inset-0 z-[150]" role="dialog" aria-modal="true" aria-label={t.tour_label}>
      {r ? <div className="absolute rounded-xl transition-all duration-300 pointer-events-none" style={{ left: r.x, top: r.y, width: r.w, height: r.h, boxShadow: '0 0 0 9999px rgba(0,0,0,0.6)', outline: '3px solid #D8C3A5' }} />
        : <div className="absolute inset-0 bg-black/60" />}
      <div className="absolute bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-5 animate-fade-in" style={{ left: cx, top: cy, width: cardW }}>
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{t.tour_label} · {i + 1} / {steps.length}</span>
          <button onClick={finish} className="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">{t.tour_skip}</button>
        </div>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1.5">{steps[i].t}</h3>
        <p className="text-sm leading-relaxed text-slate-600 dark:text-slate-300">{steps[i].d}</p>
        <div className="flex items-center justify-between mt-4">
          <div className="flex gap-1">{steps.map((_, k) => <span key={k} className={`h-1.5 rounded-full ${k === i ? 'w-5 bg-[#004030] dark:bg-[#D8C3A5]' : 'w-1.5 bg-slate-300 dark:bg-slate-600'}`} />)}</div>
          <div className="flex gap-2">
            {i > 0 && <Btn onClick={() => setI(i - 1)}>{t.tour_prev}</Btn>}
            {i < steps.length - 1 ? <Btn active onClick={() => setI(i + 1)}>{t.tour_next}</Btn> : <Btn active onClick={finish}>{t.tour_done}</Btn>}
          </div>
        </div>
      </div>
    </div>
  );
};

  const svgRef = useRef(null), wrapRef = useRef(null), fileRef = useRef(null), menuRef = useRef(null);
  const t = dict[lang];

  const tpl = tplOf(doc.templateId, view);

  const showToast = (msg) => { setToast(msg); clearTimeout(window.__pdsToast); window.__pdsToast = setTimeout(() => setToast(null), 2400); };
  window.__pdsCopyright = () => showToast(t.copyright_msg);

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_PREF, JSON.stringify({ lang, isDark, mode })); } catch (e) { } }, [lang, isDark, mode]);

  useEffect(() => { if (hadSaved.current && !restored) { setRestored(true); setTimeout(() => showToast(t.toast_restored), 400); } }, []);
  useEffect(() => { document.title = `${t.brand} · ${t.title}`; }, [lang]);
  useEffect(() => {

  }, []);

  /* history */

  const commit = (next) => { pushHist(JSON.stringify(docRef.current)); setDocRaw(next); };
  const snap = () => pushHist(JSON.stringify(docRef.current));
  const undo = () => { const h = hist.current; if (!h.past.length) return; h.future.push(JSON.stringify(docRef.current)); setDocRaw(JSON.parse(h.past.pop())); setSelected(null); setHistTick(x => x + 1); };
  const redo = () => { const h = hist.current; if (!h.future.length) return; h.past.push(JSON.stringify(docRef.current)); setDocRaw(JSON.parse(h.future.pop())); setSelected(null); setHistTick(x => x + 1); };
  const setD = (fn, record) => { const cur = docRef.current; const nd = { ...cur, diagrams: { ...cur.diagrams, [cur.view]: fn(cur.diagrams[cur.view]) } }; if (record) commit(nd); else setDocRaw(nd); };
  const curDia = () => docRef.current.diagrams[docRef.current.view];
  const curTpl = () => tplOf(docRef.current.templateId, docRef.current.view);

  const modeRef = useRef(mode); modeRef.current = mode;
  const fit = useCallback(() => {
    const w = wrapRef.current ? wrapRef.current.clientWidth - 24 : 900;

  }, [mode]);
  useEffect(() => { fit(); }, [doc.templateId, doc.view]);
  useEffect(() => { const h = () => fit(); window.addEventListener('resize', h); return () => window.removeEventListener('resize', h); }, [fit]);

  /* api for panel */
  const api = {
    snap,
    setDiagram: (patch) => setD(d => ({ ...d, ...patch })),
    patchNode: (id, patch, record) => setD(d => ({ ...d, nodes: d.nodes.map(n => n.id === id ? { ...n, ...patch } : n) }), record),
    setNodeRole: (id, role) => setD(d => ({ ...d, nodes: d.nodes.map(n => { if (n.id !== id) return n; const r = roleOf(tpl, role); return { ...n, role, lane: laneOn(tpl) ? (r.perLane ? Math.max(0, n.lane) : -1) : -1 }; }) }), true),
    updateNodeText: (id, lng, field, val) => setD(d => ({
      ...d, nodes: d.nodes.map(n => {
        if (n.id !== id) return n;
        if (n.variants) { const v = n.variant || 'auto'; const cur = n.variants[v]; return { ...n, variants: { ...n.variants, [v]: { ...cur, [lng]: { ...cur[lng], [field]: val } } } }; }
        return { ...n, text: { ...n.text, [lng]: { ...n.text[lng], [field]: val } } };
      })
    })),
    patchEdge: (id, patch, record) => setD(d => ({ ...d, edges: d.edges.map(e => e.id === id ? { ...e, ...patch } : e) }), record),
    reverseEdge: (id) => setD(d => ({ ...d, edges: d.edges.map(e => e.id === id ? { ...e, from: e.to, to: e.from } : e) }), true),
    moveEdge: (id, dir) => setD(d => {
      const mains = d.edges.filter(e => e.kind === 'main'); const i = mains.findIndex(e => e.id === id); const j = i + dir;
      if (i < 0 || j < 0 || j >= mains.length) return d;
      const a = d.edges.indexOf(mains[i]), b = d.edges.indexOf(mains[j]); const arr = [...d.edges];[arr[a], arr[b]] = [arr[b], arr[a]]; return { ...d, edges: arr };
    }, true),
    deleteSel: () => {
      if (!selected) return;
      if (selected.type === 'node') {
        const ref = 'n:' + selected.id;
        setD(d => {
          const dead = new Set(d.edges.filter(e => e.from === ref || e.to === ref).map(e => 'e:' + e.id));
          return { ...d, nodes: d.nodes.filter(n => n.id !== selected.id), edges: d.edges.filter(e => e.from !== ref && e.to !== ref && !dead.has(e.to)) };
        }, true);
      } else {
        setD(d => ({ ...d, edges: d.edges.filter(e => e.id !== selected.id && e.to !== 'e:' + selected.id) }), true);
      }
      setSelected(null);
    },
    dupNode: (id) => {
      const n = curDia().nodes.find(x => x.id === id); if (!n) return;
      const nn = { ...deep(n), id: uid(n.role), x: n.x + 24, y: n.y + 24 };
      setD(d => ({ ...d, nodes: [...d.nodes, nn] }), true); setSelected({ type: 'node', id: nn.id });
    },
    addNode: (roleId, lane) => {
      const r = roleOf(tpl, roleId); const d0 = curDia();
      const perLane = laneOn(tpl) && r.perLane;
      const same = d0.nodes.filter(n => colOfN(tpl, n) === r.col && (!perLane || n.lane === lane) && (!tpl.phases || rowOfN(tpl, n) === rowOfN(tpl, { role: roleId })));
      const geo = computeGeometry(d0, tpl, mode);
      const y = same.length ? Math.max(...same.map(n => n.y + geo.boxes[n.id].h)) + G.GAPY : G.TOP + (tpl.topPad || 0);
      const nn = { id: uid(roleId), role: roleId, lane: perLane ? lane : -1, x: colX(tpl, r.col), y, optional: false, tag: '', text: { zh: { title: r.zh.replace(/^[①-⑨]\s*/, ''), items: [] }, en: { title: r.en.replace(/^[①-⑨]\s*/, ''), items: [] } } };
      setD(d => ({ ...d, nodes: [...d.nodes, nn] }), true); setSelected({ type: 'node', id: nn.id }); setTab('edit');
    },
    startConnect: () => { setConnect({ from: null }); setSelected(null); },
    startTour: () => { setSelected(null); setConnect(null); setTour(true); },
    setLaneText: (i, lng, v) => setD(d => ({ ...d, lanes: d.lanes.map((l, k) => k === i ? { ...l, text: { ...l.text, [lng]: v } } : l) })),
    addLane: () => {
      const d0 = curDia(); const max = tpl.lanes.max;
      if (d0.lanes.length >= max) { showToast(t.toast_lane_max.replace('{n}', max)); return; }
      const idx = d0.lanes.length; const map = {};
      const clones = d0.nodes.filter(n => isPerLane(tpl, n) && n.lane === 0).map(n => {
        let id = n.id.replace(/__L\d+$/, '') + '__L' + idx; if (d0.nodes.some(x => x.id === id)) id = uid(n.role);
        map['n:' + n.id] = 'n:' + id; return { ...deep(n), id, lane: idx };
      });
      const remap = (r) => map[r] || (r.startsWith('g:') && r.endsWith(':0') ? r.replace(/:0$/, ':' + idx) : null);
      const eClones = d0.edges.filter(e => e.kind === 'flow' && !e.to.startsWith('e:') && (remap(e.from) || remap(e.to))).map(e => ({ ...deep(e), id: uid('f'), from: remap(e.from) || e.from, to: remap(e.to) || e.to }));
      const nd = { ...d0, lanes: [...d0.lanes, { id: 'L' + idx, text: deep(tpl.laneNames[idx] || { zh: '比較列', en: 'Row' }) }], nodes: [...d0.nodes, ...clones], edges: [...d0.edges, ...eClones] };
      nd.nodes = autoLayout(nd, tpl, mode);
      setD(() => nd, true); setTimeout(fit, 30);
    },
    removeLane: (i) => {
      const d0 = curDia(); const name = d0.lanes[i].text[lang] || d0.lanes[i].text.zh;
      if (!window.confirm(t.confirm_remove_lane.replace('{name}', name))) return;
      const dead = new Set(d0.nodes.filter(n => isPerLane(tpl, n) && n.lane === i).map(n => 'n:' + n.id));
      const gDead = r => r.startsWith('g:') && +r.split(':')[2] === i;
      const shiftG = r => { if (!r.startsWith('g:')) return r; const p = r.split(':'); return +p[2] > i ? `g:${p[1]}:${+p[2] - 1}` : r; };
      let edges = d0.edges.filter(e => !dead.has(e.from) && !dead.has(e.to) && !gDead(e.from) && !gDead(e.to));
      const alive = new Set(edges.map(e => 'e:' + e.id)); edges = edges.filter(e => !e.to.startsWith('e:') || alive.has(e.to)).map(e => ({ ...e, from: shiftG(e.from), to: shiftG(e.to) }));

  const onConnectPick = (ref) => {
    if (!connect) return;

      setConnect({ from: ref }); return;
    }

    const e = { id: uid('e'), from: connect.from, to: ref, kind: tpl.defaultEdgeKind, sign: tpl.signs ? '+' : '', text: { zh: '', en: '' } };
    setD(d => ({ ...d, edges: [...d.edges, e] }), true);
    setConnect(null); setSelected({ type: 'edge', id: e.id }); setTab('edit');
  };

  const changeMode = (k) => {
    if (k === mode) return;
    setMode(k);
    const cur = docRef.current; const ds = {};
    VIEWS.forEach(v => { const dd = cur.diagrams[v]; ds[v] = { ...dd, nodes: autoLayout(dd, tplOf(cur.templateId, v), k) }; });

    setTimeout(fit, 30);
  };

  const switchTemplate = (id) => {
    if (id === doc.templateId) return;
    if (!window.confirm(t.confirm_template.replace('{name}', TEMPLATES[id].name[lang]))) return;

  };
  const switchView = (v) => {

  const clearAll = () => {
    if (!window.confirm(t.confirm_clear)) return;

    hist.current = { past: [], future: [] };
    setDocRaw(newDoc(doc.templateId, mode, doc.view));
    setSelected(null); setConnect(null); showToast(t.toast_cleared); setTimeout(fit, 30);
  };

  /* export */
  const download = (blob, name) => { const a = document.createElement('a'); const url = URL.createObjectURL(blob); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); showToast(t.toast_exported.replace('{file}', name)); };
  const svgString = () => {
    const src = svgRef.current; const clone = src.cloneNode(true);
    clone.querySelectorAll('.no-export').forEach(el => el.remove());
    const W = src.getAttribute('data-w'), H = src.getAttribute('data-h');
    clone.setAttribute('width', W); clone.setAttribute('height', H);
    clone.removeAttribute('style'); clone.setAttribute('font-family', G.FONT);
    clone.removeAttribute('data-w'); clone.removeAttribute('data-h');
    clone.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
    return { xml: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), W: +W, H: +H };
  };
  const base = () => `PDS_${tpl.short}_${stamp()}`;
  const exportSVG = () => { const { xml } = svgString(); download(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }), base() + '.svg'); };
  const exportPNG = () => {
    const { xml, W, H } = svgString(); const img = new Image();
    const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {
      const c = document.createElement('canvas'); const s = 2; c.width = W * s; c.height = H * s;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b && download(b, base() + '.png'), 'image/png');
    };
    img.src = url;
  };
  const exportJSON = () => download(new Blob([JSON.stringify({ app: 'PDS', version: 2, savedAt: new Date().toISOString(), ...doc }, null, 2)], { type: 'application/json' }), base() + '.json');
  const importJSON = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { showToast(t.import_error); e.target.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      try {
        const clean = sanitizeDoc(JSON.parse(r.result), mode);
        if (window.confirm(t.confirm_import.replace('{file}', f.name.slice(0, 80)))) { commit(clean); setSelected(null); setTimeout(fit, 30); }
      } catch (err) { showToast(t.import_error); }
      e.target.value = '';

    r.readAsText(f);
  };

  /* keyboard */
  useEffect(() => {
    const h = (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select'].includes(tag)) return;
      if (e.key === 'Escape') { setConnect(null); setSelected(null); setInfo(null); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); api.deleteSel(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });

  /* TTS narration of the diagram */
  const narrate = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTts('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTts('paused'); return; }
    if (tts === 'paused') { speechSynthesis.resume(); setTts('playing'); return; }
    const L = mode === 'both' ? lang : mode; const sep = L === 'zh' ? '。 ' : '. ';
    const d = dia; const geo = computeGeometry(d, tpl, mode);
    const byRows = tpl.readOrder === 'rows';
    const nodes = [...d.nodes].sort((a, b) => byRows ? ((a.y - b.y) || (a.x - b.x)) : ((a.x - b.x) || (a.y - b.y)));
    const texts = [t.tts_intro, d.title[L], d.subtitle[L]];
    const band = []; 
    nodes.forEach(n => { const x = getText(n)[L]; if (!x) return; const arr = inBand(tpl, n) ? band : texts; arr.push(x.title); x.items.filter(Boolean).forEach(i => arr.push(i)); });
    if (band.length) { texts.push(tpl.band.label[L]); texts.push(...band); }
    const mains = d.edges.filter(e => e.kind === 'main');

    mains.forEach(e => texts.push(`${geo.codes[e.id]}: ${e.text[L] || ''}`));

    }

    setTts('playing');
  };

  const selectNode = (s) => { setSelected(s); if (s) setTab('edit'); setInfo(i => (i && i.pin ? i : null)); };

  return (
    <div className="min-h-screen lg:h-screen flex flex-col bg-[#f4f4f4] dark:bg-[#121212] text-slate-800 dark:text-slate-100 font-sans selection:bg-[#004030] selection:text-white dark:selection:bg-[#D8C3A5] dark:selection:text-[#004030] overflow-x-hidden">
      {/* HEADER */}

          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.menu_templates}><IconMenu /></button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">

                    </button>

                    <button key={k} onClick={() => { setTab(k); setMenuOpen(false); }} className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700"><span className="w-6 text-center">{ic}</span><span>{lbl}</span></button>

                </div>

          </div>
        </div>
      </header>

      {/* MAIN */}

        <section className="flex-1 flex flex-col min-w-0 min-h-0">
          {/* Toolbar */}
          <div className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-3 py-2 flex flex-wrap items-center gap-2 shrink-0">
            <label data-tour="template" className="flex items-center gap-1.5 text-xs font-semibold text-slate-500"><IconLayers size={15} />{t.tpl_label}
              <select value={doc.templateId} onChange={e => switchTemplate(e.target.value)} className="ml-1 px-2 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm text-slate-800 dark:text-slate-100 font-medium">
                {TEMPLATE_ORDER.map(id => <option key={id} value={id}>{TEMPLATES[id].name[lang]}</option>)}
              </select>
            </label>
            <div data-tour="view" className="flex items-center gap-2"><span className="text-xs font-semibold text-slate-500 ml-1">{t.view_label}</span>
            <div className="flex" role="tablist" aria-label={t.view_label}>
              {['A', 'B', 'C'].map((k, i) => (
                <button key={k} role="tab" aria-selected={view === k} disabled={k === 'C'} title={k === 'C' ? t.view_C_soon : t['view_' + k]} onClick={() => switchView(k)}
                  className={`px-2.5 py-1.5 text-xs sm:text-sm border border-slate-300 dark:border-slate-600 ${i === 0 ? 'rounded-l-lg' : ''} ${i === 2 ? 'rounded-r-lg' : ''} ${i > 0 ? '-ml-px' : ''} disabled:opacity-40 disabled:cursor-not-allowed ${view === k ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`}>{t['view_' + k]}</button>
              ))}
            </div></div>
            <div data-tour="mode" className="flex items-center gap-2"><span className="text-xs font-semibold text-slate-500 ml-1">{t.disp_label}</span>
            <div className="flex">
              {[['zh', t.disp_zh], ['en', t.disp_en], ['both', t.disp_both]].map(([k, l], i) => (
                <button key={k} onClick={() => changeMode(k)} className={`px-2.5 py-1.5 text-xs sm:text-sm border border-slate-300 dark:border-slate-600 ${i === 0 ? 'rounded-l-lg' : ''} ${i === 2 ? 'rounded-r-lg' : ''} ${i > 0 ? '-ml-px' : ''} ${mode === k ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`}>{l}</button>
              ))}
            </div></div>
            <span className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />
            <Btn onClick={layout}>{t.btn_layout}</Btn>
            <span data-tour="connect"><Btn active={!!connect} onClick={() => connect ? setConnect(null) : api.startConnect()}>{t.btn_connect}</Btn></span>
            <Btn onClick={undo} disabled={!hist.current.past.length} title="Ctrl+Z">{t.btn_undo}</Btn>
            <Btn onClick={redo} disabled={!hist.current.future.length} title="Ctrl+Y">{t.btn_redo}</Btn>
            <span className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />
            <Btn onClick={() => setZoom(z => Math.max(0.3, +(z - 0.1).toFixed(2)))} title={t.zoom_out}>−</Btn>
            <span className="text-xs w-10 text-center tabular-nums">{Math.round(zoom * 100)}%</span>
            <Btn onClick={() => setZoom(z => Math.min(2, +(z + 0.1).toFixed(2)))} title={t.zoom_in}>＋</Btn>
            <Btn onClick={fit}>{t.zoom_fit}</Btn>
            <span className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />
            <span data-tour="export" className="flex flex-wrap gap-2">
            <Btn onClick={exportSVG}>{t.btn_export_svg}</Btn>
            <Btn onClick={exportPNG}>{t.btn_export_png}</Btn>
            <Btn onClick={exportJSON}>{t.btn_export_json}</Btn>
            <Btn onClick={() => fileRef.current && fileRef.current.click()}>{t.btn_import_json}</Btn>
            </span>
            <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={importJSON} />
            <Btn danger onClick={clearAll}>{t.btn_clear}</Btn>
          </div>
          {connect && (
            <div className="bg-amber-50 dark:bg-amber-900/30 text-amber-800 dark:text-amber-200 border-b border-amber-200 dark:border-amber-800 px-4 py-2 text-sm flex items-center justify-between gap-3 shrink-0">
              <span>{connect.from ? t.connect_hint2 : t.connect_hint1}</span>
              <Btn onClick={() => setConnect(null)}>{t.connect_cancel}</Btn>
            </div>
          )}
          {/* Canvas */}
          <div ref={wrapRef} data-tour="canvas" className="flex-1 overflow-auto p-3 min-h-[60vh] lg:min-h-0 relative"
            style={{ backgroundImage: `radial-gradient(${isDark ? '#334155' : '#cbd5e1'} 1px, transparent 1px)`, backgroundSize: '18px 18px' }}
            onContextMenu={(e) => { e.preventDefault(); showToast(t.copyright_msg); }}
            onScroll={() => info && !info.pin && setInfo(null)}>
            <div className="inline-block shadow-xl rounded-md overflow-hidden ring-1 ring-slate-300 dark:ring-slate-600">
              <Diagram doc={doc} dia={dia} tpl={tpl} mode={mode} selected={selected} onSelect={selectNode}
                onDragNode={(id, x, y) => setD(d => ({ ...d, nodes: d.nodes.map(n => n.id === id ? { ...n, x, y } : n) }))}
                onDragEnd={(snapshot) => pushHist(snapshot)}
                connect={connect} onConnectPick={onConnectPick} zoom={zoom} svgRef={svgRef} onInfo={onInfo} />
            </div>
          </div>
          <div className="px-4 py-1 text-[11px] text-slate-400 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 shrink-0">{t.saved_badge}</div>
        </section>
        <aside data-tour="panel" className="w-full lg:w-[360px] shrink-0 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 min-h-[420px] lg:min-h-0 flex flex-col">
          <Panel t={t} lang={lang} tab={tab} setTab={setTab} doc={doc} dia={dia} tpl={tpl} selected={selected} api={api} mode={mode} />
        </aside>
      </main>

      {/* Term popover */}
      {info && (
        <div className="fixed z-[90] w-80 max-w-[calc(100vw-1rem)] bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-4 animate-fade-in"
          style={{ left: Math.max(8, Math.min(info.x + 12, window.innerWidth - 336)), top: Math.max(72, Math.min(info.y + 12, window.innerHeight - 320)) }}
          onMouseLeave={() => !info.pin && setInfo(null)}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{t.info_terms} · {getText(info.n)[lang === 'en' ? 'en' : 'zh'].title}</span>
            <button className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-lg leading-none" aria-label={t.close} onClick={() => setInfo(null)}>×</button>
          </div>
          <div className="max-h-64 overflow-y-auto space-y-3">
            {info.terms.map(k => { const g = tpl.glossary[k]; return (
              <div key={k}>
                <div className="flex items-center justify-between gap-2"><span className="font-bold text-[#004030] dark:text-[#D8C3A5] text-sm">{g[lang][0]}</span>
                  <button className="shrink-0" aria-label={t.btn_speak} onClick={() => speak(joinSay([g[lang][0], g[lang][1]], lang), lang)}>🔊</button></div>
                <p className="text-sm leading-relaxed text-slate-700 dark:text-slate-300">{g[lang][1]}</p>
              </div>); })}
          </div>
        </div>
      )}

      {tour && <Tour t={t} onClose={() => setTour(false)} />}

      {/* Toast */}
      {toast && <div className="fixed bottom-12 left-1/2 -translate-x-1/2 z-[120] bg-[#004030] text-[#D8C3A5] dark:bg-[#D8C3A5] dark:text-[#004030] px-4 py-2 rounded-lg shadow-xl text-sm font-medium animate-fade-in">{toast}</div>}

      {/* FOOTER */}
      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0 gap-2">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

function Root() {
  const [state, setState] = useState('checking');
  useEffect(() => {
    let code = null; try { code = localStorage.getItem(LS_CODE); } catch (e) { }
    if (!code) { setState('locked'); return; }
    openVault(code).then(p => { applyVault(p); setState('open'); }).catch(() => { try { localStorage.removeItem(LS_CODE); } catch (e) { } setState('locked'); });
  }, []);
  const logout = () => { try { localStorage.removeItem(LS_CODE); } catch (e) { } location.reload(); };
  if (state === 'checking') return <div className="min-h-screen bg-[#f4f4f4] dark:bg-[#121212]" />;
  if (state === 'locked') return <Gate onOpen={() => setState('open')} />;
  return <App onLogout={logout} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

}
</script>
</body>
</html>
