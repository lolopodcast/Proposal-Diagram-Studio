<script>
/* ---------- Front-end protection (Domain lock · iframe busting · smart right-click) ---------- */
(function(){
  var ALLOWED = ['lolopodcast.github.io','localhost','127.0.0.1'];
  var REDIRECT = 'https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo';
  var okHost = location.protocol === 'file:' || ALLOWED.some(function(d){ return location.hostname === d || location.hostname.endsWith('.'+d); });
  if (!okHost) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1><p>This resource is not authorised on this domain.</p></div>';
    window.__PDS_BLOCKED = true;
    setTimeout(function(){ location.href = REDIRECT; }, 3000);
    return;
  }
  if (window.self !== window.top) {
    try { window.top.location.href = window.self.location.href; }
    catch(e) { document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Frame Blocked</h1><p>This content cannot be embedded.</p></div>'; window.__PDS_BLOCKED = true; }
  }
  var toast = function(){ if (window.__pdsCopyright) window.__pdsCopyright(); };
  document.addEventListener('contextmenu', function(e){
    var sel = (window.getSelection() || '').toString().trim();
    var tag = (e.target.tagName || '').toLowerCase();
    if (sel.length > 0 || tag === 'input' || tag === 'textarea') return true;
    e.preventDefault(); toast();
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || (e.ctrlKey && k === 'u') || (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) >= 0)) { e.preventDefault(); toast(); }
  });
  document.addEventListener('dragstart', function(e){ if (e.target.tagName === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault(); });
})();
</script>

      { k: 'q6', from: 'n:scope', to: 'n:source', kind: 'main', text: { zh: '（進階）同一方向路邊（進城或出城）的異品牌分店，競爭是否比對側更直接？', en: '(Advanced) Is rivalry more direct on the same side of the road (inbound / outbound) than across it?' } },
      { k: 'q1', from: 'n:source', to: 'n:parts', kind: 'main', text: { zh: '共同供應商的商品各家都有；自有品牌、獨家商品與店內服務，哪一種附加價值讓品牌在群聚中仍能差異化？', en: 'Which added value — private labels, exclusive products or in-store services — sets a brand apart in a cluster?' } },
      { k: 'q2', from: 'n:parts', to: 'n:amc', kind: 'main', text: { zh: '異品牌分店是否比隨機更常彼此相鄰（CLQ > 1）？群聚代表卡位競爭，還是共同吸引人潮？', en: 'Do rival stores neighbour each other more than chance (CLQ > 1)? Is that positioning, or co-operation that draws shoppers?' } },

      { k: 'q12', from: 'n:scope__L1', to: 'n:source__L1', kind: 'main', text: { zh: '外送平台與便利商店、超市在生鮮雜貨外送上，是競爭還是合作（範疇 S）？', en: 'In grocery delivery, are platforms competing or co-operating with convenience stores and supermarkets (Scope, S)?' } },
      { k: 'q7', from: 'n:source__L1', to: 'n:parts__L1', kind: 'main', text: { zh: '公平會對併購案的審查與決定，如何改變外送平台的賽局規則（R）？', en: 'How do the Fair Trade Commission\'s merger reviews and decisions change the rules (R) of the delivery game?' } },
      { k: 'q8', from: 'n:parts__L1', to: 'n:amc__L1', kind: 'main', text: { zh: '外送平台的補貼與促銷，對手多快跟進？哪一方較常先發動？', en: 'How fast do rivals match a platform\'s subsidies and promotions, and who usually moves first?' } },

    glossary: {
      tracks: { zh: ['兩個 TP 軌道', '各組二選一。軌道 1 競合動態分析：以開放資料分析連鎖門市的競合（範例：便利商店）。軌道 2 平台策略分析：分析一家平台企業與對手（範例：餐飲外送平台）。兩軌的時程、提案格式、評分與交付物（雙語網頁＋ 2 分鐘影片）都相同。'], en: ['Two TP Tracks', 'Each group picks one. Track 1, Co-opetitive Dynamics Analysis: store-based chains with open data (example: convenience stores). Track 2, Platform Strategy Analysis: one platform business and its rivals (example: food delivery). Both share the schedule, proposal format, grading and deliverables (bilingual page + two-minute video).'] },
      lanes: { zh: ['比較列', '圖中的一條水平列代表一個案例，最多 3 列。範例的 A 列示範軌道 1（埔里便利商店）、B 列示範軌道 2（外送平台）；各組保留自己軌道的那一列。軌道 1 可用「新增比較列」加入其他地區，每個地區是獨立案例，不直接比較。'], en: ['Comparison Row', 'Each horizontal row is one case, up to three. In the example, row A shows Track 1 (Puli convenience stores) and row B shows Track 2 (food delivery); keep the row for your own track. Track 1 groups can add rows for other areas; each area is a separate case, not compared directly.'] },
      decay: { zh: ['為什麼不用單一衰減曲線', '距離衰減（Tobler, 1970；Huff, 1963 的冪函數；Wilson, 1971 的指數函數）說明越遠影響越小，但參數需實證校準。單一曲線無法同時代表步行、機車、汽車三種競合者，因此本範本以三圈家數為主。'], en: ['Why not a single decay curve', 'Distance decay (Tobler, 1970; power functions in Huff, 1963; exponential in Wilson, 1971) says farther matters less, but its parameters need empirical calibration. One curve cannot represent walking, scooter and car rivals at once, so this template uses three-ring counts.'] },
      clq: { zh: ['CLQ 共區位商數（進階）', 'A 品牌分店的最近鄰居是 B 品牌的比例 ÷ 隨機時應有的比例（B 店數 ÷ 全部店數 − 1）。> 1 吸引、群聚；≈ 1 隨機；< 1 迴避。有方向性：A→B 與 B→A 可不同，看得出誰跟著誰開。例：1141 資料試算，埔里全家 11 家的最近鄰居都是 7-11，CLQ ≈ 1.9；7-11 對 7-11 約 0.4。只看最近一家；樣本小時需以隨機重排檢定。（Leslie & Kronenfeld, 2011）'], en: ['Colocation Quotient (CLQ, advanced)', 'The share of A stores whose nearest neighbour is a B store ÷ the share expected by chance (B stores ÷ all stores − 1). > 1 attraction; ≈ 1 random; < 1 avoidance. It is directional (A→B can differ from B→A), showing who follows whom. Example from the 1141 data: all 11 FamilyMart stores in Puli have a 7-ELEVEN as nearest neighbour, CLQ ≈ 1.9; 7-ELEVEN to 7-ELEVEN is about 0.4. Uses only the nearest store; small samples need a random-relabelling test. (Leslie & Kronenfeld, 2011)'] },
      pxweight: { zh: ['全聯的權重', '全聯是超市，但商品與服務組合越來越接近便利商店。權重採資源相似性：便利商店的商品與服務項目中，全聯提供了幾成（0～1）；尚未蒐集服務清單前預設為 1。'], en: ['PX Mart Weight', 'PX Mart is a supermarket, but its product and service mix increasingly resembles convenience stores. Its weight is resource similarity: the share (0–1) of a convenience store\'s products and services that PX Mart also offers; 1 until the service list is collected.'] },
      rings: { zh: ['三圈家數', '以步行、機車、汽車三種交通方式界定競合範圍，分別計算圈內的異品牌與同品牌家數，六個數字分開呈現。市、鎮、里：50／100／500 m；鄉、村：100／500／1,000 m。依地區實際型態選用，不只看行政名稱。'], en: ['Three-ring Counts', 'Walk, scooter and car define the competitive range; count rival and same-brand stores in each ring and report the six numbers separately. Towns and urban wards: 50 / 100 / 500 m; rural townships and villages: 100 / 500 / 1,000 m. Choose by the actual pattern, not just the administrative label.'] },
      geocode: { zh: ['地理編碼', '把地址轉成經緯度。建議先整理地址（取第一個門牌號、去除「地下」等描述、統一台／臺），再用內政部 TGOS 全國門牌地址定位；找不到的以 ArcGIS 或 OpenStreetMap 補（課堂工具 Map-In Tool）。使用 OpenStreetMap 須標示「© OpenStreetMap contributors」。'], en: ['Geocoding', 'Turning addresses into coordinates. Clean addresses first (first house number, drop "basement" notes, unify 台/臺), then use the TGOS national address locator; fill gaps with ArcGIS or OpenStreetMap (the in-class Map-In Tool). Credit "© OpenStreetMap contributors" when using OSM.'] },
      chosen: { zh: ['Chosen firm/platform', 'W9 提案格式的第二項：選定要分析的企業或平台。軌道 1 範例是便利商店與超市五大品牌，軌道 2 範例是 Uber Eats 與 foodpanda。'], en: ['Chosen Firm / Platform', 'The second item of the W9 proposal format: the firms or platforms to analyse. The Track 1 example takes five convenience-store and supermarket brands; the Track 2 example takes Uber Eats and foodpanda.'] },
      aq: { zh: ['分析問題 AQ', 'TP 版的「假說」：標在連線上，說明兩個節點之間要回答的問題，並自動編號列在圖下方。範例的 AQ1–AQ6 屬軌道 1、AQ7–AQ12 屬軌道 2；刪除另一列後會自動重新編號為 AQ1–AQ6。'], en: ['Analysis Question (AQ)', 'The TP counterpart of a hypothesis: written on a link, stating what the two nodes should answer, auto-numbered below the diagram. In the example AQ1–AQ6 belong to Track 1 and AQ7–AQ12 to Track 2; deleting the other row renumbers yours as AQ1–AQ6.'] },
      opendata: { zh: ['全國5大超商資料集', '政府開放資料平台（data.gov.tw）的經濟部商工登記資料：統一超商、全家、萊爾富、來來超商（OK）、全聯的分公司名稱、地址、狀態與核准設立日期，約 2 萬筆；沒有經緯度，需自行地理編碼。'], en: ['Five Major Convenience Store Chains Dataset', 'Company-registry data on data.gov.tw: branch names, addresses, status and approval dates for 7-ELEVEN, FamilyMart, Hi-Life, OK mart (Lai Lai) and PX Mart, about 20,000 records; no coordinates, so geocoding is needed.'] },
      news2y: { zh: ['近兩年新聞與報告', '軌道 2 的主要證據：近兩年的新聞、公平會決定、公司年報與產業報告。每則保留連結與日期；付費報告只摘要、引用，不轉貼全文。'], en: ['Two Years of News & Reports', 'The main evidence for Track 2: news from the past two years, Fair Trade Commission decisions, annual reports and industry reports. Keep each link and date; paid reports are summarised and cited, never reposted.'] },
      workagent: { zh: ['Work／Task Agent', 'AI 平台中能自行搜尋、閱讀、整理與計算的代理功能（例如深度研究、資料分析）；結果一定要由組員查證。'], en: ['Work / Task Agent', 'The agent features of an AI platform that search, read, organise and compute (e.g. deep research, data analysis); members always verify the output.'] },
      tos: { zh: ['服務條款與 robots.txt', '網站宣告自動存取規則的檔案與使用條款；明確禁止時改用半自動整理，不以技術手段規避。'], en: ['Terms of Service & robots.txt', "A site's rules for automated access; where it is forbidden, compile the data semi-automatically instead of circumventing it."] },
      matchrate: { zh: ['比對差異率', '地理編碼後反查店名或抽查官網，對不上的比例；這是軌道 1 在 W16「Data Quality」最直接的證據。1141 範例約 15% 店名不符，但其中約三成是「統一超商／7-Eleven」這類品牌別名誤判，所以要先套別名表。'], en: ['Mismatch Rate', 'The share of stores whose reverse-geocoded name or website location does not match — the most direct Track 1 evidence for W16 Data Quality. In the 1141 example about 15% did not match, but roughly a third were brand-alias false alarms (e.g. 統一超商 vs 7-Eleven), so apply an alias list first.'] },
      mops: { zh: ['MOPS 公開資訊觀測站與年報', '上市櫃公司的財務報表與年報；便利商店五個品牌中只有統一超與全家是上市櫃公司。外送平台則看 Uber、Delivery Hero 等公司的年報。'], en: ['MOPS & Annual Reports', "Taiwan's disclosure site for listed companies; of the five store brands only President Chain Store and FamilyMart are listed. For delivery platforms, use the annual reports of Uber, Delivery Hero and others."] },
      coopetition: { zh: ['競合 Co-opetition', '同時競爭與合作：不只把對手看成威脅，也看互補者如何一起把餅做大，再來分餅。'], en: ['Co-opetition', 'Competing and co-operating at once: rivals are not only threats; complementors help make the pie bigger before it is divided.'] },
      parts: { zh: ['PARTS', '分析與改變賽局的五個槓桿：Players 參賽者、Added value 附加價值、Rules 規則、Tactics 戰術、Scope 範疇。'], en: ['PARTS', 'Five levers for analysing and reshaping the game: Players, Added value, Rules, Tactics, Scope.'] },
      valuenet: { zh: ['價值網 Value Net', '以企業為中心，上下是顧客與供應商，左右是競爭者與互補者；同一家公司可能同時扮演兩種角色。'], en: ['Value Net', 'The firm at the centre, customers and suppliers above and below, competitors and complementors on either side; one company can play two roles at once.'] },
      complementor: { zh: ['互補者', '讓顧客更看重你的產品的一方。例如物流、金流業者讓門市的取貨與繳費服務更有價值；地圖與金流服務讓外送平台更好用。'], en: ['Complementor', 'A player that makes customers value your product more — e.g. logistics and payment providers make in-store pickup and bill payment more valuable; maps and payments make delivery apps easier to use.'] },
      addedvalue: { zh: ['附加價值', '有你在與沒有你在時，整個賽局價值的差額。共同供應商的商品各家都有，附加價值低；自有品牌、獨家服務或獨家餐廳才是差異所在。'], en: ['Added Value', 'The size of the pie with you minus the size without you. Products from shared suppliers add little; private labels, exclusive services or exclusive restaurants make the difference.'] },
      tactics: { zh: ['戰術 Tactics', '改變他人認知的行動，例如展店選址、在同一側路邊卡位、促銷與補貼訊號。'], en: ['Tactics', "Moves that shape others' perceptions, such as site selection, taking the same side of the road, or promotion and subsidy signals."] },
      amc: { zh: ['AMC 架構', '對手是否回應，取決於察覺（Awareness）、動機（Motivation）與能力（Capability）三者是否同時具備。'], en: ['AMC Framework', 'Whether a rival responds depends on awareness, motivation and capability all being present.'] },
      commonality: { zh: ['市場共同性與資源相似性', 'Chen (1996) 的競爭者分析兩軸：市場重疊越多、資源越相似，雙方越可能直接交手。軌道 1 以三圈家數衡量市場重疊，以商品與服務的重疊比例衡量資源相似。'], en: ['Market Commonality & Resource Similarity', 'The two axes of competitor analysis in Chen (1996): the more markets overlap and resources resemble, the more likely direct rivalry. In Track 1, three-ring counts measure market overlap and the overlap of products and services measures resource similarity.'] },
      actresp: { zh: ['行動—回應', '競爭動態的基本單位：一方發動行動（例如展店、降價、推出新服務），另一方是否、何時、以何種方式回應。'], en: ['Action–Response', 'The basic unit of competitive dynamics: one firm acts (e.g. opens a store, cuts prices, launches a service) and the other decides whether, when and how to respond.'] },
      actiontag: { zh: ['行動類型標註', '軌道 2 替每則新聞標上行為者與行動類型（價格、促銷、新服務、進入市場、結盟、併購）；AI 先標，組員抽查修正，再按季統計。'], en: ['Action-type Tagging', 'Track 2 tags each news item with its actor and action type (pricing, promotion, new service, market entry, alliance, acquisition); AI tags first, members check, then count by quarter.'] },
      cluster: { zh: ['群聚', '異品牌分店集中在同一地點。它可能是卡位競爭，也可能是一起吸引人潮的合作，正是「競合」的例子；是否「比隨機更集中」可用 CLQ 判斷。'], en: ['Clustering', 'Rival stores concentrated in one spot — competitive positioning or co-operation that draws shoppers: a case of co-opetition. CLQ tests whether it is more concentrated than chance.'] },
      sameside: { zh: ['同側與對側（進階）', '同一方向路邊的分店搶同一批用路人；對側的分店要過馬路才到，競爭較間接。需要道路資料判斷，列為選配。'], en: ['Same Side vs Opposite Side (advanced)', 'Stores on the same side of the road compete for the same passers-by; those across the road compete less directly. It needs road data, so it is optional.'] },
      platform: { zh: ['平台', '連接兩群以上使用者、讓他們彼此交換價值的商業模式；門市透過店內機台連接消費者與服務提供者，外送平台連接消費者、餐廳與外送員。'], en: ['Platform', 'A business model that connects two or more user groups so they exchange value; a store connects shoppers with service providers through kiosks, and a delivery app connects consumers, restaurants and couriers.'] },
      netfx: { zh: ['網路效應', '使用者越多，每位使用者得到的價值越高。同邊：同一群使用者之間；跨邊：一邊越多，另一邊越想加入。'], en: ['Network Effects', 'Each user gains more as the user base grows. Same-side: within one group; cross-side: more on one side attracts the other.'] },
      kiosk: { zh: ['店內多功能機台', '例如 7-ELEVEN 的 ibon、全家的 FamiPort，提供票券、繳費、列印等服務，讓門市具有平台性質。'], en: ['In-store Kiosk', "e.g. 7-ELEVEN's ibon and FamilyMart's FamiPort, offering tickets, bill payment and printing — the feature that makes a store platform-like."] },
      monetize: { zh: ['獲利模式', '平台向哪一邊收費、收多少：抽成、外送費、訂閱會員、廣告、服務手續費。[PR] Ch.6。'], en: ['Monetisation', 'Which side the platform charges and how much: commissions, delivery fees, subscriptions, ads, service fees. [PR] Ch.6.'] },
      multihoming: { zh: ['多棲', '同一位使用者同時使用多個平台，例如餐廳同時上架兩個外送平台。多棲越普遍，單一平台越難靠網路效應鎖住使用者。'], en: ['Multi-homing', 'One user on several platforms at once, e.g. a restaurant listed on two delivery apps. The more common it is, the harder it is for one platform to lock users in through network effects.'] },
      nn: { zh: ['最近異品牌距離', '每家分店到最近一家「不同品牌」分店的距離；平均越短，表示越群聚。'], en: ['Nearest Rival Distance', 'The distance from each store to the closest store of a different brand; the shorter the average, the stronger the clustering.'] },
      pkpi: { zh: ['平台 KPI', '取自年報與財報的平台指標，例如訂單數、交易總額、抽成率、活躍使用者；不同公司定義不同，引用時要註明定義與出處。[PR] Ch.9。'], en: ['Platform KPIs', 'Platform metrics from annual reports, e.g. orders, gross bookings, take rate, active users; definitions differ by company, so state the definition and source. [PR] Ch.9.'] },
      verify: { zh: ['人工查證', 'AI 算出的數字與標註都要由組員回到原始資料核對；查不到出處的內容不採用。'], en: ['Human Verification', 'Members check every AI-computed figure and tag against the original data; anything without a source is dropped.'] },
      insight: { zh: ['商業洞察', 'W16 評分占 20%：不只呈現資料，還要說明「所以呢」，給出可行的策略建議。'], en: ['Business Insight', 'Worth 20% at W16: not just showing data but explaining "so what" and giving actionable strategy advice.'] },
      deployed: { zh: ['已部署的雙語網頁', '可用網址開啟的 GitHub Pages 網頁，中英切換，內嵌 2 分鐘影片；W16 前一個週末上線，全班與教授線上互評。'], en: ['Deployed Bilingual Web Page', 'A GitHub Pages site opened by URL, with a language switch and the embedded two-minute video; it goes live the weekend before W16 for online evaluation by the class and the professors.'] },
      video: { zh: ['2 分鐘雙語動畫影片', '用 Vibe Coding 製作的網頁動畫，錄製成影片：英文旁白＋中英字幕，嵌入網頁；TP 不規定每位組員都要口說。'], en: ['Two-minute Bilingual Video', 'A web animation made through Vibe Coding and recorded as a video: English narration with Chinese and English subtitles, embedded in the page; not every member has to speak.'] },
      vibecoding: { zh: ['Vibe Coding', '用自然語言請 Coding Agent 產生程式，組員負責說清楚需求、檢查結果、反覆修改。'], en: ['Vibe Coding', 'Asking a Coding Agent for code in natural language; members state the requirements clearly, check the result and iterate.'] },
      aidisclose: { zh: ['AI 使用揭露', '在網頁頁尾標示使用的 AI 平台與協助範圍；AI 產出經組員審閱才發布。'], en: ['AI-use Disclosure', 'The page footer states the AI platforms used and where they helped; AI output is reviewed by the team before release.'] },
      assistant: { zh: ['（選配）AI 助理', '進階選項，不列入必做：以平台原生功能（例如 GPTs、Gems）建立以 KB.md 與資料為知識來源的助理，或自建 Cloudflare Workers 後端。自建後端需要 API 金鑰與費用，金鑰絕不可放在網頁或 GitHub。'], en: ['(Optional) AI Assistant', 'An advanced option, not required: a platform-native assistant (e.g. a GPT or Gem) grounded in KB.md and the data, or a self-built Cloudflare Workers back end. A back end needs an API key and costs money; never put keys in the page or on GitHub.'] }
    },
    guide: {
      zh: ['A 圖呈現 TP 的「分析邏輯」：從選定的軌道與題目，經過 PARTS、AMC 與平台策略三個分析視角，到資料分析、商業洞察與成果（雙語網頁＋影片）。節點下方的標籤對應課程週次、模組或教材。', '兩個軌道各組二選一：A 列示範軌道 1 競合動態分析（埔里的便利商店與超市五大品牌，資料來自「全國5大超商資料集」，以步行、機車、汽車三圈界定競合範圍；埔里分店間距較大，採鄉村標準 100／500／1,000 m）；B 列示範軌道 2 平台策略分析（Uber Eats 與 foodpanda，以近兩年新聞、公平會決定與年報為證據）。範例內容僅供示範，請以最新資料與新聞查證。', '建議步驟：① 刪除不是你們軌道的那一列，在①填入題目與範圍；軌道 1 可在「新增」分頁加入其他地區（最多 3 列）。② 在②選擇資料來源模式：自動與半自動都是正式合格做法。③ 依 PARTS、AMC、平台策略完成③④⑤。④ 在⑥⑦寫出分析方法與預期的商業洞察。⑤ 在連線上寫出你們的分析問題（AQ），系統會自動編號並列在圖下方。⑨ AI 助理是選配，可刪除。', '完成後匯出 SVG 或 PNG，放進 W9 提案。'],
      en: ['Diagram A shows the analysis logic of the TP: from the chosen track and topic, through three lenses — PARTS, AMC and platform strategy — to data analysis, business insight and the output (bilingual page + video). The tag under each node points to a course week, module or reading.', 'Each group picks one of two tracks. Row A shows Track 1, Co-opetitive Dynamics Analysis (the five convenience-store and supermarket brands in Puli, from the Five Major Chains open dataset, with walk, scooter and car rings; Puli\'s stores are far apart, so it uses the rural standard 100 / 500 / 1,000 m). Row B shows Track 2, Platform Strategy Analysis (Uber Eats and foodpanda, with two years of news, Fair Trade Commission decisions and annual reports as evidence). The example content is for illustration; verify it against the latest data and news.', 'Suggested steps: (1) delete the row that is not your track and fill ① with your topic and scope; Track 1 groups can add other areas in the Add tab (up to three rows). (2) Choose the source mode in ②: both automatic and semi-automatic are fully acceptable. (3) Work through PARTS, AMC and platform strategy in ③④⑤. (4) State the analysis methods and expected insight in ⑥⑦. (5) Write your analysis questions (AQ) on the links; they are numbered automatically and listed below the diagram. ⑨ the AI assistant is optional and can be deleted.', 'When finished, export SVG or PNG for your W9 proposal.']
    }

    glossary: Object.assign({

      tracks: { zh: ['兩個 TP 軌道', '軌道 1 以開放資料分析連鎖門市的競合；軌道 2 分析一家平台企業與對手。兩軌的流程相同，只有資料來源與計算內容不同。'], en: ['Two TP Tracks', 'Track 1 analyses the co-opetition of store chains with open data; Track 2 analyses one platform business and its rivals. The workflow is the same; only the sources and measures differ.'] },
      opendata: { zh: ['全國5大超商資料集', '政府開放資料平台（data.gov.tw）的商工登記資料，含五大品牌的分公司名稱、地址、狀態與核准設立日期；狀態 1 應為營業中。沒有經緯度，需自行地理編碼。'], en: ['Five Major Chains Dataset', 'Company-registry open data on data.gov.tw with branch names, addresses, status and approval dates for the five brands; status 1 should mean operating. No coordinates, so geocoding is needed.'] },
      news2y: { zh: ['近兩年新聞與報告', '軌道 2 的主要證據：近兩年新聞、公平會決定、年報與產業報告；每則保留連結與日期，付費報告只摘要、引用。'], en: ['Two Years of News & Reports', 'The main Track 2 evidence: two years of news, Fair Trade Commission decisions, annual and industry reports; keep each link and date, and only summarise and cite paid reports.'] },
      mops: { zh: ['MOPS 與年報', '上市櫃公司的財務報表與年報（統一超、全家）；外送平台看 Uber、Delivery Hero 等公司的年報。'], en: ['MOPS & Annual Reports', "Listed companies' statements and annual reports (President Chain Store, FamilyMart); for delivery platforms, the annual reports of Uber, Delivery Hero and others."] },
      tos: { zh: ['服務條款與 robots.txt', '網站宣告自動存取規則的檔案與使用條款；明確禁止時改用半自動整理，不以技術手段規避。'], en: ['Terms of Service & robots.txt', "A site's rules for automated access; where it is forbidden, compile the data semi-automatically instead of circumventing it."] },
      platform: { zh: ['AI 平台', 'ChatGPT、Gemini、Claude 三選一。免費版功能有限，組內至少一人使用付費方案，其他組員可用免費版協作。'], en: ['AI Platform', 'One of ChatGPT, Gemini or Claude. Free tiers are limited, so at least one member uses a paid plan; others can work on free tiers.'] },
      kbmd: { zh: ['KB.md', '用 Markdown 寫成的小組知識庫：題目背景、分析架構、名詞、決定事項。上傳到 AI 專案，讓每次對話都從同一份脈絡開始。'], en: ['KB.md', 'The group knowledge base written in Markdown: topic background, frameworks, terms and decisions. Uploaded to the AI project so every chat starts from the same context.'] },
      sheet: { zh: ['共用資料表', 'Google Sheets；軌道 1 一家分店一列，軌道 2 一則新聞一列。所有計算與統計都從這張表來。'], en: ['Shared Data Sheet', 'Google Sheets; one row per store for Track 1, one row per article for Track 2. Every measure and count comes from this sheet.'] },
      workagent: { zh: ['Work／Task Agent', 'AI 平台中能自行搜尋、閱讀、整理與計算的代理功能（例如深度研究、資料分析）；結果一定要查證。'], en: ['Work / Task Agent', 'The agent features of an AI platform that search, read, organise and compute (e.g. deep research, data analysis); always verify the output.'] },
      geocode: { zh: ['地理編碼', '把地址轉成經緯度。建議以內政部 TGOS 全國門牌地址定位為主（需申請），找不到的再用 ArcGIS 或 OpenStreetMap 補；OSM 須標示「© OpenStreetMap contributors」。'], en: ['Geocoding', 'Turning addresses into coordinates. Use the TGOS national address locator first (application required) and fill gaps with ArcGIS or OpenStreetMap; credit "© OpenStreetMap contributors" for OSM.'] },
      actiontag: { zh: ['行動類型標註', '替每則新聞標上行為者與行動類型（價格、促銷、新服務、進入市場、結盟、併購）；AI 先標，組員抽查修正。'], en: ['Action-type Tagging', 'Labelling each article with its actor and action type (pricing, promotion, new service, market entry, alliance, acquisition); AI tags first, members check and correct.'] },
      verify: { zh: ['人工查證', '回到原始資料確認 AI 的整理、標註與數字；查不到出處的內容不採用。這是 W16「Data Quality」的主要證據。'], en: ['Human Verification', 'Check the AI\'s preparation, tags and figures against the original data; drop anything without a source. This is the main evidence for W16 Data Quality.'] },
      matchrate: { zh: ['比對差異率', '軌道 1 地理編碼後對不上的比例。1141 範例約 15% 店名不符，其中約三成是品牌別名誤判，所以要先套別名表。'], en: ['Mismatch Rate', 'The share of Track 1 stores that do not match after geocoding. About 15% did not match in the 1141 example, roughly a third of them brand-alias false alarms, so apply an alias list first.'] },
      promptiter: { zh: ['提示詞迭代', '結果不理想時修改提示詞再試，並記下每一版改了什麼；這是 W16「Analysis & AI Utilization」的證據。'], en: ['Prompt Iteration', 'When results fall short, revise the prompt and retry, recording what changed in each version — evidence for W16 Analysis & AI Utilization.'] },
      parts: { zh: ['PARTS', '分析與改變賽局的五個槓桿：Players 參賽者、Added value 附加價值、Rules 規則、Tactics 戰術、Scope 範疇。'], en: ['PARTS', 'Five levers for analysing and reshaping the game: Players, Added value, Rules, Tactics, Scope.'] },
      amc: { zh: ['AMC 架構', '對手是否回應，取決於察覺、動機與能力三者是否同時具備。'], en: ['AMC Framework', 'Whether a rival responds depends on awareness, motivation and capability all being present.'] },
      rings: { zh: ['三圈家數', '步行、機車、汽車三圈：市、鎮、里 50／100／500 m；鄉、村 100／500／1,000 m。依地區實際型態選用。'], en: ['Three-ring Counts', 'Walk, scooter and car rings: towns and urban wards 50 / 100 / 500 m; rural townships and villages 100 / 500 / 1,000 m. Choose by the actual pattern.'] },
      clq: { zh: ['CLQ 共區位商數（進階）', 'A 品牌分店的最近鄰居是 B 品牌的比例 ÷ 隨機時應有的比例；> 1 群聚、< 1 迴避，且有方向性（誰跟著誰開）。'], en: ['Colocation Quotient (CLQ, advanced)', 'Share of A stores whose nearest neighbour is B ÷ the share expected by chance; > 1 clustering, < 1 avoidance; directional (who follows whom).'] },
      pkpi: { zh: ['平台 KPI', '取自年報的平台指標，例如訂單數、交易總額、抽成率、活躍使用者；引用時註明定義與出處。'], en: ['Platform KPIs', 'Platform metrics from annual reports, e.g. orders, gross bookings, take rate, active users; state the definition and source.'] },
      insight: { zh: ['商業洞察', 'W16 評分占 20%：說明「所以呢」，給出可行的策略建議。'], en: ['Business Insight', 'Worth 20% at W16: explain "so what" and give actionable strategy advice.'] },
      codingagent: { zh: ['Coding Agent', 'AI 平台中能直接產生、修改整個網頁程式的代理功能；組員以自然語言描述需求並檢查結果。'], en: ['Coding Agent', 'The agent feature of an AI platform that writes and edits a whole web page; members describe what they want in natural language and check the result.'] },
      vibecoding: { zh: ['Vibe Coding', '用自然語言請 AI 產生程式，組員負責說清楚需求、檢查結果、反覆修改。'], en: ['Vibe Coding', 'Asking AI for code in natural language; members state the requirements, check the result and iterate.'] },
      video: { zh: ['2 分鐘雙語動畫影片', '用 Vibe Coding 製作的網頁動畫，錄製成影片：英文旁白＋中英字幕，嵌入網頁；不規定每位組員都要口說。'], en: ['Two-minute Bilingual Video', 'A web animation made through Vibe Coding and recorded: English narration with Chinese and English subtitles, embedded in the page; not every member has to speak.'] },
      ghpages: { zh: ['GitHub Pages', '免費的靜態網頁空間；在瀏覽器上傳檔案即可部署，不需要指令列。'], en: ['GitHub Pages', 'Free static hosting; deploy by uploading files in the browser, no command line needed.'] },
      contest: { zh: ['W16 網頁競賽', 'W16 前一個週末所有網頁上線，全班與教授線上互評；W16 上課時公布結果、頒獎，並完成期末互評。'], en: ['W16 Web Contest', 'All pages go live the weekend before W16 and the class and professors evaluate them online; W16 announces the results and awards and completes the final peer review.'] },
      citation: { zh: ['引用與著作權', '每筆資料保留來源、連結與日期；影片與網頁素材註明出處。'], en: ['Citations & Copyright', 'Keep the source, link and date of every item; credit all media used in the video and page.'] },
      odbl: { zh: ['ODbL 授權', 'OpenStreetMap 採用的開放資料授權：可自由使用，但必須標示「© OpenStreetMap contributors」。'], en: ['ODbL Licence', 'The open-data licence of OpenStreetMap: free to use, but you must credit "© OpenStreetMap contributors".'] },
      aidisclose: { zh: ['AI 使用揭露', '在網頁頁尾標示使用的 AI 平台與協助範圍；AI 產出經組員審閱才發布。'], en: ['AI-use Disclosure', 'The page footer states the AI platforms used and where they helped; AI output is reviewed by the team before release.'] },

    }, B_SHAPES_GLOSS),
    guide: {
      zh: ['B 圖呈現 TP 的「AI Agent 工作流程」：左欄 INPUT 選定軌道、資料來源與 AI 平台；中欄 PROCESS 由 Work／Task Agent 整理資料、組員查證，再做 PARTS、競爭動態與平台分析；右欄 OUTPUT 由 Coding Agent 製作雙語網頁與 2 分鐘影片、部署並參加 W16 網頁競賽；底部治理層橫貫三欄。兩個軌道流程相同，節點中分別寫出軌道 1 與軌道 2 的做法，請只保留你們軌道的內容。', '建議步驟：① 確認資料來源與「人工查證」的標準；② 逐一檢查每個節點的「負責角色」（建議三組、每組兩人），圖下方會自動產生團隊分工表；③ 回饋迴路（虛線 L1、L2…）寫明何時回頭修正；④ 節點右下角的「→ A②」對應 A 架構圖，兩張圖的內容要一致。', '新增連線預設為流程箭頭；在右側把類型改為「回饋迴路」，就會變成編號的虛線弧形箭頭。'],
      en: ['Diagram B shows the TP\'s AI agent workflow: INPUT picks the track, data sources and AI platform; PROCESS has the Work / Task Agent prepare the data, members verify it, and then PARTS, competitive-dynamics and platform analysis follow; OUTPUT has the Coding Agent build the bilingual page and two-minute video, deploy them and enter the W16 web contest; the governance band cuts across all three. Both tracks share the workflow and nodes list what each track does — keep only your track\'s content.', 'Suggested steps: (1) confirm the data sources and the verification standard; (2) check the team role on every node (suggested: three pairs) — the team-role table below updates itself; (3) every feedback loop (dashed L1, L2 …) states when you go back and fix things; (4) the "→ A②" mark links a node to Framework Diagram A, so keep the two diagrams consistent.', 'New links are flow arrows by default; switch the type to Feedback Loop in the side panel to make a numbered dashed arc.']
    }

   (plain JS, no JSX)

const G = {
  TOP: 118, PADX: 12, PADY: 11, GAPY: 22,
  FRAME_TOP: 32, FRAME_BOT: 50, FRAME_PADX: 14,
  LANE_LABEL_W: 34, LANE_GAP: 34,
  FONT: "Inter, 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif",
  SERIF: "Merriweather, 'Noto Serif TC', 'Noto Sans TC', 'Microsoft JhengHei', serif"
};

const WIDE_RE = /[⺀-鿿豈-﫿︰-﹏＀-￯　-〿①-⓿★☆]/;
function textW(s, fs) {
  let w = 0;
  for (const ch of String(s)) {
    if (WIDE_RE.test(ch)) w += fs;
    else if (ch === ' ') w += fs * 0.3;
    else if (/[il.,:;|!'’()\[\]\/]/.test(ch)) w += fs * 0.32;
    else if (/[A-Z0-9%&@#MW]/.test(ch)) w += fs * 0.66;
    else w += fs * 0.55;
  }
  return w;
}
function wrapText(s, maxW, fs) {
  s = String(s || '');
  if (!s) return [];
  const tokens = s.match(/[⺀-鿿豈-﫿︰-﹏＀-￯　-〿]|[^\s⺀-鿿豈-﫿︰-﹏＀-￯　-〿]+|\s+/g) || [];
  const lines = []; let cur = '';
  for (let t of tokens) {
    if (/^\s+$/.test(t)) { if (cur) cur += ' '; continue; }
    if (textW(cur + t, fs) <= maxW) { cur += t; continue; }
    // closing punctuation stays on the current line
    if (/^[，。、；：？！）」』,.;:?!)]$/.test(t) && cur) { cur += t; continue; }
    if (cur.trim()) lines.push(cur.trimEnd());
    cur = '';
    while (textW(t, fs) > maxW) {
      let i = 1;
      while (i < t.length && textW(t.slice(0, i + 1), fs) <= maxW) i++;
      lines.push(t.slice(0, i)); t = t.slice(i);
    }
    cur = t;
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  return lines;
}

const getText = (n) => (n.variants ? n.variants[n.variant || 'auto'] : n.text) || { zh: { title: '', items: [] }, en: { title: '', items: [] } };
const roleOf = (tpl, id) => tpl.roles.find(r => r.id === id) || tpl.roles[0];

/* Build the drawable lines of a node for a display mode (zh | en | both). */
function nodeBox(n, tpl, mode) {
  const role = roleOf(tpl, n.role), W = role.w || tpl.nodeW;
  const sx = role.shape === 'decision' ? 12 : 0; /* hexagon: keep text clear of the pointed sides */
  const inner = W - G.PADX * 2 - sx * 2;
  const txt = getText(n);
  const prim = mode === 'en' ? 'en' : 'zh';
  const lines = [];
  let y = G.PADY;
  const badgeIndent = (role.badge ? 24 : 0) + sx;
  const push = (arr, o) => arr.forEach(t => { y += o.lh; lines.push({ t, x: o.x, y: y - o.lh * 0.28, fs: o.fs, fw: o.fw || 400, fill: o.fill || '#1f2937', fi: o.fi || 'normal' }); });
  // title
  const tPrim = (txt[prim] && txt[prim].title) || (txt.zh && txt.zh.title) || '';
  push(wrapText(tPrim, inner - badgeIndent, 14.5), { x: G.PADX + badgeIndent, fs: 14.5, fw: 700, lh: 19, fill: '#0f172a' });
  if (mode === 'both' && txt.en && txt.en.title) {
    push(wrapText(txt.en.title, inner - badgeIndent, 11.5), { x: G.PADX + badgeIndent, fs: 11.5, lh: 15, fill: '#475569', fi: 'italic' });
  }
  let pillY = null;
  if (n.variants) { y += 5; pillY = y; y += 18; }
  y += 5;
  const iz = (txt[prim] && txt[prim].items) || [];
  const ie = (txt.en && txt.en.items) || [];
  const count = Math.max(iz.length, mode === 'both' ? ie.length : 0);
  const bullets = [];
  for (let i = 0; i < count; i++) {
    const a = (iz[i] || '').trim(), b = (ie[i] || '').trim();
    if (!a && !(mode === 'both' && b)) continue;
    const startY = y;
    if (a) push(wrapText(a, inner - 11, 12), { x: G.PADX + 11 + sx, fs: 12, lh: 16.5, fill: '#1f2937' });
    if (mode === 'both' && b) push(wrapText(b, inner - 11, 10.5), { x: G.PADX + 11 + sx, fs: 10.5, lh: 14, fill: '#64748b', fi: 'italic' });
    bullets.push(startY + 16.5 * 0.72);
    y += 3;
  }
  let tagY = null;
  const owner = tpl.owners && n.owner ? tpl.owners.find(o => o.id === n.owner) : null;
  if (n.tag || owner || n.xref) { y += 4; tagY = y; y += 18; }
  y += G.PADY + (role.shape === 'doc' ? 8 : 0);
  return { w: W, h: Math.max(y, 54), lines, bullets, pillY, tagY, badgeIndent, sx, owner };
}

function laneOn(tpl) { return !!(tpl.lanes && tpl.lanes.enabled); }
function rowPhases(tpl) { return !!(tpl.phases && tpl.phaseDir === 'row'); }
function leftX(tpl) { return laneOn(tpl) || rowPhases(tpl) ? 14 + G.LANE_LABEL_W + 20 : 36; }
function colX(tpl, c) { return leftX(tpl) + c * (tpl.nodeW + tpl.gapX) + ((tpl.colShift && tpl.colShift[c]) || 0); }
const colOfN = (tpl, n) => (n.col !== undefined ? n.col : roleOf(tpl, n.role).col);
const rowOfN = (tpl, n) => (n.row !== undefined ? n.row : (roleOf(tpl, n.role).row !== undefined ? roleOf(tpl, n.role).row : 1));
const inBand = (tpl, n) => !!(tpl.band && tpl.band.roles.includes(n.role));
function isPerLane(tpl, n) { return laneOn(tpl) && !!roleOf(tpl, n.role).perLane; }

/* Auto layout: returns a new nodes array with x/y set. */
function autoLayout(d, tpl, mode) {
  const boxes = {}; d.nodes.forEach(n => boxes[n.id] = nodeBox(n, tpl, mode));
  const gRole = {}; (tpl.groups || []).forEach(g => g.roles.forEach(r => gRole[r] = g.id));
  const order = {}; tpl.roles.forEach((r, i) => order[r.id] = i);
  const sortFn = (a, b) => (order[a.role] - order[b.role]) || (a.y - b.y);
  const place = (arr, y0) => {
    let y = y0, prevG = null; const pos = {};
    arr.forEach((n, i) => {
      const g = gRole[n.role] || null;
      if (i > 0) y += G.GAPY;
      if (g !== prevG) { if (prevG) y += G.FRAME_BOT - 8; if (g) y += G.FRAME_TOP; }
      pos[n.id] = y; y += boxes[n.id].h; prevG = g;
    });
    if (prevG) y += G.FRAME_BOT;
    return { pos, h: y - y0 };
  };
  const colOf = n => (n.col !== undefined ? n.col : roleOf(tpl, n.role).col);
  if (tpl.grid) {
    const rowOf = n => (n.row !== undefined ? n.row : (roleOf(tpl, n.role).row !== undefined ? roleOf(tpl, n.role).row : 1));
    const cells = {};
    d.nodes.forEach(n => { const k = colOf(n) + '_' + rowOf(n); (cells[k] = cells[k] || []).push(n); });
    const nRows = Math.max(1, ...d.nodes.map(n => rowOf(n) + 1));
    const rowH = Array(nRows).fill(0);
    Object.entries(cells).forEach(([k, arr]) => { arr.sort(sortFn); const r = +k.split('_')[1]; rowH[r] = Math.max(rowH[r], place(arr, 0).h); });
    const rowTop = []; let yy = G.TOP + (tpl.topPad || 0);
    for (let r = 0; r < nRows; r++) { rowTop[r] = yy; yy += (rowH[r] || 0) + (rowH[r] ? (tpl.rowGap || G.GAPY * 2) : 0); }
    const pos = {};
    Object.entries(cells).forEach(([k, arr]) => {
      const [c, r] = k.split('_').map(Number); const h = place(arr, 0).h;
      const res = place(arr, rowTop[r] + (tpl.alignTop ? 0 : (rowH[r] - h) / 2));
      arr.forEach(n => pos[n.id] = { x: colX(tpl, c), y: Math.round(res.pos[n.id]) });
    });
    return d.nodes.map(n => pos[n.id] ? { ...n, ...pos[n.id] } : n);
  }
  const lanes = laneOn(tpl) ? d.lanes.length : 1;
  const newPos = {};
  const bandTop = [], bandH = [];
  let cursor = G.TOP;
  for (let l = 0; l < lanes; l++) {
    const laneNodes = d.nodes.filter(n => laneOn(tpl) ? (isPerLane(tpl, n) && n.lane === l) : true);
    let maxH = 90;
    const cols = {};
    laneNodes.forEach(n => { (cols[colOf(n)] = cols[colOf(n)] || []).push(n); });
    Object.values(cols).forEach(arr => { arr.sort(sortFn); maxH = Math.max(maxH, place(arr, 0).h); });
    bandTop[l] = cursor; bandH[l] = maxH;
    Object.entries(cols).forEach(([c, arr]) => {
      const r = place(arr, 0); const y0 = cursor + (maxH - r.h) / 2;
      const r2 = place(arr, y0);
      arr.forEach(n => newPos[n.id] = { x: colX(tpl, +c), y: Math.round(r2.pos[n.id]) });
    });
    cursor += maxH + G.LANE_GAP;
  }
  if (laneOn(tpl)) {
    const totalH = cursor - G.LANE_GAP - G.TOP;
    const shared = d.nodes.filter(n => !isPerLane(tpl, n));
    const cols = {};
    shared.forEach(n => { (cols[colOf(n)] = cols[colOf(n)] || []).push(n); });
    Object.entries(cols).forEach(([c, arr]) => {
      arr.sort(sortFn);
      const r = place(arr, 0); const y0 = G.TOP + Math.max(0, (totalH - r.h) / 2);
      const r2 = place(arr, y0);
      arr.forEach(n => newPos[n.id] = { x: colX(tpl, +c), y: Math.round(r2.pos[n.id]) });
    });
  }
  return d.nodes.map(n => newPos[n.id] ? { ...n, ...newPos[n.id] } : n);
}

/* Geometry helpers ------------------------------------------------ */
function computeGeometry(d, tpl, mode) {
  const boxes = {}; d.nodes.forEach(n => boxes[n.id] = nodeBox(n, tpl, mode));
  const rects = {}; d.nodes.forEach(n => rects['n:' + n.id] = { x: n.x, y: n.y, w: boxes[n.id].w, h: boxes[n.id].h });
  // frames
  const frames = [];
  const lanes = laneOn(tpl) ? d.lanes.map((_, i) => i) : [null];
  (tpl.groups || []).forEach(g => {
    lanes.forEach(l => {
      const ns = d.nodes.filter(n => g.roles.includes(n.role) && (l === null || n.lane === l));
      if (!ns.length) return;
      const x1 = Math.min(...ns.map(n => n.x)), y1 = Math.min(...ns.map(n => n.y));
      const x2 = Math.max(...ns.map(n => n.x + boxes[n.id].w)), y2 = Math.max(...ns.map(n => n.y + boxes[n.id].h));
      const ref = 'g:' + g.id + ':' + (l === null ? 0 : l);
      const r = { x: x1 - G.FRAME_PADX, y: y1 - G.FRAME_TOP + 4, w: x2 - x1 + G.FRAME_PADX * 2, h: y2 - y1 + G.FRAME_TOP - 4 + G.FRAME_BOT - 8 };
      rects[ref] = r; frames.push({ ref, g, lane: l, ...r });
    });
  });
  // bands
  const bands = [];
  if (laneOn(tpl)) {
    d.lanes.forEach((ln, l) => {
      const ns = d.nodes.filter(n => isPerLane(tpl, n) && n.lane === l);
      const rs = ns.map(n => rects['n:' + n.id]).concat(frames.filter(f => f.lane === l));
      if (!rs.length) return;
      const y1 = Math.min(...rs.map(r => r.y)) - 14, y2 = Math.max(...rs.map(r => r.y + r.h)) + 14;
      bands.push({ lane: l, ln, y: y1, h: y2 - y1 });
    });
  }
  // phase bands (B diagrams): columns (I-P-O) or rows (thesis chapters)
  const phases = [];
  if (tpl.phases) {
    const body = d.nodes.filter(n => !inBand(tpl, n));
    const rOf = n => rects['n:' + n.id];
    const fr = ns => frames.filter(f => d.nodes.some(n => ns.includes(n) && f.g.roles.includes(n.role)));
    if (tpl.phaseDir === 'row') {
      tpl.phases.forEach((ph, i) => {
        const ns = body.filter(n => ph.rows.includes(rowOfN(tpl, n)));
        if (!ns.length) return;
        const rs = ns.map(rOf);
        const y1 = Math.min(...rs.map(r => r.y)) - 14, y2 = Math.max(...rs.map(r => r.y + r.h)) + 14;
        phases.push({ i, ph, y: y1, h: y2 - y1 });
      });
    } else {
      const cols = tpl.phases.map(ph => { const ns = body.filter(n => ph.cols.includes(colOfN(tpl, n))); return { ph, rs: ns.map(rOf).concat(fr(ns)) }; });
      const all = [].concat(...cols.map(c => c.rs));
      if (all.length) {
        const y1 = Math.min(...all.map(r => r.y)) - 40, y2 = Math.max(...all.map(r => r.y + r.h)) + 34;
        cols.forEach((c, i) => {
          const x1 = c.rs.length ? Math.min(...c.rs.map(r => r.x)) - 14 : colX(tpl, c.ph.cols[0]) - 14;
          const x2 = c.rs.length ? Math.max(...c.rs.map(r => r.x + r.w)) + 14 : colX(tpl, c.ph.cols[c.ph.cols.length - 1]) + tpl.nodeW + 14;
          phases.push({ i, ph: c.ph, x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
        });
      }
    }
  }
  // cross-cutting band (governance / ethics)
  let xband = null;
  if (tpl.band) {
    const ns = d.nodes.filter(n => inBand(tpl, n));
    if (ns.length) {
      const rs = ns.map(n => rects['n:' + n.id]);
      const x1 = Math.min(...rs.map(r => r.x)) - 14, x2 = Math.max(...rs.map(r => r.x + r.w)) + 14;
      const y1 = Math.min(...rs.map(r => r.y)) - 34, y2 = Math.max(...rs.map(r => r.y + r.h)) + 14;
      xband = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    }
  }
  // return channel for long feedback loops (between the phase bands and the cross band)
  const colPh = phases.filter(p => p.w);
  const channelY = colPh.length ? Math.max(...colPh.map(p => p.y + p.h)) + 20 : null;
  let farIdx = 0;
  // edges
  const edgeGeo = {};
  const center = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
  const geo = (e, depth) => {
    if (edgeGeo[e.id]) return edgeGeo[e.id];
    const a = rects[e.from];
    if (!a) return null;
    let res;
    if (e.to.startsWith('e:')) {
      if (depth > 3) return null;
      const te = d.edges.find(x => 'e:' + x.id === e.to);
      if (!te || te.id === e.id) return null;
      const tg = geo(te, depth + 1); if (!tg) return null;
      const t = tg.mid, ac = center(a);
      let p0;
      if (t.y > a.y + a.h) p0 = { x: ac.x, y: a.y + a.h };
      else if (t.y < a.y) p0 = { x: ac.x, y: a.y };
      else p0 = t.x > ac.x ? { x: a.x + a.w, y: ac.y } : { x: a.x, y: ac.y };
      const mid = { x: (p0.x + t.x) / 2, y: (p0.y + t.y) / 2 };
      res = { d: `M${p0.x},${p0.y} L${t.x},${t.y}`, mid, p0, p3: t };
    } else if (tpl.mainStyle === 'loop' && e.kind === 'main' && rects[e.to] && e.from !== e.to) {
      /* feedback loop: dashed return path */
      const b = rects[e.to]; const ac = center(a), bc = center(b);
      const overlapX = a.x < b.x + b.w && b.x < a.x + a.w;
      const gapX = a.x > b.x ? a.x - (b.x + b.w) : b.x - (a.x + a.w);
      const cub = (p0, c1, c2, p3) => ({ d: `M${p0.x},${p0.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p3.x},${p3.y}`, mid: { x: (p0.x + 3 * c1.x + 3 * c2.x + p3.x) / 8, y: (p0.y + 3 * c1.y + 3 * c2.y + p3.y) / 8 }, p0, p3, c1, c2, loop: true });
      if (e.side === 'bottom' || e.side === 'top') { /* explicit arc below / above both nodes */
        const up = e.side === 'top';
        const p0 = { x: ac.x, y: up ? a.y : a.y + a.h }, p3 = { x: bc.x, y: up ? b.y : b.y + b.h };
        const ey = up ? Math.min(p0.y, p3.y) : Math.max(p0.y, p3.y);
        const bow = (up ? -1 : 1) * Math.min(80, 34 + Math.abs(p3.x - p0.x) * 0.1);
        res = cub(p0, { x: p0.x + (p3.x - p0.x) * 0.15, y: ey + bow }, { x: p3.x - (p3.x - p0.x) * 0.15, y: ey + bow }, p3);
      } else if (overlapX) { /* same column: out and back on the right (or left) side */
        const side = e.side === 'left' ? -1 : 1;
        const p0 = { x: side > 0 ? a.x + a.w : a.x, y: ac.y }, p3 = { x: side > 0 ? b.x + b.w : b.x, y: bc.y };
        const ex = side > 0 ? Math.max(p0.x, p3.x) : Math.min(p0.x, p3.x);
        const bow = side * (40 + Math.abs(p3.y - p0.y) * 0.1);
        res = cub(p0, { x: ex + bow, y: p0.y }, { x: ex + bow, y: p3.y }, p3);
      } else if (gapX < 110 || !channelY) { /* neighbouring columns: side to side */
        const dir = bc.x > ac.x ? 1 : -1;
        const clamp = (v, r) => Math.max(r.y + 16, Math.min(r.y + r.h - 16, v));
        const p0 = { x: dir > 0 ? a.x + a.w : a.x, y: clamp(bc.y, a) + 12 }, p3 = { x: dir > 0 ? b.x : b.x + b.w, y: clamp(ac.y, b) + 12 };
        const c = (p3.x - p0.x) / 2;
        res = cub(p0, { x: p0.x + c, y: p0.y + 18 }, { x: p3.x - c, y: p3.y + 18 }, p3);
      } else { /* distant columns: along the return channel below the phase bands */
        const k = farIdx++;
        const yc = channelY + k * 16, r = 10;
        const dir = bc.x < ac.x ? -1 : 1;
        const xo = dir < 0 ? a.x + a.w + 7 + k * 4 : a.x - 7 - k * 4;       /* leave on the outer side of the source */
        const xg = dir < 0 ? b.x - 30 - k * 8 : b.x + b.w + 30 + k * 8;    /* climb in the gap next to the target */
        const ty = bc.y - 8 + k * 8, sy = ac.y + 8;
        const sx0 = dir < 0 ? a.x + a.w : a.x, tx = dir < 0 ? b.x : b.x + b.w;
        const sgo = xo > sx0 ? 1 : -1, sgi = tx > xg ? 1 : -1;
        const dd = [`M${sx0},${sy}`, `L${xo - sgo * r},${sy}`, `Q${xo},${sy} ${xo},${sy + r}`, `L${xo},${yc - r}`, `Q${xo},${yc} ${xo - sgo * r * 0 + (xg < xo ? -r : r)},${yc}`,
          `L${xg + (xg < xo ? r : -r)},${yc}`, `Q${xg},${yc} ${xg},${yc - r}`, `L${xg},${ty + r}`, `Q${xg},${ty} ${xg + sgi * r},${ty}`, `L${tx},${ty}`].join(' ');
        res = { d: dd, mid: { x: (xo + xg) / 2 + (k % 2 ? 80 : -80) * Math.ceil(k / 2), y: yc }, p0: { x: sx0, y: sy }, p3: { x: tx, y: ty }, loop: true, channel: true };
      }
    } else {
      const b = rects[e.to]; if (!b || e.from === e.to) return null;
      const ac = center(a), bc = center(b);
      const dx = bc.x - ac.x, dy = bc.y - ac.y;
      const overlapX = a.x < b.x + b.w && b.x < a.x + a.w;
      let p0, p3, c1, c2;
      if (!overlapX && Math.abs(dx) >= Math.abs(dy) * 0.5) {
        p0 = dx > 0 ? { x: a.x + a.w, y: ac.y } : { x: a.x, y: ac.y };
        p3 = dx > 0 ? { x: b.x, y: bc.y } : { x: b.x + b.w, y: bc.y };
        const c = (p3.x - p0.x) / 2;
        c1 = { x: p0.x + c, y: p0.y }; c2 = { x: p3.x - c, y: p3.y };
      } else {
        p0 = dy > 0 ? { x: ac.x, y: a.y + a.h } : { x: ac.x, y: a.y };
        p3 = dy > 0 ? { x: bc.x, y: b.y } : { x: bc.x, y: b.y + b.h };
        const c = (p3.y - p0.y) / 2;
        c1 = { x: p0.x, y: p0.y + c }; c2 = { x: p3.x, y: p3.y - c };
      }
      const mid = { x: (p0.x + 3 * c1.x + 3 * c2.x + p3.x) / 8, y: (p0.y + 3 * c1.y + 3 * c2.y + p3.y) / 8 };
      res = { d: `M${p0.x},${p0.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p3.x},${p3.y}`, mid, p0, p3, c1, c2 };
    }
    edgeGeo[e.id] = res; return res;
  };
  d.edges.forEach(e => geo(e, 0));
  // labels of moderated links move off the midpoint so the moderating arrow stays visible
  const bez = (g, t) => { const u = 1 - t; return { x: u*u*u*g.p0.x + 3*u*u*t*g.c1.x + 3*u*t*t*g.c2.x + t*t*t*g.p3.x, y: u*u*u*g.p0.y + 3*u*u*t*g.c1.y + 3*u*t*t*g.c2.y + t*t*t*g.p3.y }; };
  d.edges.forEach(e => { const g = edgeGeo[e.id]; if (!g) return; g.label = g.mid;
    if (g.c1 && d.edges.some(x => x.to === 'e:' + e.id)) g.label = bez(g, 0.25); });
  // numbering
  const codes = {}; let k = 0;
  d.edges.forEach(e => { if (e.kind === 'main') codes[e.id] = tpl.prefix + (++k); });
  // bounds
  const allR = Object.values(rects).concat(phases.filter(p => p.w).map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h })), xband ? [xband] : []);
  const maxX = allR.length ? Math.max(...allR.map(r => r.x + r.w)) : 600;
  const maxY = allR.length ? Math.max(...allR.map(r => r.y + r.h)) : G.TOP + 100;
  const W = Math.max(780, Math.ceil(maxX + 40));
  const W2 = rowPhases(tpl) ? Math.max(W, Math.ceil(maxX + 40)) : W;
  return { boxes, rects, frames, bands, phases, xband, edgeGeo, codes, W: W2, contentBottom: maxY + (bands.length || (phases.length && rowPhases(tpl)) ? 16 : 0) };
}

/* Legend lines: numbered relations (H / P / AQ / L) and, for B diagrams, the team-role table */
function legendLines(d, tpl, mode, codes, W) {
  const out = [];
  const maxW = W - 60;
  const head = (bi) => out.push({ head: mode === 'en' ? bi.en : mode === 'both' ? `${bi.zh} ${bi.en}` : bi.zh, lines: [], fs: 13.5 });
  const mains = d.edges.filter(e => e.kind === 'main');
  if (mains.length) head(tpl.legendTitle);
  mains.forEach(e => {
    const code = codes[e.id];

      if (a) wrapText(a, w - 44 - 22, 14.5).forEach(t => { yy += 21.5; L.push({ t, x: 44, y: yy, fs: 14.5, fill: '#1f2937' }); });
      if (mode === 'both' && b && b !== a) wrapText(b, w - 44 - 22, 12).forEach(t => { yy += 17; L.push({ t, x: 44, y: yy, fs: 12, fi: 'italic', fill: '#64748b' }); });
      yy += 5;
    }
    const empty = !bullets.length;
    if (empty) yy += 26;
    yy += 16;

    return { card, idx, w, h: Math.max(yy, 110), lines: L, bullets, checks, empty, mode: content.mode, filled: cardFilled(card, content, st, tplId), chars, content };
  };
  const cards = []; let i = 0;
  while (i < tc.cards.length) {
    const single = i === tc.cards.length - 1;
    const row = single ? [box(tc.cards[i], i, W - 2 * P)] : [box(tc.cards[i], i, cw2), box(tc.cards[i + 1], i + 1, cw2)];
    const h = Math.max(...row.map(c => c.h));
    row.forEach((c, k) => { c.x = P + k * (cw2 + G2); c.y = y; c.h = h; cards.push(c); });
    y += h + G2; i += row.length;

  return { W, H: Math.max(PAGE.H, Math.ceil(bottom)), over: bottom > PAGE.H, head, cards, done: cards.filter(c => c.filled).length, total: cards.length };
}

function sanitizeC(d, tplId) {
  const tc = TEMPLATES_C[tplId]; d = d || {};
  const cards = {};
  const src = d.cards && typeof d.cards === 'object' ? d.cards : {};
  tc.cards.forEach(c => {
    const s = src[c.id]; if (!s || typeof s !== 'object') return;

    if (s.manual) o.manual = true;
    if (s.text) o.text = { zh: (Array.isArray(s.text.zh) ? s.text.zh : []).slice(0, 20).map(x => cleanStr(x, 400)), en: (Array.isArray(s.text.en) ? s.text.en : []).slice(0, 20).map(x => cleanStr(x, 400)) };
    if (c.choice && c.choice.some(x => x.id === s.choice)) o.choice = s.choice;
    if (c.people && s.people && typeof s.people === 'object') { o.people = {}; (TEMPLATES_B[tplId].owners || []).forEach(ow => { if (s.people[ow.id]) o.people[ow.id] = cleanStr(s.people[ow.id], 40); }); if (c.collab && s.people.__collab) o.people.__collab = cleanStr(s.people.__collab, 200); }
    cards[c.id] = o;
  });

}

 <marker id="arLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={LOOP_COLOR} /></marker>

          {legendRows.map((r, i) => r.head ? <text key={'lg' + i} x="28" y={r.y0 + 16} fontSize="13.5" fontWeight="700" fill="#004030">{r.head}</text> : (

      )}
      <text x={W - 24} y={H - 14} textAnchor="end" fontSize="9.5" fill="#94a3b8">Proposal Diagram Studio · Prof. Shihmin Lo, NCNU IBS</text>

  );
};

/* ---------------- Diagram C: one-page summary ---------------- */
const CPage = ({ doc, mode, selected, onSelect, zoom, svgRef, t }) => {
  const dC = doc.diagrams.C;
  const Lc = useMemo(() => layoutC(dC, doc.templateId, mode, doc.diagrams), [dC, doc.diagrams, doc.templateId, mode]);
  const { W, H } = Lc; const selColor = '#D97706';
  const src = (c) => c.mode === 'auto' ? t.c_auto_from.replace('{src}', c.card.src) : c.mode === 'manual' ? t.c_manual : null;
  return (
    <svg ref={svgRef} xmlns="http://www.w3.org/2000/svg" viewBox={`0 0 ${W} ${H}`} width={W * zoom} height={H * zoom}
      style={{ display: 'block', fontFamily: G.FONT, userSelect: 'none' }} onPointerDown={() => onSelect(null)} data-w={W} data-h={H}>
      <rect x="0" y="0" width={W} height={H} fill="#ffffff" />
      <rect x="0" y="0" width={W} height="8" fill="#004030" />
      <text x={PAGE.PAD} y="46" fontSize="13" fontWeight="700" letterSpacing="1" fill="#92400E">{Lc.head.page}{Lc.head.pageEn ? `  ·  ${Lc.head.pageEn}` : ''}</text>
      {Lc.head.lines.map((l, i) => <text key={i} x={PAGE.PAD} y={l.y} fontSize={l.fs} fontWeight={l.fw || 400} fontStyle={l.fi || 'normal'} fontFamily={l.serif ? G.SERIF : undefined} fill={l.fill}>{l.t}</text>)}
      <line x1={PAGE.PAD} y1={Lc.head.rule} x2={W - PAGE.PAD} y2={Lc.head.rule} stroke="#D8C3A5" strokeWidth="2" />
      <g className="no-export"><rect x={W - PAGE.PAD - 118} y="24" width="118" height="28" rx="14" fill={Lc.done === Lc.total ? '#004030' : '#FEF3E2'} stroke={Lc.done === Lc.total ? 'none' : '#B45309'} />
        <text x={W - PAGE.PAD - 59} y="43" textAnchor="middle" fontSize="13" fontWeight="700" fill={Lc.done === Lc.total ? '#ffffff' : '#92400E'}>{t.c_progress.replace('{n}', Lc.done).replace('{m}', Lc.total)}</text></g>
      {Lc.cards.map(c => {
        const sel = selected && selected.type === 'card' && selected.id === c.card.id; const lb = src(c);
        return (
          <g key={c.card.id} transform={`translate(${c.x},${c.y})`} style={{ cursor: 'pointer' }} onPointerDown={(e) => { e.stopPropagation(); onSelect({ type: 'card', id: c.card.id }); }}>
            <rect x="0" y="0" width={c.w} height={c.h} rx="12" fill="#ffffff" stroke="#cbd5e1" strokeWidth="1.3" />
            <rect x="0" y="0" width={c.w} height="5" rx="2" fill="#004030" />
            <circle cx="30" cy="34" r="14" fill="#004030" /><text x="30" y="39" textAnchor="middle" fontSize="14" fontWeight="700" fill="#D8C3A5">{c.idx + 1}</text>
            {c.lines.map((l, i) => <text key={i} x={l.x} y={l.y} fontSize={l.fs} fontWeight={l.fw || 400} fontStyle={l.fi || 'normal'} fill={l.fill}>{l.t}</text>)}
            {c.bullets.map((y, i) => <circle key={'b' + i} cx="32" cy={y - 4.5} r="2.6" fill="#004030" />)}
            {c.checks.map((k, i) => <g key={'k' + i}><rect x="22" y={k.y - 12} width="14" height="14" rx="3" fill={k.on ? '#004030' : '#ffffff'} stroke={k.on ? '#004030' : '#94a3b8'} strokeWidth="1.4" />{k.on && <path d={`M25,${k.y - 5} l3.5,3.5 l6,-7`} fill="none" stroke="#ffffff" strokeWidth="2" />}</g>)}
            {c.empty && <text className="no-export" x="44" y={c.h - 30} fontSize="12.5" fontStyle="italic" fill="#94a3b8">{c.card.hint ? (mode === 'en' ? c.card.hint.en : c.card.hint.zh) : t.c_empty}</text>}
            <g className="no-export">
              {lb && (() => { const w = textW(lb, 10.5) + 16; return <g><rect x={c.w - 44 - w} y="16" width={w} height="19" rx="9.5" fill={c.mode === 'auto' ? '#E6F0EC' : '#FEF3E2'} stroke={c.mode === 'auto' ? '#004030' : '#B45309'} strokeWidth="0.8" /><text x={c.w - 44 - w / 2} y="29.5" textAnchor="middle" fontSize="10.5" fontWeight="700" fill={c.mode === 'auto' ? '#004030' : '#92400E'}>{lb}</text></g>; })()}
              <circle cx={c.w - 24} cy="25" r="10" fill={c.filled ? '#004030' : '#ffffff'} stroke={c.filled ? '#004030' : '#B45309'} strokeWidth="1.5" />
              {c.filled ? <path d={`M${c.w - 29},25 l3.5,3.5 l6.5,-7`} fill="none" stroke="#ffffff" strokeWidth="2" /> : null}
            </g>
            {sel && <rect className="no-export" x="-5" y="-5" width={c.w + 10} height={c.h + 10} rx="15" fill="none" stroke={selColor} strokeWidth="2.5" strokeDasharray="7 4" />}
          </g>
        );
      })}
      {Lc.over && <g className="no-export"><line x1="0" y1={PAGE.H} x2={W} y2={PAGE.H} stroke="#DC2626" strokeWidth="1.5" strokeDasharray="8 5" /><text x={W - PAGE.PAD} y={PAGE.H - 8} textAnchor="end" fontSize="12" fontWeight="700" fill="#DC2626">{t.c_page_end}</text></g>}
      <text x={W - 24} y={H - 16} textAnchor="end" fontSize="9.5" fill="#94a3b8">Proposal Diagram Studio · Prof. Shihmin Lo, NCNU IBS</text>
    </svg>
  );
};

/* ---------------- Small UI helpers ---------------- */

  <button type="button" title={title} disabled={disabled} onClick={onClick}

        : active ? 'bg-[#004030] text-white border-[#004030] dark:bg-[#D8C3A5] dark:text-[#004030] dark:border-[#D8C3A5]'
          : 'border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700'} ${className}`}>{children}</button>
);
const Field = ({ label, children }) => (
  <label className="block mb-3"><span className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">{label}</span>{children}</label>
);
const inputCls = 'w-full px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#004030] dark:focus:ring-[#D8C3A5]';
const H3 = ({ children }) => <h3 className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5] mb-3 text-base">{children}</h3>;

/* ---------------- Side panel: Diagram C cards ---------------- */
const CardPanel = ({ t, lang, doc, selected, api, mode }) => {
  const L = lang; const tc = TEMPLATES_C[doc.templateId]; const dC = doc.diagrams.C;
  const Lc = layoutC(dC, doc.templateId, mode, doc.diagrams);
  const cid = selected && selected.type === 'card' ? selected.id : null;
  const c = cid ? Lc.cards.find(x => x.card.id === cid) : null;
  if (!c) return (
    <div className="animate-fade-in">
      <p className="text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">{t.c_none_selected}</p>
      <H3>{t.panel_diagram}</H3>
      <Field label={t.c_f_title_zh}><input className={inputCls} value={dC.title.zh} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...dC.title, zh: e.target.value.slice(0, 200) } })} /></Field>
      <Field label={t.c_f_title_en}><input className={inputCls} value={dC.title.en} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...dC.title, en: e.target.value.slice(0, 200) } })} /></Field>
      <Field label={t.f_subtitle_zh}><input className={inputCls} value={dC.subtitle.zh} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...dC.subtitle, zh: e.target.value.slice(0, 200) } })} /></Field>
      <Field label={t.f_subtitle_en}><input className={inputCls} value={dC.subtitle.en} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...dC.subtitle, en: e.target.value.slice(0, 200) } })} /></Field>
      <H3>{t.c_progress.replace('{n}', Lc.done).replace('{m}', Lc.total)}</H3>
      {Lc.over && <p className="text-sm text-red-600 dark:text-red-400 mb-3">{t.c_over}</p>}
      <ul className="space-y-1.5">
        {Lc.cards.map(x => (
          <li key={x.card.id}><button onClick={() => api.selectCard(x.card.id)} className="w-full flex items-center gap-2 text-left px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
            <span className={`w-5 h-5 shrink-0 rounded-full flex items-center justify-center text-xs font-bold ${x.filled ? 'bg-[#004030] text-white' : 'border-2 border-[#B45309] text-[#B45309]'}`}>{x.filled ? '✓' : ''}</span>
            <span className="text-sm">{x.idx + 1}. {x.card.title[L]}</span></button></li>
        ))}
      </ul>
    </div>
  );
  const st = cardState(dC, c.card.id);
  const lines = c.content.lines;
  const setLines = (lng, v) => api.setCard(c.card.id, { ...(c.card.auto ? { manual: true } : {}), text: { zh: lines.zh, en: lines.en, [lng]: v.split('\n').slice(0, 20) } });
  const owners = c.card.people ? (TEMPLATES_B[doc.templateId].owners || []) : [];
  return (
    <div className="animate-fade-in">
      <H3>{c.idx + 1}. {c.card.title[L]}</H3>
      {c.card.sub && <p className="text-xs text-slate-500 dark:text-slate-400 -mt-2 mb-3">{c.card.sub[L]}</p>}
      <div className="mb-4 p-3 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 text-sm leading-relaxed">
        {c.mode === 'auto' && <p>{t.c_auto_note.split('{src}').join(c.card.src)}</p>}
        {c.mode === 'manual' && <><p className="mb-2">{t.c_manual_note.split('{src}').join(c.card.src)}</p><Btn onClick={() => api.resetCard(c.card.id)}>{t.c_refill}</Btn></>}
        {c.mode === 'edited' && <Btn onClick={() => api.resetCard(c.card.id)}>{t.c_restore}</Btn>}
        {c.mode === 'default' && <p>{c.card.hint ? c.card.hint[L] : t.c_default_note}</p>}
      </div>
      {c.card.choice && (
        <Field label={t.c_choice}>
          <div className="flex flex-col gap-2">{c.card.choice.map(o => <label key={o.id} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="cchoice" checked={(st.choice || c.card.choiceDef) === o.id} onChange={() => api.setCard(c.card.id, { choice: o.id }, true)} /> <span>{o[L]}</span></label>)}</div>
        </Field>
      )}
      {owners.length > 0 && (
        <Field label={t.c_people}>
          <div className="space-y-2">{owners.map(o => (
            <div key={o.id} className="flex items-center gap-2"><span className="w-28 shrink-0 text-xs font-bold" style={{ color: o.color }}>{o[L]}</span>
              <input className={inputCls} value={(st.people || {})[o.id] || ''} placeholder={t.c_people_ph} onFocus={api.snap} onChange={e => api.setCard(c.card.id, { people: { ...(st.people || {}), [o.id]: e.target.value.slice(0, 40) } })} /></div>))}</div>
        </Field>
      )}
      {c.card.collab && (
        <Field label={t.c_collab}>
          <textarea rows={3} className={inputCls} value={(st.people || {}).__collab || ''} placeholder={t.c_collab_ph} onFocus={api.snap} onChange={e => api.setCard(c.card.id, { people: { ...(st.people || {}), __collab: e.target.value.replace(/\n/g, ' ').slice(0, 200) } })} />
        </Field>
      )}
      <Field label={t.f_items_zh}><textarea rows={7} className={inputCls} value={lines.zh.join('\n')} onFocus={api.snap} onChange={e => setLines('zh', e.target.value)} /></Field>
      <p className={`text-xs -mt-2 mb-3 ${c.card.limit && c.chars > c.card.limit ? 'text-red-600 dark:text-red-400 font-bold' : 'text-slate-400'}`}>{t.c_chars.replace('{n}', c.chars).replace('{m}', c.card.limit || '—')}</p>
      <Field label={t.f_items_en}><textarea rows={7} className={inputCls} value={lines.en.join('\n')} onFocus={api.snap} onChange={e => setLines('en', e.target.value)} /></Field>
      {!c.filled && <p className="text-xs text-amber-700 dark:text-amber-300">{t.c_unfilled}</p>}
    </div>
  );
};

/* ---------------- Side panel ---------------- */
const Panel = ({ t, lang, tab, setTab, doc, dia, tpl, selected, api, mode }) => {
  const d = dia;
  const node = selected && selected.type === 'node' ? d.nodes.find(n => n.id === selected.id) : null;
  const edge = selected && selected.type === 'edge' ? d.edges.find(e => e.id === selected.id) : null;
  const L = lang;
  const firstRole = () => tpl.roles ? (tpl.defaultRole || tpl.roles[0].id) : '';
  const [addRole, setAddRole] = useState(firstRole);
  const [addLane, setAddLane] = useState(0);
  useEffect(() => { setAddRole(firstRole()); setAddLane(0); }, [tpl]);
  const isC = doc.view === 'C';
  const refName = (ref) => {
    if (ref.startsWith('n:')) { const n = d.nodes.find(x => 'n:' + x.id === ref); return n ? getText(n)[L === 'en' ? 'en' : 'zh'].title || n.id : '?'; }
    if (ref.startsWith('g:')) { const [, gid, l] = ref.split(':'); const g = tpl.groups.find(x => x.id === gid); return g ? g.label[L].split(' · ')[0] + (laneOn(tpl) ? ` [${String.fromCharCode(65 + +l)}]` : '') : '?'; }
    if (ref.startsWith('e:')) { const geo = computeGeometry(d, tpl, mode); return geo.codes[ref.slice(2)] || 'link'; }
    return ref;
  };
  const tabs = [['edit', t.tab_edit], ['add', t.tab_add], ['terms', t.tab_terms], ['help', t.tab_help]];

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex border-b border-slate-200 dark:border-slate-700 shrink-0" role="tablist">
        {tabs.map(([k, lbl]) => (
          <button key={k} role="tab" aria-selected={tab === k} onClick={() => setTab(k)}
            className={`flex-1 py-2.5 text-sm font-semibold border-b-2 ${tab === k ? 'border-[#004030] text-[#004030] dark:border-[#D8C3A5] dark:text-[#D8C3A5]' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>{lbl}</button>
        ))}
      </div>
      <div className="p-4 overflow-y-auto flex-1 min-h-0 text-sm">
        {tab === 'edit' && isC && <CardPanel t={t} lang={lang} doc={doc} selected={selected} api={api} mode={mode} />}
        {tab === 'edit' && !isC && !node && !edge && (
          <div className="animate-fade-in">
            <p className="text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">{t.none_selected}</p>
            <H3>{t.panel_diagram}</H3>
            <Field label={t.f_title_zh}><input className={inputCls} value={d.title.zh} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...d.title, zh: e.target.value.slice(0, 160) } })} /></Field>
            <Field label={t.f_title_en}><input className={inputCls} value={d.title.en} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...d.title, en: e.target.value.slice(0, 160) } })} /></Field>
            <Field label={t.f_subtitle_zh}><input className={inputCls} value={d.subtitle.zh} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...d.subtitle, zh: e.target.value.slice(0, 160) } })} /></Field>
            <Field label={t.f_subtitle_en}><input className={inputCls} value={d.subtitle.en} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...d.subtitle, en: e.target.value.slice(0, 160) } })} /></Field>
            <p className="text-xs text-slate-400 mt-4">{t.stats.replace('{n}', d.nodes.length).replace('{m}', d.edges.length)}</p>
            <p className="text-xs text-slate-400 mt-1">{t.kbd_hint}</p>
          </div>
        )}

        {tab === 'edit' && node && (() => {
          const txt = getText(node); const role = roleOf(tpl, node.role);
          const setTxt = (lng, field, val) => api.updateNodeText(node.id, lng, field, val);
          return (
            <div className="animate-fade-in">
              <H3>{t.panel_node}</H3>
              <Field label={t.f_role}>
                <select className={inputCls} value={node.role} onChange={e => api.setNodeRole(node.id, e.target.value)}>
                  {tpl.roles.map(r => <option key={r.id} value={r.id}>{r[L]}</option>)}
                </select>
              </Field>
              {laneOn(tpl) && (
                <Field label={t.f_lane}>
                  {role.perLane
                    ? <select className={inputCls} value={node.lane} onChange={e => api.patchNode(node.id, { lane: +e.target.value })}>
                      {d.lanes.map((ln, i) => <option key={i} value={i}>{ln.text[L] || ln.text.zh}</option>)}
                    </select>
                    : <div className="text-slate-500 text-sm py-1">{t.lane_shared}</div>}
                </Field>
              )}
              {rowPhases(tpl) && !inBand(tpl, node) && (
                <Field label={t.f_chapter}>
                  <select className={inputCls} value={rowOfN(tpl, node)} onChange={e => api.patchNode(node.id, { row: +e.target.value }, true)}>
                    {tpl.phases.map((ph, i) => <option key={i} value={ph.rows[0]}>{ph.label[L]}</option>)}
                  </select>
                </Field>
              )}
              {tpl.owners && (
                <Field label={t.f_owner}>
                  <select className={inputCls} value={node.owner || ''} onChange={e => api.patchNode(node.id, { owner: e.target.value || undefined }, true)}>
                    <option value="">{t.owner_none}</option>
                    {tpl.owners.map(o => <option key={o.id} value={o.id}>{o[L]}</option>)}
                  </select>
                </Field>
              )}
              {node.variants && (
                <Field label={t.f_variant}>
                  <div className="flex gap-2">
                    <Btn active={node.variant !== 'semi'} onClick={() => api.patchNode(node.id, { variant: 'auto' }, true)}>{t.variant_auto}</Btn>
                    <Btn active={node.variant === 'semi'} onClick={() => api.patchNode(node.id, { variant: 'semi' }, true)}>{t.variant_semi}</Btn>
                  </div>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{t.variant_note}</p>
                </Field>
              )}
              <Field label={t.f_node_title_zh}><input id="fld-title-zh" className={inputCls} value={txt.zh.title} onFocus={api.snap} onChange={e => setTxt('zh', 'title', e.target.value.slice(0, 200))} /></Field>
              <Field label={t.f_node_title_en}><input className={inputCls} value={txt.en.title} onFocus={api.snap} onChange={e => setTxt('en', 'title', e.target.value.slice(0, 200))} /></Field>
              <Field label={t.f_items_zh}><textarea rows={5} className={inputCls} value={txt.zh.items.join('\n')} onFocus={api.snap} onChange={e => setTxt('zh', 'items', e.target.value.split('\n').slice(0, 15))} /></Field>
              <Field label={t.f_items_en}><textarea rows={5} className={inputCls} value={txt.en.items.join('\n')} onFocus={api.snap} onChange={e => setTxt('en', 'items', e.target.value.split('\n').slice(0, 15))} /></Field>
              <Field label={rowPhases(tpl) ? t.f_tag_time : t.f_tag}><input className={inputCls} value={node.tag || ''} onFocus={api.snap} onChange={e => api.patchNode(node.id, { tag: e.target.value.slice(0, 60) })} /></Field>
              {tpl.xref && <Field label={t.f_xref}><input className={inputCls} value={node.xref || ''} placeholder={t.f_xref_ph} onFocus={api.snap} onChange={e => api.patchNode(node.id, { xref: e.target.value.slice(0, 24) })} /></Field>}
              <label className="flex items-center gap-2 mb-4 cursor-pointer"><input type="checkbox" checked={!!node.optional} onChange={e => api.patchNode(node.id, { optional: e.target.checked }, true)} /> <span>{t.f_optional}</span></label>
              <div className="flex flex-wrap gap-2">
                <Btn onClick={() => api.dupNode(node.id)}>{t.btn_dup_node}</Btn>
                <Btn danger onClick={() => api.deleteSel()}>{t.btn_delete_node}</Btn>
              </div>
            </div>
          );
        })()}

        {tab === 'edit' && edge && (
          <div className="animate-fade-in">
            <H3>{t.panel_edge}</H3>
            <Field label={t.from_to}><div className="text-sm py-1">{refName(edge.from)} → {refName(edge.to)}</div></Field>
            <Field label={t.f_kind}>
              <div className="flex flex-wrap gap-2">
                <Btn active={edge.kind === 'main'} onClick={() => api.patchEdge(edge.id, { kind: 'main' }, true)}>{(tpl.mainStyle === 'loop' ? t.kind_loop : t.kind_main).replace('{prefix}', tpl.prefix)}</Btn>
                <Btn active={edge.kind === 'flow'} onClick={() => api.patchEdge(edge.id, { kind: 'flow' }, true)}>{t.kind_flow}</Btn>
              </div>
            </Field>
            {tpl.signs && edge.kind === 'main' && (
              <Field label={t.f_sign}>
                <div className="flex flex-wrap gap-2">
                  {[['+', t.sign_pos], ['-', t.sign_neg], ['', t.sign_none]].map(([v, l]) => <Btn key={v || 'n'} active={edge.sign === v} onClick={() => api.patchEdge(edge.id, { sign: v }, true)}>{l}</Btn>)}
                </div>

/* ---------------- Access code + vault ---------------- */
const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(code) {
  if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PDS_VAULT.salt), iterations: PDS_VAULT.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PDS_VAULT.iv) }, key, b64(PDS_VAULT.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function applyVault(p) {
  const tq = TEMPLATES.rp_quant;
  tq.title = p.title; tq.subtitle = p.subtitle; tq.nodes = p.nodes; tq.edges = p.edges;
  Object.assign(tq.glossary, p.glossary);
  tq.roles.forEach(r => { if (p.roleTerms[r.id]) r.terms = p.roleTerms[r.id]; });
  tq.encrypted = false;
  if (p.C) { const tc = TEMPLATES_C.rp_quant; tc.title = p.C.title; tc.subtitle = p.C.subtitle; tc.cards.forEach(c => { if (p.C.cards[c.id]) c.def = p.C.cards[c.id]; }); tc.encrypted = false; }
  if (p.B) { const tb = TEMPLATES_B.rp_quant; tb.title = p.B.title; tb.subtitle = p.B.subtitle; tb.nodes = p.B.nodes; tb.edges = p.B.edges; tb.encrypted = false; }
}

const TOUR_TARGETS = ['template', 'view', 'mode', 'canvas', 'connect', 'panel', 'export'];
const LS_TOUR = 'PDS_tour_done_v1';
const Tour = ({ t, onClose }) => {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const steps = t.tour_steps;
  useEffect(() => {
    const el = document.querySelector(`[data-tour="${TOUR_TARGETS[i]}"]`);
    if (!el) { setRect(null); return; }
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const measure = () => { const r = el.getBoundingClientRect(); setRect({ x: r.left, y: r.top, w: r.width, h: r.height }); };
    measure(); const id = setTimeout(measure, 250);
    window.addEventListener('resize', measure);
    return () => { clearTimeout(id); window.removeEventListener('resize', measure); };
  }, [i]);
  const finish = () => { try { localStorage.setItem(LS_TOUR, '1'); } catch (e) { } onClose(); };
  useEffect(() => { const h = e => { if (e.key === 'Escape') finish(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); });
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 6;
  const r = rect ? { x: Math.max(4, rect.x - pad), y: Math.max(4, rect.y - pad), w: Math.min(rect.w + pad * 2, vw - 8), h: Math.min(rect.h + pad * 2, vh - 8) } : null;
  const cardW = Math.min(340, vw - 24);
  let cx = 12, cy = vh / 2 - 90;
  if (r) {
    cx = Math.min(Math.max(12, r.x), vw - cardW - 12);
    const below = r.y + r.h + 12, above = r.y - 12 - 200;
    if (below + 200 < vh) cy = below; else if (above > 8) cy = above; else { cy = Math.max(12, Math.min(vh - 220, r.y + 20)); cx = Math.max(12, Math.min(vw - cardW - 12, r.x + r.w / 2 - cardW / 2)); }
  }
  return (
    <div className="fixed inset-0 z-[150]" role="dialog" aria-modal="true" aria-label={t.tour_label}>
      {r ? <div className="absolute rounded-xl transition-all duration-300 pointer-events-none" style={{ left: r.x, top: r.y, width: r.w, height: r.h, boxShadow: '0 0 0 9999px rgba(0,0,0,0.6)', outline: '3px solid #D8C3A5' }} />
        : <div className="absolute inset-0 bg-black/60" />}
      <div className="absolute bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-5 animate-fade-in" style={{ left: cx, top: cy, width: cardW }}>
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{t.tour_label} · {i + 1} / {steps.length}</span>
          <button onClick={finish} className="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">{t.tour_skip}</button>
        </div>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1.5">{steps[i].t}</h3>
        <p className="text-sm leading-relaxed text-slate-600 dark:text-slate-300">{steps[i].d}</p>
        <div className="flex items-center justify-between mt-4">
          <div className="flex gap-1">{steps.map((_, k) => <span key={k} className={`h-1.5 rounded-full ${k === i ? 'w-5 bg-[#004030] dark:bg-[#D8C3A5]' : 'w-1.5 bg-slate-300 dark:bg-slate-600'}`} />)}</div>
          <div className="flex gap-2">
            {i > 0 && <Btn onClick={() => setI(i - 1)}>{t.tour_prev}</Btn>}
            {i < steps.length - 1 ? <Btn active onClick={() => setI(i + 1)}>{t.tour_next}</Btn> : <Btn active onClick={finish}>{t.tour_done}</Btn>}
          </div>
        </div>
      </div>
    </div>
  );
};
