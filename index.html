<script>
/* ---------- Front-end protection (Domain lock · iframe busting · smart right-click) ---------- */
(function(){
  var ALLOWED = ['lolopodcast.github.io','localhost','127.0.0.1'];
  var REDIRECT = 'https://www.ibs.ncnu.edu.tw/index.php/faculty/tenured-professor/299-smlo';
  var okHost = location.protocol === 'file:' || ALLOWED.some(function(d){ return location.hostname === d || location.hostname.endsWith('.'+d); });
  if (!okHost) {
    document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Access Denied</h1><p>This resource is not authorised on this domain.</p></div>';
    window.__PDS_BLOCKED = true;
    setTimeout(function(){ location.href = REDIRECT; }, 3000);
    return;
  }
  if (window.self !== window.top) {
    try { window.top.location.href = window.self.location.href; }
    catch(e) { document.body.innerHTML = '<div style="text-align:center;padding:60px;font-family:sans-serif"><h1>Frame Blocked</h1><p>This content cannot be embedded.</p></div>'; window.__PDS_BLOCKED = true; }
  }
  var toast = function(){ if (window.__pdsCopyright) window.__pdsCopyright(); };
  document.addEventListener('contextmenu', function(e){
    var sel = (window.getSelection() || '').toString().trim();
    var tag = (e.target.tagName || '').toLowerCase();
    if (sel.length > 0 || tag === 'input' || tag === 'textarea') return true;
    e.preventDefault(); toast();
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if (e.key === 'F12' || (e.ctrlKey && k === 'u') || (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) >= 0)) { e.preventDefault(); toast(); }
  });
  document.addEventListener('dragstart', function(e){ if (e.target.tagName === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault(); });
})();
</script>

      { k: 'q1', from: 'n:parts', to: 'n:amc', kind: 'main', text: { zh: '異品牌分店是否比隨機更常彼此相鄰（CLQ > 1）？群聚代表卡位競爭，還是共同吸引人潮？', en: 'Do rival stores neighbour each other more than chance (CLQ > 1)? Is that positioning, or co-operation that draws shoppers?' } },
      { k: 'q2', from: 'n:parts', to: 'n:analysis', kind: 'main', text: { zh: '共同供應商的商品與自有品牌、獨家服務相比，哪一種附加價值讓品牌在群聚中仍能差異化？', en: 'Which added value — private labels or exclusive services, versus shared-supplier products — sets a brand apart in a cluster?' } },

      { k: 'q4', from: 'n:plat', to: 'n:analysis', kind: 'main', text: { zh: '服務項目越多的門市，是否越像平台，能吸引更多互補者？', en: 'Do stores with more services act more like platforms and attract more complementors?' } },
      { k: 'q5', from: 'n:parts', to: 'n:amc__L1', kind: 'main', text: { zh: '同一方向路邊（進城或出城）的異品牌分店，競爭是否比對側更直接？', en: 'Is rivalry more direct on the same side of the road (inbound / outbound) than across it?' } },

    glossary: {
      decay: { zh: ['為什麼不用單一衰減曲線', '距離衰減（Tobler, 1970；Huff, 1963 的冪函數；Wilson, 1971 的指數函數）說明越遠影響越小，但參數需實證校準。單一曲線無法同時代表步行、機車、汽車三種競合者，因此本範本以三圈家數為主。'], en: ['Why not a single decay curve', 'Distance decay (Tobler, 1970; power functions in Huff, 1963; exponential in Wilson, 1971) says farther matters less, but its parameters need empirical calibration. One curve cannot represent walking, scooter and car rivals at once, so this template uses three-ring counts.'] },
      clq: { zh: ['CLQ 共區位商數（進階）', 'A 品牌分店的最近鄰居是 B 品牌的比例 ÷ 隨機時應有的比例（B 店數 ÷ 全部店數 − 1）。> 1 吸引、群聚；≈ 1 隨機；< 1 迴避。有方向性：A→B 與 B→A 可不同，看得出誰跟著誰開。例：1141 資料試算，埔里全家 11 家的最近鄰居都是 7-11，CLQ ≈ 1.9；7-11 對 7-11 約 0.4。只看最近一家；樣本小時需以隨機重排檢定。（Leslie & Kronenfeld, 2011）'], en: ['Colocation Quotient (CLQ, advanced)', 'The share of A stores whose nearest neighbour is a B store ÷ the share expected by chance (B stores ÷ all stores − 1). > 1 attraction; ≈ 1 random; < 1 avoidance. It is directional (A→B can differ from B→A), showing who follows whom. Example from the 1141 data: all 11 FamilyMart stores in Puli have a 7-ELEVEN as nearest neighbour, CLQ ≈ 1.9; 7-ELEVEN to 7-ELEVEN is about 0.4. Uses only the nearest store; small samples need a random-relabelling test. (Leslie & Kronenfeld, 2011)'] },
      pxweight: { zh: ['全聯的權重', '全聯是超市，但商品與服務組合越來越接近便利商店。權重採資源相似性：便利商店的商品與服務項目中，全聯提供了幾成（0～1）；尚未蒐集服務清單前預設為 1。'], en: ['PX Mart Weight', 'PX Mart is a supermarket, but its product and service mix increasingly resembles convenience stores. Its weight is resource similarity: the share (0–1) of a convenience store\'s products and services that PX Mart also offers; 1 until the service list is collected.'] },
      rings: { zh: ['三圈家數', '以步行、機車、汽車三種交通方式界定競合範圍，分別計算圈內的異品牌與同品牌家數，六個數字分開呈現。市、鎮、里：50／100／500 m；鄉、村：100／500／1,000 m（汽車，或仍為機車）。依地區實際型態選用，不只看行政名稱。'], en: ['Three-ring Counts', 'Walk, scooter and car define the competitive range; count rival and same-brand stores in each ring and report the six numbers separately. Towns and urban wards: 50 / 100 / 500 m; rural townships and villages: 100 / 500 / 1,000 m (car, or still scooter). Choose by the actual pattern, not just the administrative label.'] },
      geocode: { zh: ['地理編碼', '把地址轉成經緯度。建議先整理地址（取第一個門牌號、去除「地下」等描述、統一台／臺），再用內政部 TGOS 全國門牌地址定位；找不到的以 ArcGIS 或 OpenStreetMap 補（課堂工具 Map-In Tool）。使用 OpenStreetMap 須標示「© OpenStreetMap contributors」。'], en: ['Geocoding', 'Turning addresses into coordinates. Clean addresses first (first house number, drop "basement" notes, unify 台/臺), then use the TGOS national address locator; fill gaps with ArcGIS or OpenStreetMap (the in-class Map-In Tool). Credit "© OpenStreetMap contributors" when using OSM.'] },
      lanes: { zh: ['比較列', '圖中的一條水平列代表一個地區案例，最多 3 列；範例並列埔里與西屯兩個獨立案例，各自分析，不做直接比較。'], en: ['Comparison Row', 'Each horizontal row is one area case, up to three; the example lists Puli and Xitun as separate cases, analysed on their own rather than compared directly.'] },
      chosen: { zh: ['Chosen firm/platform', 'W9 提案格式的第二項：選定要分析的企業或平台。本範例選的是便利商店與超市五大品牌。'], en: ['Chosen Firm / Platform', 'The second item of the W9 proposal format: the firms or platforms to analyse. The example takes five convenience-store and supermarket brands.'] },
      aq: { zh: ['分析問題 AQ', 'TP 版的「假說」：標在連線上，說明兩個節點之間要回答的問題，並自動編號列在圖下方。'], en: ['Analysis Question (AQ)', 'The TP counterpart of a hypothesis: written on a link, stating what the two nodes should answer, auto-numbered below the diagram.'] },
      opendata: { zh: ['全國5大超商資料集', '政府開放資料平台（data.gov.tw）的經濟部商工登記資料：統一超商、全家、萊爾富、來來超商（OK）、全聯的分公司名稱、地址、狀態與核准設立日期，約 2 萬筆；沒有經緯度，需自行地理編碼。'], en: ['Five Major Convenience Store Chains Dataset', 'Company-registry data on data.gov.tw: branch names, addresses, status and approval dates for 7-ELEVEN, FamilyMart, Hi-Life, OK mart (Lai Lai) and PX Mart, about 20,000 records; no coordinates, so geocoding is needed.'] },
      tos: { zh: ['服務條款與 robots.txt', '網站宣告自動存取規則的檔案與使用條款；明確禁止時改用半自動整理，不以技術手段規避。'], en: ['Terms of Service & robots.txt', "A site's rules for automated access; where it is forbidden, compile the data semi-automatically instead of circumventing it."] },
      matchrate: { zh: ['比對差異率', '地理編碼後反查店名或抽查官網，對不上的比例；這是 W16「Data Quality」最直接的證據。1141 範例約 15% 店名不符，但其中約三成是「統一超商／7-Eleven」這類品牌別名誤判，所以要先套別名表。'], en: ['Mismatch Rate', 'The share of stores whose reverse-geocoded name or website location does not match — the most direct evidence for W16 Data Quality. In the 1141 example about 15% did not match, but roughly a third were brand-alias false alarms (e.g. 統一超商 vs 7-Eleven), so apply an alias list first.'] },
      mops: { zh: ['MOPS 公開資訊觀測站', '上市櫃公司的財務報表與年報；五個品牌中只有統一超與全家是上市櫃公司，財務比較只做這兩家。'], en: ['MOPS', "Taiwan's disclosure site for listed companies' financial statements and annual reports; of the five brands only President Chain Store and FamilyMart are listed, so financial comparison covers these two."] },
      coopetition: { zh: ['競合 Co-opetition', '同時競爭與合作：不只把對手看成威脅，也看互補者如何一起把餅做大，再來分餅。'], en: ['Co-opetition', 'Competing and co-operating at once: rivals are not only threats; complementors help make the pie bigger before it is divided.'] },
      parts: { zh: ['PARTS', '分析與改變賽局的五個槓桿：Players 參賽者、Added value 附加價值、Rules 規則、Tactics 戰術、Scope 範疇。'], en: ['PARTS', 'Five levers for analysing and reshaping the game: Players, Added value, Rules, Tactics, Scope.'] },
      valuenet: { zh: ['價值網 Value Net', '以企業為中心，上下是顧客與供應商，左右是競爭者與互補者；同一家公司可能同時扮演兩種角色。'], en: ['Value Net', 'The firm at the centre, customers and suppliers above and below, competitors and complementors on either side; one company can play two roles at once.'] },
      complementor: { zh: ['互補者', '讓顧客更看重你的產品的一方。例如物流、金流業者讓門市的取貨與繳費服務更有價值。'], en: ['Complementor', 'A player that makes customers value your product more — e.g. logistics and payment providers make in-store pickup and bill payment more valuable.'] },
      addedvalue: { zh: ['附加價值', '有你在與沒有你在時，整個賽局價值的差額。共同供應商的商品各家都有，附加價值低；自有品牌與獨家服務才是差異所在。'], en: ['Added Value', 'The size of the pie with you minus the size without you. Products from shared suppliers add little; private labels and exclusive services make the difference.'] },
      tactics: { zh: ['戰術 Tactics', '改變他人認知的行動，例如展店選址、在同一側路邊卡位、促銷訊號。'], en: ['Tactics', "Moves that shape others' perceptions, such as site selection, taking the same side of the road, or promotional signals."] },
      amc: { zh: ['AMC 架構', '對手是否回應，取決於察覺（Awareness）、動機（Motivation）與能力（Capability）三者是否同時具備。'], en: ['AMC Framework', 'Whether a rival responds depends on awareness, motivation and capability all being present.'] },
      commonality: { zh: ['市場共同性與資源相似性', 'Chen (1996) 的競爭者分析兩軸：市場重疊越多、資源越相似，雙方越可能直接交手。本範例以三圈家數衡量市場重疊，以商品與服務的重疊比例衡量資源相似。'], en: ['Market Commonality & Resource Similarity', 'The two axes of competitor analysis in Chen (1996): the more markets overlap and resources resemble, the more likely direct rivalry. Here three-ring counts measure market overlap; the overlap of products and services measures resource similarity.'] },
      actresp: { zh: ['行動—回應', '競爭動態的基本單位：一方發動行動（例如展店），另一方是否、何時、以何種方式回應。'], en: ['Action–Response', 'The basic unit of competitive dynamics: one firm acts (e.g. opens a store) and the other decides whether, when and how to respond.'] },
      cluster: { zh: ['群聚', '異品牌分店集中在同一地點。它可能是卡位競爭，也可能是一起吸引人潮的合作，正是「競合」的例子；是否「比隨機更集中」可用 CLQ 判斷。'], en: ['Clustering', 'Rival stores concentrated in one spot — competitive positioning or co-operation that draws shoppers: a case of co-opetition. CLQ tests whether it is more concentrated than chance.'] },
      sameside: { zh: ['同側與對側（進階）', '同一方向路邊的分店搶同一批用路人；對側的分店要過馬路才到，競爭較間接。需要道路資料判斷，列為選配。'], en: ['Same Side vs Opposite Side (advanced)', 'Stores on the same side of the road compete for the same passers-by; those across the road compete less directly. It needs road data, so it is optional.'] },
      platform: { zh: ['平台', '連接兩群以上使用者、讓他們彼此交換價值的商業模式；門市透過店內機台連接消費者與服務提供者。'], en: ['Platform', 'A business model that connects two or more user groups so they exchange value; a store connects shoppers with service providers through its kiosks.'] },
      netfx: { zh: ['網路效應', '使用者越多，每位使用者得到的價值越高。同邊：同一群使用者之間；跨邊：一邊越多，另一邊越想加入。'], en: ['Network Effects', 'Each user gains more as the user base grows. Same-side: within one group; cross-side: more on one side attracts the other.'] },
      kiosk: { zh: ['店內多功能機台', '例如 7-ELEVEN 的 ibon、全家的 FamiPort，提供票券、繳費、列印等服務，讓門市具有平台性質。'], en: ['In-store Kiosk', "e.g. 7-ELEVEN's ibon and FamilyMart's FamiPort, offering tickets, bill payment and printing — the feature that makes a store platform-like."] },
      bi: { zh: ['BI 商業智慧', 'M1 的重點：資料＋視覺化＋策略敘事。先用 Looker Studio 拖拉做儀表板，再用 AI 協作做成 HTML＋Chart.js 網頁。'], en: ['Business Intelligence (BI)', 'The focus of M1: data + visualisation + strategic storytelling. Build a Looker Studio dashboard first, then an HTML + Chart.js page with AI.'] },
      nn: { zh: ['最近異品牌距離', '每家分店到最近一家「不同品牌」分店的距離；平均越短，表示越群聚。'], en: ['Nearest Rival Distance', 'The distance from each store to the closest store of a different brand; the shorter the average, the stronger the clustering.'] },
      jamovi: { zh: ['jamovi', 'M2 使用的免費統計軟體，以圖形介面完成描述統計、t 檢定、相關與迴歸。'], en: ['jamovi', 'The free statistics package used in M2: descriptives, t-tests, correlation and regression through a graphical interface.'] },
      insight: { zh: ['商業洞察', 'W16 評分占 20%：不只呈現資料，還要說明「所以呢」，給出可行的策略建議。'], en: ['Business Insight', 'Worth 20% at W16: not just showing data but explaining "so what" and giving actionable strategy advice.'] },

      sysprompt: { zh: ['System Prompt', '意圖工程第一層，定義穩定不變的角色與輸出基調，例如「你是一位晨報總編輯」。'], en: ['System Prompt', 'Layer 1 of intent engineering: a stable role and tone, e.g. "You are the editor-in-chief of a morning brief".'] },
      dyncontext: { zh: ['Dynamic Context', '意圖工程第二層，注入每次都不同的即時資訊，例如日期、時區、當日範圍與偏好。'], en: ['Dynamic Context', 'Layer 2 of intent engineering: live information that changes each run, such as date, time zone, scope and preferences.'] },
      kb: { zh: ['Long-term KB', '意圖工程第三層，載入長期規範檔案；本 TP 共四個：theme_config、business_rules、sources、ksa_taxonomy。'], en: ['Long-term KB', 'Layer 3 of intent engineering: long-term rule files; this TP uses four — theme_config, business_rules, sources, ksa_taxonomy.'] },
      subagent: { zh: ['Subagent 併發分工', 'Data Fetcher 專責抓資料，AI Summarizer 專責提煉與撰寫；分開後，出錯時能立刻判斷是抓錯還是摘壞。'], en: ['Subagents in Parallel', 'The Data Fetcher only fetches; the AI Summarizer only distils and writes. Splitting them shows at once whether an error came from fetching or summarising.'] },
      harness: { zh: ['Harness Engineering', '源自「馬具」的比喻：讓模型能力被安全導引的裝置，包含工具綁定、執行沙箱與安全護欄三層。'], en: ['Harness Engineering', 'From the image of a horse harness: the gear that guides model power safely — tool binding, an execution sandbox and security guardrails.'] },
      sandbox: { zh: ['Execution Sandbox', '隔離的執行環境，程式碼在受限空間中執行，即使出錯或被惡意誘導，也波及不到主系統與本機檔案。'], en: ['Execution Sandbox', 'An isolated runtime: code runs in a restricted space, so errors or manipulation cannot reach the main system or local files.'] },
      guardrails: { zh: ['Security Guardrails', '包含 PII 個資遮蔽與防暴卡槽（速率限制與資源上限），避免個資外流，也避免失控的迴圈燒光額度。'], en: ['Security Guardrails', 'PII masking plus circuit breakers (rate limits and resource caps), preventing data leaks and runaway loops that burn through quotas.'] },
      injection: { zh: ['Prompt Injection', '外部內容夾帶指令式語句、誘使模型忽略原有指示的攻擊；防禦關鍵是把抓回的內容一律視為資料，而非指令。'], en: ['Prompt Injection', 'An attack where external content carries instructions that make the model ignore its own; the defence is to treat fetched content as data, never as instructions.'] },
      envkey: { zh: ['.env 金鑰隔離', 'API 金鑰只放本機 .env（已加入 .gitignore）或平台環境變數、Repo Secrets；一旦外洩，立刻撤銷並重新產生。'], en: ['.env Key Isolation', 'API keys live only in a local .env (listed in .gitignore) or platform variables / repo secrets; if leaked, revoke and regenerate at once.'] },
      qa: { zh: ['QA Tester', '檢查內容本身：字數、排版、商業啟示、出處與原連結，以及是否有全文複製。'], en: ['QA Tester', 'Checks the content itself: length, layout, business insight, sources and links, and any verbatim copying.'] },
      devops: { zh: ['DevOps', '檢查運行條件：部署是否成功、排程是否觸發、憑證是否過期、日誌是否有紀錄。'], en: ['DevOps', 'Checks the running conditions: deployment, scheduled triggers, credential expiry and logs.'] },
      heartbeat: { zh: ['Heartbeat Trigger 心跳排程', '每天固定時間自動喚醒系統；要想清楚三件事：時區、有上限的重試、失敗通知。'], en: ['Heartbeat Trigger', 'Wakes the system at a fixed time each day; decide three things: time zone, capped retries and failure alerts.'] },
      react: { zh: ['ReAct Loop', '思考 → 呼叫工具 → 觀察修正的循環，讓模型依觀察結果決定要不要再走一輪。'], en: ['ReAct Loop', 'The think → call a tool → observe cycle that lets the model decide whether another round is needed.'] },
      qc: { zh: ['QC Feedback 與 Self-Correction', '格式或字數未達標就自動退回重寫，形成自我校正的閉迴路；必須設定重寫上限，避免死循環。'], en: ['QC Feedback & Self-Correction', 'Output that fails format or length checks is sent back for rewriting, closing the self-correction loop; a rewrite cap prevents endless loops.'] },
      degradation: { zh: ['優雅降級', '來源失效時依序改用備援；全部失敗仍照常出刊，並誠實標示缺漏。不得無限重試，也不得整份停發。'], en: ['Graceful Degradation', 'When a source fails, try fallbacks in order; if all fail, still publish and label what is missing. No endless retries, no skipped brief.'] },
      push: { zh: ['推播通知', '把「使用者主動去看」變成「成果主動抵達」。註：LINE Notify 已於 2025 年 3 月 31 日終止服務，可改用 LINE Messaging API、Email 或 Telegram。'], en: ['Push Notification', 'Turns "go and look" into "the result arrives". Note: LINE Notify ended on 31 March 2025; use the LINE Messaging API, email or Telegram instead.'] },
      skillmd: { zh: ['SKILL.md', '把整套流程封裝成可重複執行的說明檔，功能像作業手冊，讓接手者不必重讀程式碼即可維護與重新部署。'], en: ['SKILL.md', 'Packages the whole workflow as repeatable instructions — an operations manual that lets successors maintain and redeploy without rereading the code.'] },
      copyright: { zh: ['Copyright Claim 防衛', '禁止全文複製，只做衍生摘要並附出處與原連結；遵守 robots.txt 與服務條款，AI 生成內容須經人工審閱。'], en: ['Copyright Claim Defence', 'No verbatim copying: derivative summaries with sources and links; respect robots.txt and terms of service; AI output is human-reviewed.'] },
      nocode: { zh: ['無 Code 維護性', '業務邏輯與程式解耦，改 .md 即可維護；它決定了「誰有權力改變這個系統」——懂業務的人。'], en: ['No-Code Maintainability', 'Business logic is decoupled from code, so editing .md maintains the system; it decides who can change the system — the people who know the business.'] }
    }, B_SHAPES_GLOSS),
    guide: {
      zh: ['B 圖呈現晨報 Agent 的「系統流程」，骨架取自 IPOB 藍圖：左欄 INPUT／INTENTION 收斂意圖，中欄 PROCESS 處理資料與工具，右欄 OUTPUT & LOOP 把關、交付並每天自動喚醒；底部治理層橫貫三欄。', '建議步驟：① 先確認 KB 四個檔案與資料來源模式（自動／半自動）；② 逐一檢查每個節點的「負責角色」，圖下方會自動產生團隊分工表；③ 回饋迴路（虛線 L1、L2…）要寫明上限：重試幾次、重寫幾次、超過怎麼降級；④ 節點右下角的「→ A②」對應 A 架構圖，兩張圖的內容要一致。', '新增連線預設為流程箭頭；在右側把類型改為「回饋迴路」，就會變成編號的虛線弧形箭頭。'],

   (plain JS, no JSX)

const G = {
  TOP: 118, PADX: 12, PADY: 11, GAPY: 22,
  FRAME_TOP: 32, FRAME_BOT: 50, FRAME_PADX: 14,
  LANE_LABEL_W: 34, LANE_GAP: 34,
  FONT: "Inter, 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', 'Heiti TC', sans-serif",
  SERIF: "Merriweather, 'Noto Serif TC', 'Noto Sans TC', 'Microsoft JhengHei', serif"
};

const WIDE_RE = /[⺀-鿿豈-﫿︰-﹏＀-￯　-〿①-⓿★☆]/;
function textW(s, fs) {
  let w = 0;
  for (const ch of String(s)) {
    if (WIDE_RE.test(ch)) w += fs;
    else if (ch === ' ') w += fs * 0.3;
    else if (/[il.,:;|!'’()\[\]\/]/.test(ch)) w += fs * 0.32;
    else if (/[A-Z0-9%&@#MW]/.test(ch)) w += fs * 0.66;
    else w += fs * 0.55;
  }
  return w;
}
function wrapText(s, maxW, fs) {
  s = String(s || '');
  if (!s) return [];
  const tokens = s.match(/[⺀-鿿豈-﫿︰-﹏＀-￯　-〿]|[^\s⺀-鿿豈-﫿︰-﹏＀-￯　-〿]+|\s+/g) || [];
  const lines = []; let cur = '';
  for (let t of tokens) {
    if (/^\s+$/.test(t)) { if (cur) cur += ' '; continue; }
    if (textW(cur + t, fs) <= maxW) { cur += t; continue; }
    // closing punctuation stays on the current line
    if (/^[，。、；：？！）」』,.;:?!)]$/.test(t) && cur) { cur += t; continue; }
    if (cur.trim()) lines.push(cur.trimEnd());
    cur = '';
    while (textW(t, fs) > maxW) {
      let i = 1;
      while (i < t.length && textW(t.slice(0, i + 1), fs) <= maxW) i++;
      lines.push(t.slice(0, i)); t = t.slice(i);
    }
    cur = t;
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  return lines;
}

const getText = (n) => (n.variants ? n.variants[n.variant || 'auto'] : n.text) || { zh: { title: '', items: [] }, en: { title: '', items: [] } };
const roleOf = (tpl, id) => tpl.roles.find(r => r.id === id) || tpl.roles[0];

/* Build the drawable lines of a node for a display mode (zh | en | both). */
function nodeBox(n, tpl, mode) {
  const role = roleOf(tpl, n.role), W = role.w || tpl.nodeW;
  const sx = role.shape === 'decision' ? 12 : 0; /* hexagon: keep text clear of the pointed sides */
  const inner = W - G.PADX * 2 - sx * 2;
  const txt = getText(n);
  const prim = mode === 'en' ? 'en' : 'zh';
  const lines = [];
  let y = G.PADY;
  const badgeIndent = (role.badge ? 24 : 0) + sx;
  const push = (arr, o) => arr.forEach(t => { y += o.lh; lines.push({ t, x: o.x, y: y - o.lh * 0.28, fs: o.fs, fw: o.fw || 400, fill: o.fill || '#1f2937', fi: o.fi || 'normal' }); });
  // title
  const tPrim = (txt[prim] && txt[prim].title) || (txt.zh && txt.zh.title) || '';
  push(wrapText(tPrim, inner - badgeIndent, 14.5), { x: G.PADX + badgeIndent, fs: 14.5, fw: 700, lh: 19, fill: '#0f172a' });
  if (mode === 'both' && txt.en && txt.en.title) {
    push(wrapText(txt.en.title, inner - badgeIndent, 11.5), { x: G.PADX + badgeIndent, fs: 11.5, lh: 15, fill: '#475569', fi: 'italic' });
  }
  let pillY = null;
  if (n.variants) { y += 5; pillY = y; y += 18; }
  y += 5;
  const iz = (txt[prim] && txt[prim].items) || [];
  const ie = (txt.en && txt.en.items) || [];
  const count = Math.max(iz.length, mode === 'both' ? ie.length : 0);
  const bullets = [];
  for (let i = 0; i < count; i++) {
    const a = (iz[i] || '').trim(), b = (ie[i] || '').trim();
    if (!a && !(mode === 'both' && b)) continue;
    const startY = y;
    if (a) push(wrapText(a, inner - 11, 12), { x: G.PADX + 11 + sx, fs: 12, lh: 16.5, fill: '#1f2937' });
    if (mode === 'both' && b) push(wrapText(b, inner - 11, 10.5), { x: G.PADX + 11 + sx, fs: 10.5, lh: 14, fill: '#64748b', fi: 'italic' });
    bullets.push(startY + 16.5 * 0.72);
    y += 3;
  }
  let tagY = null;
  const owner = tpl.owners && n.owner ? tpl.owners.find(o => o.id === n.owner) : null;
  if (n.tag || owner || n.xref) { y += 4; tagY = y; y += 18; }
  y += G.PADY + (role.shape === 'doc' ? 8 : 0);
  return { w: W, h: Math.max(y, 54), lines, bullets, pillY, tagY, badgeIndent, sx, owner };
}

function laneOn(tpl) { return !!(tpl.lanes && tpl.lanes.enabled); }
function rowPhases(tpl) { return !!(tpl.phases && tpl.phaseDir === 'row'); }
function leftX(tpl) { return laneOn(tpl) || rowPhases(tpl) ? 14 + G.LANE_LABEL_W + 20 : 36; }
function colX(tpl, c) { return leftX(tpl) + c * (tpl.nodeW + tpl.gapX) + ((tpl.colShift && tpl.colShift[c]) || 0); }
const colOfN = (tpl, n) => (n.col !== undefined ? n.col : roleOf(tpl, n.role).col);
const rowOfN = (tpl, n) => (n.row !== undefined ? n.row : (roleOf(tpl, n.role).row !== undefined ? roleOf(tpl, n.role).row : 1));
const inBand = (tpl, n) => !!(tpl.band && tpl.band.roles.includes(n.role));
function isPerLane(tpl, n) { return laneOn(tpl) && !!roleOf(tpl, n.role).perLane; }

/* Auto layout: returns a new nodes array with x/y set. */
function autoLayout(d, tpl, mode) {
  const boxes = {}; d.nodes.forEach(n => boxes[n.id] = nodeBox(n, tpl, mode));
  const gRole = {}; (tpl.groups || []).forEach(g => g.roles.forEach(r => gRole[r] = g.id));
  const order = {}; tpl.roles.forEach((r, i) => order[r.id] = i);
  const sortFn = (a, b) => (order[a.role] - order[b.role]) || (a.y - b.y);
  const place = (arr, y0) => {
    let y = y0, prevG = null; const pos = {};
    arr.forEach((n, i) => {
      const g = gRole[n.role] || null;
      if (i > 0) y += G.GAPY;
      if (g !== prevG) { if (prevG) y += G.FRAME_BOT - 8; if (g) y += G.FRAME_TOP; }
      pos[n.id] = y; y += boxes[n.id].h; prevG = g;
    });
    if (prevG) y += G.FRAME_BOT;
    return { pos, h: y - y0 };
  };
  const colOf = n => (n.col !== undefined ? n.col : roleOf(tpl, n.role).col);
  if (tpl.grid) {
    const rowOf = n => (n.row !== undefined ? n.row : (roleOf(tpl, n.role).row !== undefined ? roleOf(tpl, n.role).row : 1));
    const cells = {};
    d.nodes.forEach(n => { const k = colOf(n) + '_' + rowOf(n); (cells[k] = cells[k] || []).push(n); });
    const nRows = Math.max(1, ...d.nodes.map(n => rowOf(n) + 1));
    const rowH = Array(nRows).fill(0);
    Object.entries(cells).forEach(([k, arr]) => { arr.sort(sortFn); const r = +k.split('_')[1]; rowH[r] = Math.max(rowH[r], place(arr, 0).h); });
    const rowTop = []; let yy = G.TOP + (tpl.topPad || 0);
    for (let r = 0; r < nRows; r++) { rowTop[r] = yy; yy += (rowH[r] || 0) + (rowH[r] ? (tpl.rowGap || G.GAPY * 2) : 0); }
    const pos = {};
    Object.entries(cells).forEach(([k, arr]) => {
      const [c, r] = k.split('_').map(Number); const h = place(arr, 0).h;
      const res = place(arr, rowTop[r] + (tpl.alignTop ? 0 : (rowH[r] - h) / 2));
      arr.forEach(n => pos[n.id] = { x: colX(tpl, c), y: Math.round(res.pos[n.id]) });
    });
    return d.nodes.map(n => pos[n.id] ? { ...n, ...pos[n.id] } : n);
  }
  const lanes = laneOn(tpl) ? d.lanes.length : 1;
  const newPos = {};
  const bandTop = [], bandH = [];
  let cursor = G.TOP;
  for (let l = 0; l < lanes; l++) {
    const laneNodes = d.nodes.filter(n => laneOn(tpl) ? (isPerLane(tpl, n) && n.lane === l) : true);
    let maxH = 90;
    const cols = {};
    laneNodes.forEach(n => { (cols[colOf(n)] = cols[colOf(n)] || []).push(n); });
    Object.values(cols).forEach(arr => { arr.sort(sortFn); maxH = Math.max(maxH, place(arr, 0).h); });
    bandTop[l] = cursor; bandH[l] = maxH;
    Object.entries(cols).forEach(([c, arr]) => {
      const r = place(arr, 0); const y0 = cursor + (maxH - r.h) / 2;
      const r2 = place(arr, y0);
      arr.forEach(n => newPos[n.id] = { x: colX(tpl, +c), y: Math.round(r2.pos[n.id]) });
    });
    cursor += maxH + G.LANE_GAP;
  }
  if (laneOn(tpl)) {
    const totalH = cursor - G.LANE_GAP - G.TOP;
    const shared = d.nodes.filter(n => !isPerLane(tpl, n));
    const cols = {};
    shared.forEach(n => { (cols[colOf(n)] = cols[colOf(n)] || []).push(n); });
    Object.entries(cols).forEach(([c, arr]) => {
      arr.sort(sortFn);
      const r = place(arr, 0); const y0 = G.TOP + Math.max(0, (totalH - r.h) / 2);
      const r2 = place(arr, y0);
      arr.forEach(n => newPos[n.id] = { x: colX(tpl, +c), y: Math.round(r2.pos[n.id]) });
    });
  }
  return d.nodes.map(n => newPos[n.id] ? { ...n, ...newPos[n.id] } : n);
}

/* Geometry helpers ------------------------------------------------ */
function computeGeometry(d, tpl, mode) {
  const boxes = {}; d.nodes.forEach(n => boxes[n.id] = nodeBox(n, tpl, mode));
  const rects = {}; d.nodes.forEach(n => rects['n:' + n.id] = { x: n.x, y: n.y, w: boxes[n.id].w, h: boxes[n.id].h });
  // frames
  const frames = [];
  const lanes = laneOn(tpl) ? d.lanes.map((_, i) => i) : [null];
  (tpl.groups || []).forEach(g => {
    lanes.forEach(l => {
      const ns = d.nodes.filter(n => g.roles.includes(n.role) && (l === null || n.lane === l));
      if (!ns.length) return;
      const x1 = Math.min(...ns.map(n => n.x)), y1 = Math.min(...ns.map(n => n.y));
      const x2 = Math.max(...ns.map(n => n.x + boxes[n.id].w)), y2 = Math.max(...ns.map(n => n.y + boxes[n.id].h));
      const ref = 'g:' + g.id + ':' + (l === null ? 0 : l);
      const r = { x: x1 - G.FRAME_PADX, y: y1 - G.FRAME_TOP + 4, w: x2 - x1 + G.FRAME_PADX * 2, h: y2 - y1 + G.FRAME_TOP - 4 + G.FRAME_BOT - 8 };
      rects[ref] = r; frames.push({ ref, g, lane: l, ...r });
    });
  });
  // bands
  const bands = [];
  if (laneOn(tpl)) {
    d.lanes.forEach((ln, l) => {
      const ns = d.nodes.filter(n => isPerLane(tpl, n) && n.lane === l);
      const rs = ns.map(n => rects['n:' + n.id]).concat(frames.filter(f => f.lane === l));
      if (!rs.length) return;
      const y1 = Math.min(...rs.map(r => r.y)) - 14, y2 = Math.max(...rs.map(r => r.y + r.h)) + 14;
      bands.push({ lane: l, ln, y: y1, h: y2 - y1 });
    });
  }
  // phase bands (B diagrams): columns (I-P-O) or rows (thesis chapters)
  const phases = [];
  if (tpl.phases) {
    const body = d.nodes.filter(n => !inBand(tpl, n));
    const rOf = n => rects['n:' + n.id];
    const fr = ns => frames.filter(f => d.nodes.some(n => ns.includes(n) && f.g.roles.includes(n.role)));
    if (tpl.phaseDir === 'row') {
      tpl.phases.forEach((ph, i) => {
        const ns = body.filter(n => ph.rows.includes(rowOfN(tpl, n)));
        if (!ns.length) return;
        const rs = ns.map(rOf);
        const y1 = Math.min(...rs.map(r => r.y)) - 14, y2 = Math.max(...rs.map(r => r.y + r.h)) + 14;
        phases.push({ i, ph, y: y1, h: y2 - y1 });
      });
    } else {
      const cols = tpl.phases.map(ph => { const ns = body.filter(n => ph.cols.includes(colOfN(tpl, n))); return { ph, rs: ns.map(rOf).concat(fr(ns)) }; });
      const all = [].concat(...cols.map(c => c.rs));
      if (all.length) {
        const y1 = Math.min(...all.map(r => r.y)) - 40, y2 = Math.max(...all.map(r => r.y + r.h)) + 34;
        cols.forEach((c, i) => {
          const x1 = c.rs.length ? Math.min(...c.rs.map(r => r.x)) - 14 : colX(tpl, c.ph.cols[0]) - 14;
          const x2 = c.rs.length ? Math.max(...c.rs.map(r => r.x + r.w)) + 14 : colX(tpl, c.ph.cols[c.ph.cols.length - 1]) + tpl.nodeW + 14;
          phases.push({ i, ph: c.ph, x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
        });
      }
    }
  }
  // cross-cutting band (governance / ethics)
  let xband = null;
  if (tpl.band) {
    const ns = d.nodes.filter(n => inBand(tpl, n));
    if (ns.length) {
      const rs = ns.map(n => rects['n:' + n.id]);
      const x1 = Math.min(...rs.map(r => r.x)) - 14, x2 = Math.max(...rs.map(r => r.x + r.w)) + 14;
      const y1 = Math.min(...rs.map(r => r.y)) - 34, y2 = Math.max(...rs.map(r => r.y + r.h)) + 14;
      xband = { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
    }
  }
  // return channel for long feedback loops (between the phase bands and the cross band)
  const colPh = phases.filter(p => p.w);
  const channelY = colPh.length ? Math.max(...colPh.map(p => p.y + p.h)) + 20 : null;
  let farIdx = 0;
  // edges
  const edgeGeo = {};
  const center = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });
  const geo = (e, depth) => {
    if (edgeGeo[e.id]) return edgeGeo[e.id];
    const a = rects[e.from];
    if (!a) return null;
    let res;
    if (e.to.startsWith('e:')) {
      if (depth > 3) return null;
      const te = d.edges.find(x => 'e:' + x.id === e.to);
      if (!te || te.id === e.id) return null;
      const tg = geo(te, depth + 1); if (!tg) return null;
      const t = tg.mid, ac = center(a);
      let p0;
      if (t.y > a.y + a.h) p0 = { x: ac.x, y: a.y + a.h };
      else if (t.y < a.y) p0 = { x: ac.x, y: a.y };
      else p0 = t.x > ac.x ? { x: a.x + a.w, y: ac.y } : { x: a.x, y: ac.y };
      const mid = { x: (p0.x + t.x) / 2, y: (p0.y + t.y) / 2 };
      res = { d: `M${p0.x},${p0.y} L${t.x},${t.y}`, mid, p0, p3: t };
    } else if (tpl.mainStyle === 'loop' && e.kind === 'main' && rects[e.to] && e.from !== e.to) {
      /* feedback loop: dashed return path */
      const b = rects[e.to]; const ac = center(a), bc = center(b);
      const overlapX = a.x < b.x + b.w && b.x < a.x + a.w;
      const gapX = a.x > b.x ? a.x - (b.x + b.w) : b.x - (a.x + a.w);
      const cub = (p0, c1, c2, p3) => ({ d: `M${p0.x},${p0.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p3.x},${p3.y}`, mid: { x: (p0.x + 3 * c1.x + 3 * c2.x + p3.x) / 8, y: (p0.y + 3 * c1.y + 3 * c2.y + p3.y) / 8 }, p0, p3, c1, c2, loop: true });
      if (e.side === 'bottom' || e.side === 'top') { /* explicit arc below / above both nodes */
        const up = e.side === 'top';
        const p0 = { x: ac.x, y: up ? a.y : a.y + a.h }, p3 = { x: bc.x, y: up ? b.y : b.y + b.h };
        const ey = up ? Math.min(p0.y, p3.y) : Math.max(p0.y, p3.y);
        const bow = (up ? -1 : 1) * Math.min(80, 34 + Math.abs(p3.x - p0.x) * 0.1);
        res = cub(p0, { x: p0.x + (p3.x - p0.x) * 0.15, y: ey + bow }, { x: p3.x - (p3.x - p0.x) * 0.15, y: ey + bow }, p3);
      } else if (overlapX) { /* same column: out and back on the right (or left) side */
        const side = e.side === 'left' ? -1 : 1;
        const p0 = { x: side > 0 ? a.x + a.w : a.x, y: ac.y }, p3 = { x: side > 0 ? b.x + b.w : b.x, y: bc.y };
        const ex = side > 0 ? Math.max(p0.x, p3.x) : Math.min(p0.x, p3.x);
        const bow = side * (40 + Math.abs(p3.y - p0.y) * 0.1);
        res = cub(p0, { x: ex + bow, y: p0.y }, { x: ex + bow, y: p3.y }, p3);
      } else if (gapX < 110 || !channelY) { /* neighbouring columns: side to side */
        const dir = bc.x > ac.x ? 1 : -1;
        const clamp = (v, r) => Math.max(r.y + 16, Math.min(r.y + r.h - 16, v));
        const p0 = { x: dir > 0 ? a.x + a.w : a.x, y: clamp(bc.y, a) + 12 }, p3 = { x: dir > 0 ? b.x : b.x + b.w, y: clamp(ac.y, b) + 12 };
        const c = (p3.x - p0.x) / 2;
        res = cub(p0, { x: p0.x + c, y: p0.y + 18 }, { x: p3.x - c, y: p3.y + 18 }, p3);
      } else { /* distant columns: along the return channel below the phase bands */
        const k = farIdx++;
        const yc = channelY + k * 16, r = 10;
        const dir = bc.x < ac.x ? -1 : 1;
        const xo = dir < 0 ? a.x + a.w + 7 + k * 4 : a.x - 7 - k * 4;       /* leave on the outer side of the source */
        const xg = dir < 0 ? b.x - 30 - k * 8 : b.x + b.w + 30 + k * 8;    /* climb in the gap next to the target */
        const ty = bc.y - 8 + k * 8, sy = ac.y + 8;
        const sx0 = dir < 0 ? a.x + a.w : a.x, tx = dir < 0 ? b.x : b.x + b.w;
        const sgo = xo > sx0 ? 1 : -1, sgi = tx > xg ? 1 : -1;
        const dd = [`M${sx0},${sy}`, `L${xo - sgo * r},${sy}`, `Q${xo},${sy} ${xo},${sy + r}`, `L${xo},${yc - r}`, `Q${xo},${yc} ${xo - sgo * r * 0 + (xg < xo ? -r : r)},${yc}`,
          `L${xg + (xg < xo ? r : -r)},${yc}`, `Q${xg},${yc} ${xg},${yc - r}`, `L${xg},${ty + r}`, `Q${xg},${ty} ${xg + sgi * r},${ty}`, `L${tx},${ty}`].join(' ');
        res = { d: dd, mid: { x: (xo + xg) / 2 + (k % 2 ? 80 : -80) * Math.ceil(k / 2), y: yc }, p0: { x: sx0, y: sy }, p3: { x: tx, y: ty }, loop: true, channel: true };
      }
    } else {
      const b = rects[e.to]; if (!b || e.from === e.to) return null;
      const ac = center(a), bc = center(b);
      const dx = bc.x - ac.x, dy = bc.y - ac.y;
      const overlapX = a.x < b.x + b.w && b.x < a.x + a.w;
      let p0, p3, c1, c2;
      if (!overlapX && Math.abs(dx) >= Math.abs(dy) * 0.5) {
        p0 = dx > 0 ? { x: a.x + a.w, y: ac.y } : { x: a.x, y: ac.y };
        p3 = dx > 0 ? { x: b.x, y: bc.y } : { x: b.x + b.w, y: bc.y };
        const c = (p3.x - p0.x) / 2;
        c1 = { x: p0.x + c, y: p0.y }; c2 = { x: p3.x - c, y: p3.y };
      } else {
        p0 = dy > 0 ? { x: ac.x, y: a.y + a.h } : { x: ac.x, y: a.y };
        p3 = dy > 0 ? { x: bc.x, y: b.y } : { x: bc.x, y: b.y + b.h };
        const c = (p3.y - p0.y) / 2;
        c1 = { x: p0.x, y: p0.y + c }; c2 = { x: p3.x, y: p3.y - c };
      }
      const mid = { x: (p0.x + 3 * c1.x + 3 * c2.x + p3.x) / 8, y: (p0.y + 3 * c1.y + 3 * c2.y + p3.y) / 8 };
      res = { d: `M${p0.x},${p0.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p3.x},${p3.y}`, mid, p0, p3, c1, c2 };
    }
    edgeGeo[e.id] = res; return res;
  };
  d.edges.forEach(e => geo(e, 0));
  // labels of moderated links move off the midpoint so the moderating arrow stays visible
  const bez = (g, t) => { const u = 1 - t; return { x: u*u*u*g.p0.x + 3*u*u*t*g.c1.x + 3*u*t*t*g.c2.x + t*t*t*g.p3.x, y: u*u*u*g.p0.y + 3*u*u*t*g.c1.y + 3*u*t*t*g.c2.y + t*t*t*g.p3.y }; };
  d.edges.forEach(e => { const g = edgeGeo[e.id]; if (!g) return; g.label = g.mid;
    if (g.c1 && d.edges.some(x => x.to === 'e:' + e.id)) g.label = bez(g, 0.25); });
  // numbering
  const codes = {}; let k = 0;
  d.edges.forEach(e => { if (e.kind === 'main') codes[e.id] = tpl.prefix + (++k); });
  // bounds
  const allR = Object.values(rects).concat(phases.filter(p => p.w).map(p => ({ x: p.x, y: p.y, w: p.w, h: p.h })), xband ? [xband] : []);
  const maxX = allR.length ? Math.max(...allR.map(r => r.x + r.w)) : 600;
  const maxY = allR.length ? Math.max(...allR.map(r => r.y + r.h)) : G.TOP + 100;
  const W = Math.max(780, Math.ceil(maxX + 40));
  const W2 = rowPhases(tpl) ? Math.max(W, Math.ceil(maxX + 40)) : W;
  return { boxes, rects, frames, bands, phases, xband, edgeGeo, codes, W: W2, contentBottom: maxY + (bands.length || (phases.length && rowPhases(tpl)) ? 16 : 0) };
}

/* Legend lines: numbered relations (H / P / AQ / L) and, for B diagrams, the team-role table */
function legendLines(d, tpl, mode, codes, W) {
  const out = [];
  const maxW = W - 60;
  const head = (bi) => out.push({ head: mode === 'en' ? bi.en : mode === 'both' ? `${bi.zh} ${bi.en}` : bi.zh, lines: [], fs: 13.5 });
  const mains = d.edges.filter(e => e.kind === 'main');
  if (mains.length) head(tpl.legendTitle);
  mains.forEach(e => {
    const code = codes[e.id];

}

/* Misc ------------------------------------------------------------ */
const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const deep = (o) => JSON.parse(JSON.stringify(o));

const VIEWS = ['A', 'B', 'C'];
const NODE_VIEWS = ['A', 'B'];
function tplOf(tplId, view) { return view === 'C' ? TEMPLATES_C[tplId] : view === 'B' ? TEMPLATES_B[tplId] : TEMPLATES[tplId]; }

/* Strip any markup from imported strings (DOMPurify → textContent). */
function cleanStr(s, max) {

}
function cleanBi(o, max) { o = o || {}; return { zh: cleanStr(o.zh, max), en: cleanStr(o.en, max) }; }
function cleanTxt(o) {

}
function sanitizeDiagram(d, tpl) {
  if (!d || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw new Error('bad');

    const base = { id: String(n.id), role: n.role, lane: Number.isInteger(n.lane) ? Math.max(-1, Math.min(2, n.lane)) : -1, x: num(n.x), y: num(n.y), ...(Number.isInteger(n.row) ? { row: Math.max(0, Math.min(9, n.row)) } : {}), ...(Number.isInteger(n.col) ? { col: Math.max(0, Math.min(9, n.col)) } : {}), optional: !!n.optional, tag: cleanStr(n.tag, 60),
      ...(ownerIds.includes(n.owner) ? { owner: n.owner } : {}), ...(n.xref ? { xref: cleanStr(n.xref, 24) } : {}) };
    if (n.variants && typeof n.variants === 'object') return { ...base, variants: { auto: cleanTxt(n.variants.auto), semi: cleanTxt(n.variants.semi) }, variant: n.variant === 'semi' ? 'semi' : 'auto' };
    return { ...base, text: cleanTxt(n.text) };

    id: String(e.id), from: e.from, to: e.to, kind: e.kind === 'flow' ? 'flow' : 'main', sign: e.sign === '-' ? '-' : e.sign === '+' ? '+' : '', text: cleanBi(e.text, 400),
    ...(['left', 'bottom'].includes(e.side) ? { side: e.side } : {})
  }));
  const lanes = laneOn(tpl) ? (Array.isArray(d.lanes) && d.lanes.length ? d.lanes.slice(0, tpl.lanes.max) : [{ id: 'L0', text: tpl.laneNames[0] }]).map((l, i) => ({ id: 'L' + i, text: cleanBi(l && l.text, 80) })) : [];
  return { title: cleanBi(d.title, 160), subtitle: cleanBi(d.subtitle, 160), lanes, nodes, edges };
}
/* Accepts version 1 ({ diagram }) and version 2 ({ view, diagrams: { A, B } }); a missing diagram is rebuilt from the template. */
function sanitizeDoc(obj, mode) {
  if (!obj || obj.app !== 'PDS' || !TEMPLATES[obj.templateId]) throw new Error('bad');
  const id = obj.templateId;
  const src = obj.diagrams && typeof obj.diagrams === 'object' ? obj.diagrams : { A: obj.diagram };
  if (!src.A && !src.B) throw new Error('bad');
  const diagrams = {};
  NODE_VIEWS.forEach(v => { diagrams[v] = src[v] ? sanitizeDiagram(src[v], tplOf(id, v)) : instantiate(id, mode || 'en', v); });
  diagrams.C = src.C ? sanitizeC(src.C, id) : instantiateC(id);
  return { templateId: id, view: VIEWS.includes(obj.view) ? obj.view : 'A', diagrams };
}

/* ============================================================
   Diagram C — one-page summary (A4 portrait, cards)
   ============================================================ */
const PAGE = { W: 1190, H: 1684, PAD: 44, GAP: 22 };
function instantiateC(tplId) { const tc = TEMPLATES_C[tplId]; return { title: deep(tc.title), subtitle: deep(tc.subtitle), cards: {} }; }

/* Live content pulled from Diagrams A and B */
function autoC(key, tplId, ds, people) {
  const A = ds.A || { nodes: [], edges: [], lanes: [] }, B = ds.B || { nodes: [], edges: [] };
  const tA = TEMPLATES[tplId], tB = TEMPLATES_B[tplId];
  const out = { zh: [], en: [] };
  const add = (zh, en) => { out.zh.push(zh); out.en.push(en); };
  const T = (n, L) => (getText(n)[L] || { title: '', items: [] });
  const its = (n, L) => T(n, L).items.filter(Boolean).join(L === 'zh' ? '；' : '; ');
  const byY = (a, b) => (a.y - b.y) || (a.x - b.x);
  const mains = (tpl) => A.edges.filter(e => e.kind === 'main').map((e, i) => {
    const sign = tpl.signs && e.sign ? ` (${e.sign === '-' ? '−' : '+'})` : '';
    return { code: tpl.prefix + (i + 1) + sign, e };
  });
  if (key === 'cdps_scope') {
    const ns = A.nodes.filter(n => n.role === 'scope').sort((a, b) => a.lane - b.lane);
    const its2 = (n, L) => T(n, L).items.filter(Boolean);
    const z0 = ns.length ? its2(ns[0], 'zh') : [], e0 = ns.length ? its2(ns[0], 'en') : [];
    const common = z0.filter(s => ns.every(n => its2(n, 'zh').includes(s)));
    z0.forEach((s, i) => { if (common.includes(s)) add(s, e0[i] || ''); });
    ns.forEach(n => {
      const z = its2(n, 'zh'), e = its2(n, 'en'), idx = z.map((s, i) => i).filter(i => !common.includes(z[i]));
      if (!idx.length) return;
      const lt = ns.length > 1 ? String.fromCharCode(65 + Math.max(0, n.lane)) : '';
      add((lt ? lt + '｜' : '') + idx.map(i => z[i]).join('；'), (lt ? lt + ' | ' : '') + idx.map(i => e[i] || '').join('; '));
    });
  } else if (key === 'pmcs_scope') {
    A.nodes.filter(n => n.role === 'scope').sort((a, b) => a.lane - b.lane).forEach(n => {
      const ln = (A.lanes[n.lane] && A.lanes[n.lane].text) || { zh: '', en: '' };
      add((ln.zh ? ln.zh + '：' : '') + its(n, 'zh'), (ln.en ? ln.en + ': ' : '') + its(n, 'en'));
    });
  } else if (key === 'pmcs_kb') {
    const n = B.nodes.find(x => x.role === 'kb');
    if (n) { const z = T(n, 'zh').items, e = T(n, 'en').items; const idx = z.map((s, i) => /^\S+\.md/.test(s) ? i : -1).filter(i => i >= 0); (idx.length ? idx : z.map((_, i) => i)).forEach(i => add(z[i] || '', e[i] || '')); }
  } else if (key === 'pmcs_sources') {
    const n = A.nodes.find(x => x.role === 'source');
    if (n) { const semi = n.variant === 'semi'; add('模式：' + (semi ? '半自動（組員貼入 JD）' : '自動（程式抓取）'), 'Mode: ' + (semi ? 'semi-automatic (members paste JDs)' : 'automatic (programmatic fetching)'));
      const z = T(n, 'zh').items, e = T(n, 'en').items; z.forEach((s, i) => add(s, e[i] || '')); }
  } else if (key === 'cdps_sources') {
    const n = A.nodes.find(x => x.role === 'source');
    if (n) { const semi = n.variant === 'semi'; add('模式：' + (semi ? '半自動（組員整理分店清單）' : '自動（開放資料＋地理編碼）'), 'Mode: ' + (semi ? 'semi-automatic (members compile store lists)' : 'automatic (open data + geocoding)'));
      const z = T(n, 'zh').items, e = T(n, 'en').items; z.forEach((s, i) => add(s, e[i] || '')); }
  } else if (key === 'cdps_tech') {
    if (tB.stack) add(tB.stack.zh, tB.stack.en);
    (tB.phases || []).filter(ph => !ph.skipTech).forEach(ph => {
      const ns = B.nodes.filter(n => !inBand(tB, n) && ph.cols.includes(colOfN(tB, n))).sort(byY).sort((a, b) => colOfN(tB, a) - colOfN(tB, b));
      if (!ns.length) return;
      const lz = ph.label.zh.split('｜')[0], le = ph.label.en.split(' | ')[0];
      add(`${lz}：${ns.map(n => T(n, 'zh').title).join('、')}`, `${le}: ${ns.map(n => T(n, 'en').title).join(', ')}`);
    });
  } else if (key === 'pmcs_ksa') {
    const lane0 = Math.min(0, ...A.nodes.filter(n => ['k', 's', 'a', 'ai'].includes(n.role)).map(n => n.lane));
    ['k', 's', 'a', 'ai'].forEach(r => {
      const role = roleOf(tA, r);
      A.nodes.filter(n => n.role === r && (n.lane === lane0 || n.lane === 0)).slice(0, 1).forEach(n => add(`${role.badge} ${T(n, 'zh').title}：${its(n, 'zh')}`, `${role.badge} ${T(n, 'en').title}: ${its(n, 'en')}`));
    });
    const g = (tA.groups || [])[0]; if (g && g.note) add(g.note.zh, g.note.en);
  } else if (key === 'pmcs_team' || key === 'team' || key === 'team_collab') {
    (tB.owners || []).forEach(o => {
      const ns = B.nodes.filter(n => n.owner === o.id);
      const nm = (people && people[o.id]) || '＿＿';
      add(`${o.zh}（${nm}）：${ns.map(n => T(n, 'zh').title).join('、')}`, `${o.en} (${nm}): ${ns.map(n => T(n, 'en').title).join(', ')}`);
    });
    if (key === 'team_collab') { const cb = ((people && people.__collab) || '').trim() || '＿＿'; add('協作方式：' + cb, 'How we work together: ' + cb); }
  } else if (key === 'a_hyp') {
    mains(tA).forEach(({ code, e }) => add(`${code}：${e.text.zh || e.text.en}`, `${code}: ${e.text.en || e.text.zh}`));

      const g = (n, L) => f(n, L).replace(/^（(.*)）$/, '$1').replace(/^ \((.*)\)$/, '$1');
      add(`${r.zh}：${ns.map(n => g(n, 'zh')).join('；')}`, `${r.en}: ${ns.map(n => g(n, 'en')).join('; ')}`);
    });

    mains(tA).forEach(({ code, e }) => add(`${code}：${e.text.zh || e.text.en}`, `${code}: ${e.text.en || e.text.zh}`));
  } else if (key === 'b_timeline') {
    [...B.nodes].filter(n => n.tag).sort(byY).forEach(n => add(`${n.tag}｜${T(n, 'zh').title}`, `${n.tag} | ${T(n, 'en').title}`));
  }
  return out;
}

/* Current content of a card: live (auto), edited, or template default */
function cardState(dC, id) { return (dC.cards && dC.cards[id]) || {}; }
function cardContent(tplId, card, dC, ds) {
  const st = cardState(dC, card.id);
  if (card.auto && !st.manual) return { lines: autoC(card.auto, tplId, ds, st.people), mode: 'auto' };
  if (st.text) return { lines: { zh: st.text.zh || [], en: st.text.en || [] }, mode: card.auto ? 'manual' : 'edited' };
  const def = (card.defBy && card.defBy[st.choice || card.choiceDef]) || card.def || { zh: [], en: [] };
  return { lines: { zh: def.zh || [], en: def.en || def.zh || [] }, mode: 'default' };
}
const PLACEHOLDER_RE = /__|＿＿|^（.*）$|^\(.*\)$/;
function cardFilled(card, content, st, tplId) {
  const z = content.lines.zh.map(s => String(s).trim()).filter(Boolean);
  if (!z.length) return false;
  if (z.some(s => PLACEHOLDER_RE.test(s))) return false;
  if (card.people) { const owners = ((TEMPLATES_B[tplId] || TEMPLATES_B.tp_pmcs).owners || []); if (owners.some(o => !((st.people || {})[o.id] || '').trim())) return false; }
  return true;
}

function layoutC(dC, tplId, mode, ds) {
  const tc = TEMPLATES_C[tplId];
  const W = PAGE.W, P = PAGE.PAD, G2 = PAGE.GAP;
  const prim = mode === 'en' ? 'en' : 'zh';
  const pick = (bi) => (bi ? (mode === 'en' ? (bi.en || bi.zh) : (bi.zh || bi.en)) : '');
  // header
  const head = { lines: [] }; let y = 44;
  head.page = pick(tc.pageTitle); head.pageEn = mode === 'both' ? tc.pageTitle.en : '';
  y += 22;
  wrapText(pick(dC.title), W - 2 * P, 26).forEach(t => { y += 34; head.lines.push({ t, y, fs: 26, fw: 700, serif: true, fill: '#004030' }); });
  if (mode === 'both' && dC.title.en) wrapText(dC.title.en, W - 2 * P, 15).forEach(t => { y += 21; head.lines.push({ t, y, fs: 15, fi: 'italic', fill: '#475569' }); });
  y += 24; head.lines.push({ t: mode === 'both' ? [dC.subtitle.zh, dC.subtitle.en].filter(Boolean).join('  ·  ') : pick(dC.subtitle), y, fs: 13.5, fill: '#64748b' });
  y += 16; head.rule = y; y += 24;
  // cards
  const cw2 = (W - 2 * P - G2) / 2;
  const box = (card, idx, w) => {
    const st = cardState(dC, card.id); const content = cardContent(tplId, card, dC, ds);
    const inner = w - 36 - 18; const L = [];
    let yy = 18;
    const tLines = wrapText(pick(card.title), inner - 4, 17.5);
    tLines.forEach(t => { yy += 23; L.push({ t, x: 54, y: yy, fs: 17.5, fw: 700, fill: '#0f172a' }); });
    if (mode === 'both') wrapText(card.title.en, inner, 11.5).forEach(t => { yy += 15; L.push({ t, x: 54, y: yy, fs: 11.5, fi: 'italic', fill: '#475569' }); });
    if (card.sub) wrapText(pick(card.sub), inner, 11.5).forEach(t => { yy += 16; L.push({ t, x: 54, y: yy, fs: 11.5, fill: '#64748b' }); });
    yy += 10;
    const checks = [];
    if (card.choice) {
      const cur = st.choice || card.choiceDef;
      card.choice.forEach(o => { yy += 24; checks.push({ y: yy, on: cur === o.id }); L.push({ t: mode === 'en' ? o.en : o.zh, x: 44, y: yy, fs: 14.5, fw: cur === o.id ? 700 : 400, fill: cur === o.id ? '#0f172a' : '#94a3b8' }); });
      yy += 6;
    }
    const bullets = [];
    const n = Math.max(content.lines.zh.length, mode === 'both' ? content.lines.en.length : 0);
    for (let i = 0; i < n; i++) {
      const a = String((mode === 'en' ? (content.lines.en[i] || content.lines.zh[i]) : content.lines.zh[i]) || '').trim();
      const b = String(content.lines.en[i] || '').trim();
      if (!a && !(mode === 'both' && b)) continue;
      bullets.push(yy + (a ? 21.5 : 17));
      if (a) wrapText(a, w - 44 - 22, 14.5).forEach(t => { yy += 21.5; L.push({ t, x: 44, y: yy, fs: 14.5, fill: '#1f2937' }); });
      if (mode === 'both' && b && b !== a) wrapText(b, w - 44 - 22, 12).forEach(t => { yy += 17; L.push({ t, x: 44, y: yy, fs: 12, fi: 'italic', fill: '#64748b' }); });
      yy += 5;
    }
    const empty = !bullets.length;
    if (empty) yy += 26;
    yy += 16;
    const chars = content.lines.zh.join('').replace(/\s/g, '').length;
    return { card, idx, w, h: Math.max(yy, 110), lines: L, bullets, checks, empty, mode: content.mode, filled: cardFilled(card, content, st, tplId), chars, content };
  };
  const cards = []; let i = 0;
  while (i < tc.cards.length) {
    const single = i === tc.cards.length - 1;
    const row = single ? [box(tc.cards[i], i, W - 2 * P)] : [box(tc.cards[i], i, cw2), box(tc.cards[i + 1], i + 1, cw2)];
    const h = Math.max(...row.map(c => c.h));
    row.forEach((c, k) => { c.x = P + k * (cw2 + G2); c.y = y; c.h = h; cards.push(c); });
    y += h + G2; i += row.length;
  }
  const bottom = y - G2 + 50;
  return { W, H: Math.max(PAGE.H, Math.ceil(bottom)), over: bottom > PAGE.H, head, cards, done: cards.filter(c => c.filled).length, total: cards.length };
}

function sanitizeC(d, tplId) {
  const tc = TEMPLATES_C[tplId]; d = d || {};
  const cards = {};
  const src = d.cards && typeof d.cards === 'object' ? d.cards : {};
  tc.cards.forEach(c => {
    const s = src[c.id]; if (!s || typeof s !== 'object') return;
    const o = {};
    if (s.manual) o.manual = true;
    if (s.text) o.text = { zh: (Array.isArray(s.text.zh) ? s.text.zh : []).slice(0, 20).map(x => cleanStr(x, 400)), en: (Array.isArray(s.text.en) ? s.text.en : []).slice(0, 20).map(x => cleanStr(x, 400)) };
    if (c.choice && c.choice.some(x => x.id === s.choice)) o.choice = s.choice;
    if (c.people && s.people && typeof s.people === 'object') { o.people = {}; (TEMPLATES_B[tplId].owners || []).forEach(ow => { if (s.people[ow.id]) o.people[ow.id] = cleanStr(s.people[ow.id], 40); }); if (c.collab && s.people.__collab) o.people.__collab = cleanStr(s.people.__collab, 200); }
    cards[c.id] = o;
  });
  return { title: cleanBi(d.title || tc.title, 200), subtitle: cleanBi(d.subtitle || tc.subtitle, 200), cards };
}

const IconMenu = (p) => <Ico {...p} d={<><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></>} />;

const IconMoon = (p) => <Ico {...p} d={<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />} />;
const IconSun = (p) => <Ico {...p} d={<><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></>} />;

/* ---------------- TTS ---------------- */
/* Remove symbols a speech engine would read aloud (arrows, slashes, badges). */
const ttsClean = (s, lang) => String(s || '')
  .replace(/\s*★\s*/g, lang === 'zh' ? '星號' : ' star ')
  .replace(/[①-⑨☆ⓘ🔊💾🗑▶]/g, '')
  .replace(/\s*(→|->|⇒)\s*/g, lang === 'zh' ? '，' : ', then ')
  .replace(/([A-Za-z])\/(?=[A-Za-z])/g, '$1 ')
  .replace(/\/(?=[\s，。、）)]|$)/g, '')
  .replace(/_{2,}/g, ' ')
  .replace(/\s*[／|｜]\s*/g, lang === 'zh' ? '、' : ', ')
  .replace(/\s*[·・]\s*/g, lang === 'zh' ? '，' : ', ')
  .replace(/\s+/g, ' ').trim();
/* Join sentences without doubling end punctuation. */
const joinSay = (arr, lang) => arr.filter(Boolean).map(s => String(s).trim()).filter(Boolean)
  .map(s => /[。．.!?！？；;:：]$/.test(s) ? s : s + (lang === 'zh' ? '。' : '.')).join(' ');
const speak = (text, lang, onEnd) => {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(ttsClean(text, lang));
  u.rate = 0.95;
  const voices = speechSynthesis.getVoices();
  if (lang === 'zh') {
    const v = voices.find(v => v.lang === 'zh-TW' && v.name.includes('Yating')) || voices.find(v => v.lang === 'zh-TW') || voices.find(v => v.lang.startsWith('zh'));
    if (v) u.voice = v; u.lang = 'zh-TW';
  } else {
    const v = voices.find(v => v.lang === 'en-GB' && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang.startsWith('en'));
    if (v) u.voice = v; u.lang = 'en-GB';
  }
  if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
  speechSynthesis.speak(u);
};

/* ---------------- Diagram (SVG) ---------------- */
/* Outline path of a node by shape (step | decision | doc | terminal) */
const shapePath = (shape, w, h) => {
  if (shape === 'decision') { const k = 16; return `M0,${h / 2} L${k},0 L${w - k},0 L${w},${h / 2} L${w - k},${h} L${k},${h} Z`; }
  if (shape === 'doc') { const r = 10, b = h - 8; return `M${r},0 L${w - r},0 Q${w},0 ${w},${r} L${w},${b} C${w * 0.75},${b - 10} ${w * 0.62},${h + 6} ${w / 2},${b} C${w * 0.38},${b - 10} ${w * 0.25},${h + 6} 0,${b} L0,${r} Q0,0 ${r},0 Z`; }
  const r = shape === 'terminal' ? Math.min(h / 2, 26) : 10;
  return `M${r},0 L${w - r},0 Q${w},0 ${w},${r} L${w},${h - r} Q${w},${h} ${w - r},${h} L${r},${h} Q0,${h} 0,${h - r} L0,${r} Q0,0 ${r},0 Z`;
};
const LOOP_COLOR = '#B45309';

const Diagram = ({ doc, dia, tpl, mode, selected, onSelect, onDragNode, onDragEnd, connect, onConnectPick, zoom, svgRef, onInfo }) => {
  const d = dia;
  const geo = useMemo(() => computeGeometry(d, tpl, mode), [d, tpl, mode]);
  const legend = useMemo(() => legendLines(d, tpl, mode, geo.codes, geo.W), [d, tpl, mode, geo]);
  const drag = useRef(null);

  const toSvg = (evt) => {
    const svg = svgRef.current; const pt = svg.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  useEffect(() => {
    const move = (e) => {
      const s = drag.current; if (!s) return;
      const p = toSvg(e);
      const nx = Math.round((s.ox + p.x - s.sx) / 2) * 2, ny = Math.round((s.oy + p.y - s.sy) / 2) * 2;
      if (!s.moved && Math.abs(p.x - s.sx) + Math.abs(p.y - s.sy) < 3) return;
      s.moved = true; onDragNode(s.id, nx, ny);
    };
    const up = () => { const s = drag.current; drag.current = null; if (s && s.moved) onDragEnd(s.snapshot); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
    return () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  });

  const nodeDown = (e, n) => {
    e.stopPropagation();
    if (connect) { onConnectPick('n:' + n.id); return; }
    onSelect({ type: 'node', id: n.id });
    const p = toSvg(e);
    drag.current = { id: n.id, sx: p.x, sy: p.y, ox: n.x, oy: n.y, moved: false, snapshot: JSON.stringify(doc) };
  };

  const disp = (bi) => { if (!bi) return ''; return mode === 'en' ? (bi.en || bi.zh) : (bi.zh || bi.en); };
  // header
  const titleMain = disp(d.title);
  const legendTop = geo.contentBottom + 34;
  let ly = legendTop - 8;
  const legendRows = legend.map(row => { const y0 = ly; ly += row.head ? 26 : row.gap ? 10 : row.lines.length * (row.fs + 5) + 4; return { ...row, y0 }; });
  const H = Math.ceil(ly + 36);
  const W = geo.W;
  const selColor = '#D97706';

  return (
    <svg ref={svgRef} xmlns="http://www.w3.org/2000/svg" viewBox={`0 0 ${W} ${H}`} width={W * zoom} height={H * zoom}

      onPointerDown={() => { if (!connect) onSelect(null); }}
      data-w={W} data-h={H}>
      <defs>
        <marker id="arMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#004030" /></marker>
        <marker id="arFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" /></marker>
 <marker id="arLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={LOOP_COLOR} /></marker>
        <marker id="arSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill={selColor} /></marker>
      </defs>
      <rect x="0" y="0" width={W} height={H} fill="#ffffff" />
      {/* Title block */}
      <rect x="0" y="0" width={W} height="6" fill="#004030" />
      <text x="28" y="44" fontFamily={G.SERIF} fontSize="22" fontWeight="700" fill="#004030">{titleMain}</text>
      {mode === 'both' && d.title.en && <text x="28" y="66" fontSize="13.5" fontStyle="italic" fill="#475569">{d.title.en}</text>}
      <text x="28" y={mode === 'both' ? 88 : 68} fontSize="12.5" fill="#64748b">{mode === 'both' ? [d.subtitle.zh, d.subtitle.en].filter(Boolean).join('  ·  ') : disp(d.subtitle)}</text>
      <line x1="28" y1={mode === 'both' ? 100 : 82} x2={W - 28} y2={mode === 'both' ? 100 : 82} stroke="#D8C3A5" strokeWidth="1.5" />

      {/* Phase bands (B): I-P-O columns or thesis-chapter rows */}
      {geo.phases.map(p => p.w ? (
        <g key={'ph' + p.i}>

        <g key={'ph' + p.i}>

          <rect x="14" y={p.y} width={G.LANE_LABEL_W} height={p.h} rx="10" fill="#004030" opacity="0.9" />
          <text transform={`translate(${14 + G.LANE_LABEL_W / 2 + 5},${p.y + p.h / 2}) rotate(-90)`} textAnchor="middle" fontSize="11.5" fontWeight="700" fill="#ffffff">{disp(p.ph.label)}</text>
        </g>

      {geo.xband && (
        <g>
          <rect x={geo.xband.x} y={geo.xband.y} width={geo.xband.w} height={geo.xband.h} rx="12" fill="#F8FAFC" stroke="#475569" strokeWidth="1.2" strokeDasharray="7 4" />

      {/* Comparison-row bands */}
      {geo.bands.map((b, i) => (
        <g key={'band' + b.lane}>
          <rect x="14" y={b.y} width={W - 28} height={b.h} rx="10" fill={b.lane % 2 ? '#f8fafc' : '#f4f8f6'} stroke="#cbd5e1" strokeDasharray="4 4" />
          <rect x="14" y={b.y} width={G.LANE_LABEL_W} height={b.h} rx="10" fill="#004030" opacity="0.9" />
          <text transform={`translate(${14 + G.LANE_LABEL_W / 2 + 5},${b.y + b.h / 2}) rotate(-90)`} textAnchor="middle" fontSize="12" fontWeight="700" fill="#ffffff">{disp(b.ln.text)}</text>
        </g>
      ))}

      {/* Frames */}
      {geo.frames.map(f => (
        <g key={f.ref} onPointerDown={(e) => { if (connect) { e.stopPropagation(); onConnectPick(f.ref); } }} style={{ cursor: connect ? 'crosshair' : 'default' }}>
          <rect x={f.x} y={f.y} width={f.w} height={f.h} rx="12" fill={f.g.color ? '#ffffff' : '#FFFBF2'} fillOpacity={f.g.color ? 0.55 : 1} stroke={f.g.color || '#B45309'} strokeOpacity={f.g.color ? 0.55 : 1} strokeWidth="1.4" strokeDasharray="6 4" />
          <text x={f.x + 12} y={f.y + 20} fontSize="12.5" fontWeight="700" fill={f.g.color || '#92400E'}>{disp(f.g.label)}</text>
          {(() => { const ls = wrapText(disp(f.g.note), f.w - 24, 10.5).slice(0, 2); return ls.map((l, i) => <text key={i} x={f.x + 12} y={f.y + f.h - 10 - (ls.length - 1 - i) * 14} fontSize="10.5" fill={f.g.color || '#92400E'}>{l}</text>); })()}
          {connect && <rect className="no-export" x={f.x} y={f.y} width={f.w} height={f.h} rx="12" fill="none" stroke={selColor} strokeWidth="1" strokeDasharray="2 3" />}
        </g>
      ))}

      {/* Edges */}
      {d.edges.map(e => {
        const g = geo.edgeGeo[e.id]; if (!g) return null;
        const sel = selected && selected.type === 'edge' && selected.id === e.id;
        const src = d.nodes.find(n => 'n:' + n.id === e.from), dst = d.nodes.find(n => 'n:' + n.id === e.to);
        const dashed = (src && src.optional) || (dst && dst.optional);
        const main = e.kind === 'main';
        const loop = main && tpl.mainStyle === 'loop';
        return (
          <g key={e.id}>
            <path d={g.d} fill="none" stroke={sel ? selColor : loop ? LOOP_COLOR : main ? '#004030' : '#94a3b8'} strokeWidth={main ? 2 : 1.6}
              strokeDasharray={loop ? '7 5' : dashed ? '6 4' : undefined} markerEnd={`url(#${sel ? 'arSel' : loop ? 'arLoop' : main ? 'arMain' : 'arFlow'})`} />
            <path className="no-export" d={g.d} fill="none" stroke="transparent" strokeWidth="14" style={{ cursor: connect ? 'crosshair' : 'pointer' }}
              onPointerDown={(ev) => { ev.stopPropagation(); if (connect) onConnectPick('e:' + e.id); else onSelect({ type: 'edge', id: e.id }); }} />

            {b.lines.map((l, i) => <text key={i} x={l.x} y={l.y} fontSize={l.fs} fontWeight={l.fw} fontStyle={l.fi} fill={l.fill}>{l.t}</text>)}
            {b.bullets.map((y, i) => <circle key={'b' + i} cx={G.PADX + 3.5 + b.sx} cy={y - 4} r="2.2" fill={role.color} />)}
            {b.pillY !== null && (
              <g>
                <rect x={G.PADX + b.badgeIndent} y={b.pillY} width={mode === 'en' ? (n.variant === 'semi' ? 108 : 78) : 62} height="17" rx="8.5" fill={role.color} />

              if (b.owner) { const lb = mode === 'en' ? b.owner.en : b.owner.zh; const w = textW(lb, 10.5) + 14; out.push(<g key="ow"><rect x={x} y={b.tagY} width={w} height="17" rx="8.5" fill={b.owner.color} /><text x={x + 7} y={b.tagY + 12.3} fontSize="10.5" fontWeight="700" fill="#ffffff">{lb}</text></g>); x += w + 5; }
              if (n.tag) { const w = Math.min(b.w - x - G.PADX, String(n.tag).length * 6.4 + 14); out.push(<g key="tg"><rect x={x} y={b.tagY} width={w} height="17" rx="4" fill="#ffffff" stroke={role.color} strokeWidth="0.8" /><text x={x + 7} y={b.tagY + 12.3} fontSize="10.5" fontFamily="'JetBrains Mono', Menlo, Consolas, monospace" fill={role.color}>{n.tag}</text></g>); }
              if (n.xref) { const lb = '→ ' + n.xref; const w = textW(lb, 10.5) + 12; out.push(<g key="xr"><rect x={b.w - G.PADX - b.sx - w} y={b.tagY} width={w} height="17" rx="4" fill="#004030" /><text x={b.w - G.PADX - b.sx - w / 2} y={b.tagY + 12.3} textAnchor="middle" fontSize="10.5" fontWeight="700" fill="#D8C3A5">{lb}</text></g>); }
              return <g>{out}</g>;
            })()}
            {terms.length > 0 && (
              <g className="no-export" style={{ cursor: 'help' }}
                onPointerDown={(e) => { e.stopPropagation(); onInfo(n, terms, e.clientX, e.clientY, true); }}

          </g>

      {/* Edge labels (on top) */}
      {d.edges.map(e => {
        const g = geo.edgeGeo[e.id]; if (!g) return null;
        const sel = selected && selected.type === 'edge' && selected.id === e.id;
        let label = '';
        if (e.kind === 'main') label = geo.codes[e.id] + (tpl.signs && e.sign ? ` (${e.sign === '-' ? '−' : '+'})` : '');
        else label = disp(e.text);

        const w = textW(label, 11.5) + 16;
        return (
          <g key={'lb' + e.id} onPointerDown={(ev) => { ev.stopPropagation(); if (connect) onConnectPick('e:' + e.id); else onSelect({ type: 'edge', id: e.id }); }} style={{ cursor: 'pointer' }}>
            <rect x={g.label.x - w / 2} y={g.label.y - 10} width={w} height="20" rx="10" fill={e.kind === 'main' ? (sel ? selColor : tpl.mainStyle === 'loop' ? LOOP_COLOR : '#004030') : '#ffffff'} stroke={e.kind === 'main' ? 'none' : '#94a3b8'} />

      {/* Legend */}
      {legendRows.length > 0 && (
        <g>

          {legendRows.map((r, i) => r.head ? <text key={'lg' + i} x="28" y={r.y0 + 16} fontSize="13.5" fontWeight="700" fill="#004030">{r.head}</text> : (
            <g key={'lg' + i}>

              {r.lines.map((t, j) => <text key={j} x={30 + r.hw} y={r.y0 + r.fs + j * (r.fs + 5)} fontSize={r.fs} fontStyle={r.fi || 'normal'} fill={r.fill}>{t}</text>)}
            </g>
          ))}
        </g>
      )}
      <text x={W - 24} y={H - 14} textAnchor="end" fontSize="9.5" fill="#94a3b8">Proposal Diagram Studio · Prof. Shihmin Lo, NCNU IBS</text>
    </svg>
  );
