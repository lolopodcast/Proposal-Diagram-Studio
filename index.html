/* ---------------- Diagram C: one-page summary ---------------- */
const CPage = ({ doc, mode, selected, onSelect, zoom, svgRef, t }) => {
  const dC = doc.diagrams.C;
  const Lc = useMemo(() => layoutC(dC, doc.templateId, mode, doc.diagrams), [dC, doc.diagrams, doc.templateId, mode]);
  const { W, H } = Lc; const selColor = '#D97706';
  const src = (c) => c.mode === 'auto' ? t.c_auto_from.replace('{src}', c.card.src) : c.mode === 'manual' ? t.c_manual : null;
  return (
    <svg ref={svgRef} xmlns="http://www.w3.org/2000/svg" viewBox={`0 0 ${W} ${H}`} width={W * zoom} height={H * zoom}
      style={{ display: 'block', fontFamily: G.FONT, userSelect: 'none' }} onPointerDown={() => onSelect(null)} data-w={W} data-h={H}>
      <rect x="0" y="0" width={W} height={H} fill="#ffffff" />
      <rect x="0" y="0" width={W} height="8" fill="#004030" />
      <text x={PAGE.PAD} y="46" fontSize="13" fontWeight="700" letterSpacing="1" fill="#92400E">{Lc.head.page}{Lc.head.pageEn ? `  ·  ${Lc.head.pageEn}` : ''}</text>
      {Lc.head.lines.map((l, i) => <text key={i} x={PAGE.PAD} y={l.y} fontSize={l.fs} fontWeight={l.fw || 400} fontStyle={l.fi || 'normal'} fontFamily={l.serif ? G.SERIF : undefined} fill={l.fill}>{l.t}</text>)}
      <line x1={PAGE.PAD} y1={Lc.head.rule} x2={W - PAGE.PAD} y2={Lc.head.rule} stroke="#D8C3A5" strokeWidth="2" />
      <g className="no-export"><rect x={W - PAGE.PAD - 118} y="24" width="118" height="28" rx="14" fill={Lc.done === Lc.total ? '#004030' : '#FEF3E2'} stroke={Lc.done === Lc.total ? 'none' : '#B45309'} />
        <text x={W - PAGE.PAD - 59} y="43" textAnchor="middle" fontSize="13" fontWeight="700" fill={Lc.done === Lc.total ? '#ffffff' : '#92400E'}>{t.c_progress.replace('{n}', Lc.done).replace('{m}', Lc.total)}</text></g>
      {Lc.cards.map(c => {
        const sel = selected && selected.type === 'card' && selected.id === c.card.id; const lb = src(c);
        return (
          <g key={c.card.id} transform={`translate(${c.x},${c.y})`} style={{ cursor: 'pointer' }} onPointerDown={(e) => { e.stopPropagation(); onSelect({ type: 'card', id: c.card.id }); }}>
            <rect x="0" y="0" width={c.w} height={c.h} rx="12" fill="#ffffff" stroke="#cbd5e1" strokeWidth="1.3" />
            <rect x="0" y="0" width={c.w} height="5" rx="2" fill="#004030" />
            <circle cx="30" cy="34" r="14" fill="#004030" /><text x="30" y="39" textAnchor="middle" fontSize="14" fontWeight="700" fill="#D8C3A5">{c.idx + 1}</text>
            {c.lines.map((l, i) => <text key={i} x={l.x} y={l.y} fontSize={l.fs} fontWeight={l.fw || 400} fontStyle={l.fi || 'normal'} fill={l.fill}>{l.t}</text>)}
            {c.bullets.map((y, i) => <circle key={'b' + i} cx="32" cy={y - 4.5} r="2.6" fill="#004030" />)}
            {c.checks.map((k, i) => <g key={'k' + i}><rect x="22" y={k.y - 12} width="14" height="14" rx="3" fill={k.on ? '#004030' : '#ffffff'} stroke={k.on ? '#004030' : '#94a3b8'} strokeWidth="1.4" />{k.on && <path d={`M25,${k.y - 5} l3.5,3.5 l6,-7`} fill="none" stroke="#ffffff" strokeWidth="2" />}</g>)}
            {c.empty && <text className="no-export" x="44" y={c.h - 30} fontSize="12.5" fontStyle="italic" fill="#94a3b8">{c.card.hint ? (mode === 'en' ? c.card.hint.en : c.card.hint.zh) : t.c_empty}</text>}
            <g className="no-export">
              {lb && (() => { const w = textW(lb, 10.5) + 16; return <g><rect x={c.w - 44 - w} y="16" width={w} height="19" rx="9.5" fill={c.mode === 'auto' ? '#E6F0EC' : '#FEF3E2'} stroke={c.mode === 'auto' ? '#004030' : '#B45309'} strokeWidth="0.8" /><text x={c.w - 44 - w / 2} y="29.5" textAnchor="middle" fontSize="10.5" fontWeight="700" fill={c.mode === 'auto' ? '#004030' : '#92400E'}>{lb}</text></g>; })()}
              <circle cx={c.w - 24} cy="25" r="10" fill={c.filled ? '#004030' : '#ffffff'} stroke={c.filled ? '#004030' : '#B45309'} strokeWidth="1.5" />
              {c.filled ? <path d={`M${c.w - 29},25 l3.5,3.5 l6.5,-7`} fill="none" stroke="#ffffff" strokeWidth="2" /> : null}
            </g>
            {sel && <rect className="no-export" x="-5" y="-5" width={c.w + 10} height={c.h + 10} rx="15" fill="none" stroke={selColor} strokeWidth="2.5" strokeDasharray="7 4" />}
          </g>
        );
      })}
      {Lc.over && <g className="no-export"><line x1="0" y1={PAGE.H} x2={W} y2={PAGE.H} stroke="#DC2626" strokeWidth="1.5" strokeDasharray="8 5" /><text x={W - PAGE.PAD} y={PAGE.H - 8} textAnchor="end" fontSize="12" fontWeight="700" fill="#DC2626">{t.c_page_end}</text></g>}
      <text x={W - 24} y={H - 16} textAnchor="end" fontSize="9.5" fill="#94a3b8">Proposal Diagram Studio · Prof. Shihmin Lo, NCNU IBS</text>
    </svg>
  );
};

/* ---------------- Small UI helpers ---------------- */
const Btn = ({ children, onClick, active, danger, disabled, title, className = '' }) => (
  <button type="button" title={title} disabled={disabled} onClick={onClick}
    className={`px-2.5 py-1.5 rounded-lg text-xs sm:text-sm font-medium border transition-colors disabled:opacity-40 whitespace-nowrap
      ${danger ? 'border-red-400 text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-900/30'
        : active ? 'bg-[#004030] text-white border-[#004030] dark:bg-[#D8C3A5] dark:text-[#004030] dark:border-[#D8C3A5]'
          : 'border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700'} ${className}`}>{children}</button>
);
const Field = ({ label, children }) => (
  <label className="block mb-3"><span className="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">{label}</span>{children}</label>
);
const inputCls = 'w-full px-2.5 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-[#004030] dark:focus:ring-[#D8C3A5]';
const H3 = ({ children }) => <h3 className="font-serif font-bold text-[#004030] dark:text-[#D8C3A5] mb-3 text-base">{children}</h3>;

/* ---------------- Side panel: Diagram C cards ---------------- */
const CardPanel = ({ t, lang, doc, selected, api, mode }) => {
  const L = lang; const tc = TEMPLATES_C[doc.templateId]; const dC = doc.diagrams.C;
  const Lc = layoutC(dC, doc.templateId, mode, doc.diagrams);
  const cid = selected && selected.type === 'card' ? selected.id : null;
  const c = cid ? Lc.cards.find(x => x.card.id === cid) : null;
  if (!c) return (
    <div className="animate-fade-in">
      <p className="text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">{t.c_none_selected}</p>
      <H3>{t.panel_diagram}</H3>
      <Field label={t.c_f_title_zh}><input className={inputCls} value={dC.title.zh} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...dC.title, zh: e.target.value.slice(0, 200) } })} /></Field>
      <Field label={t.c_f_title_en}><input className={inputCls} value={dC.title.en} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...dC.title, en: e.target.value.slice(0, 200) } })} /></Field>
      <Field label={t.f_subtitle_zh}><input className={inputCls} value={dC.subtitle.zh} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...dC.subtitle, zh: e.target.value.slice(0, 200) } })} /></Field>
      <Field label={t.f_subtitle_en}><input className={inputCls} value={dC.subtitle.en} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...dC.subtitle, en: e.target.value.slice(0, 200) } })} /></Field>
      <H3>{t.c_progress.replace('{n}', Lc.done).replace('{m}', Lc.total)}</H3>
      {Lc.over && <p className="text-sm text-red-600 dark:text-red-400 mb-3">{t.c_over}</p>}
      <ul className="space-y-1.5">
        {Lc.cards.map(x => (
          <li key={x.card.id}><button onClick={() => api.selectCard(x.card.id)} className="w-full flex items-center gap-2 text-left px-2 py-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
            <span className={`w-5 h-5 shrink-0 rounded-full flex items-center justify-center text-xs font-bold ${x.filled ? 'bg-[#004030] text-white' : 'border-2 border-[#B45309] text-[#B45309]'}`}>{x.filled ? '✓' : ''}</span>
            <span className="text-sm">{x.idx + 1}. {x.card.title[L]}</span></button></li>
        ))}
      </ul>
    </div>
  );
  const st = cardState(dC, c.card.id);
  const lines = c.content.lines;
  const setLines = (lng, v) => api.setCard(c.card.id, { ...(c.card.auto ? { manual: true } : {}), text: { zh: lines.zh, en: lines.en, [lng]: v.split('\n').slice(0, 20) } });
  const owners = c.card.people ? (TEMPLATES_B[doc.templateId].owners || []) : [];
  return (
    <div className="animate-fade-in">
      <H3>{c.idx + 1}. {c.card.title[L]}</H3>
      {c.card.sub && <p className="text-xs text-slate-500 dark:text-slate-400 -mt-2 mb-3">{c.card.sub[L]}</p>}
      <div className="mb-4 p-3 rounded-lg bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700 text-sm leading-relaxed">
        {c.mode === 'auto' && <p>{t.c_auto_note.split('{src}').join(c.card.src)}</p>}
        {c.mode === 'manual' && <><p className="mb-2">{t.c_manual_note.split('{src}').join(c.card.src)}</p><Btn onClick={() => api.resetCard(c.card.id)}>{t.c_refill}</Btn></>}
        {c.mode === 'edited' && <Btn onClick={() => api.resetCard(c.card.id)}>{t.c_restore}</Btn>}
        {c.mode === 'default' && <p>{c.card.hint ? c.card.hint[L] : t.c_default_note}</p>}
      </div>
      {c.card.choice && (
        <Field label={t.c_choice}>
          <div className="flex flex-col gap-2">{c.card.choice.map(o => <label key={o.id} className="flex items-center gap-2 cursor-pointer"><input type="radio" name="cchoice" checked={(st.choice || c.card.choiceDef) === o.id} onChange={() => api.setCard(c.card.id, { choice: o.id }, true)} /> <span>{o[L]}</span></label>)}</div>
        </Field>
      )}
      {owners.length > 0 && (
        <Field label={t.c_people}>
          <div className="space-y-2">{owners.map(o => (
            <div key={o.id} className="flex items-center gap-2"><span className="w-28 shrink-0 text-xs font-bold" style={{ color: o.color }}>{o[L]}</span>
              <input className={inputCls} value={(st.people || {})[o.id] || ''} placeholder={t.c_people_ph} onFocus={api.snap} onChange={e => api.setCard(c.card.id, { people: { ...(st.people || {}), [o.id]: e.target.value.slice(0, 40) } })} /></div>))}</div>
        </Field>
      )}
      {c.card.collab && (
        <Field label={t.c_collab}>
          <textarea rows={3} className={inputCls} value={(st.people || {}).__collab || ''} placeholder={t.c_collab_ph} onFocus={api.snap} onChange={e => api.setCard(c.card.id, { people: { ...(st.people || {}), __collab: e.target.value.replace(/\n/g, ' ').slice(0, 200) } })} />
        </Field>
      )}
      <Field label={t.f_items_zh}><textarea rows={7} className={inputCls} value={lines.zh.join('\n')} onFocus={api.snap} onChange={e => setLines('zh', e.target.value)} /></Field>
      <p className={`text-xs -mt-2 mb-3 ${c.card.limit && c.chars > c.card.limit ? 'text-red-600 dark:text-red-400 font-bold' : 'text-slate-400'}`}>{t.c_chars.replace('{n}', c.chars).replace('{m}', c.card.limit || '—')}</p>
      <Field label={t.f_items_en}><textarea rows={7} className={inputCls} value={lines.en.join('\n')} onFocus={api.snap} onChange={e => setLines('en', e.target.value)} /></Field>
      {!c.filled && <p className="text-xs text-amber-700 dark:text-amber-300">{t.c_unfilled}</p>}
    </div>
  );
};

/* ---------------- Side panel ---------------- */
const Panel = ({ t, lang, tab, setTab, doc, dia, tpl, selected, api, mode }) => {
  const d = dia;
  const node = selected && selected.type === 'node' ? d.nodes.find(n => n.id === selected.id) : null;
  const edge = selected && selected.type === 'edge' ? d.edges.find(e => e.id === selected.id) : null;
  const L = lang;
  const firstRole = () => tpl.roles ? (tpl.defaultRole || tpl.roles[0].id) : '';
  const [addRole, setAddRole] = useState(firstRole);
  const [addLane, setAddLane] = useState(0);
  useEffect(() => { setAddRole(firstRole()); setAddLane(0); }, [tpl]);
  const isC = doc.view === 'C';
  const refName = (ref) => {
    if (ref.startsWith('n:')) { const n = d.nodes.find(x => 'n:' + x.id === ref); return n ? getText(n)[L === 'en' ? 'en' : 'zh'].title || n.id : '?'; }
    if (ref.startsWith('g:')) { const [, gid, l] = ref.split(':'); const g = tpl.groups.find(x => x.id === gid); return g ? g.label[L].split(' · ')[0] + (laneOn(tpl) ? ` [${String.fromCharCode(65 + +l)}]` : '') : '?'; }
    if (ref.startsWith('e:')) { const geo = computeGeometry(d, tpl, mode); return geo.codes[ref.slice(2)] || 'link'; }
    return ref;
  };
  const tabs = [['edit', t.tab_edit], ['add', t.tab_add], ['terms', t.tab_terms], ['help', t.tab_help]];

  return (
    <div className="flex flex-col h-full min-h-0">
      <div className="flex border-b border-slate-200 dark:border-slate-700 shrink-0" role="tablist">
        {tabs.map(([k, lbl]) => (
          <button key={k} role="tab" aria-selected={tab === k} onClick={() => setTab(k)}
            className={`flex-1 py-2.5 text-sm font-semibold border-b-2 ${tab === k ? 'border-[#004030] text-[#004030] dark:border-[#D8C3A5] dark:text-[#D8C3A5]' : 'border-transparent text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>{lbl}</button>
        ))}
      </div>
      <div className="p-4 overflow-y-auto flex-1 min-h-0 text-sm">
        {tab === 'edit' && isC && <CardPanel t={t} lang={lang} doc={doc} selected={selected} api={api} mode={mode} />}
        {tab === 'edit' && !isC && !node && !edge && (
          <div className="animate-fade-in">
            <p className="text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">{t.none_selected}</p>
            <H3>{t.panel_diagram}</H3>
            <Field label={t.f_title_zh}><input className={inputCls} value={d.title.zh} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...d.title, zh: e.target.value.slice(0, 160) } })} /></Field>
            <Field label={t.f_title_en}><input className={inputCls} value={d.title.en} onFocus={api.snap} onChange={e => api.setDiagram({ title: { ...d.title, en: e.target.value.slice(0, 160) } })} /></Field>
            <Field label={t.f_subtitle_zh}><input className={inputCls} value={d.subtitle.zh} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...d.subtitle, zh: e.target.value.slice(0, 160) } })} /></Field>
            <Field label={t.f_subtitle_en}><input className={inputCls} value={d.subtitle.en} onFocus={api.snap} onChange={e => api.setDiagram({ subtitle: { ...d.subtitle, en: e.target.value.slice(0, 160) } })} /></Field>
            <p className="text-xs text-slate-400 mt-4">{t.stats.replace('{n}', d.nodes.length).replace('{m}', d.edges.length)}</p>
            <p className="text-xs text-slate-400 mt-1">{t.kbd_hint}</p>
          </div>
        )}

        {tab === 'edit' && node && (() => {
          const txt = getText(node); const role = roleOf(tpl, node.role);
          const setTxt = (lng, field, val) => api.updateNodeText(node.id, lng, field, val);
          return (
            <div className="animate-fade-in">
              <H3>{t.panel_node}</H3>
              <Field label={t.f_role}>
                <select className={inputCls} value={node.role} onChange={e => api.setNodeRole(node.id, e.target.value)}>
                  {tpl.roles.map(r => <option key={r.id} value={r.id}>{r[L]}</option>)}
                </select>
              </Field>
              {laneOn(tpl) && (
                <Field label={t.f_lane}>
                  {role.perLane
                    ? <select className={inputCls} value={node.lane} onChange={e => api.patchNode(node.id, { lane: +e.target.value })}>
                      {d.lanes.map((ln, i) => <option key={i} value={i}>{ln.text[L] || ln.text.zh}</option>)}
                    </select>
                    : <div className="text-slate-500 text-sm py-1">{t.lane_shared}</div>}
                </Field>
              )}
              {rowPhases(tpl) && !inBand(tpl, node) && (
                <Field label={t.f_chapter}>
                  <select className={inputCls} value={rowOfN(tpl, node)} onChange={e => api.patchNode(node.id, { row: +e.target.value }, true)}>
                    {tpl.phases.map((ph, i) => <option key={i} value={ph.rows[0]}>{ph.label[L]}</option>)}
                  </select>
                </Field>
              )}
              {tpl.owners && (
                <Field label={t.f_owner}>
                  <select className={inputCls} value={node.owner || ''} onChange={e => api.patchNode(node.id, { owner: e.target.value || undefined }, true)}>
                    <option value="">{t.owner_none}</option>
                    {tpl.owners.map(o => <option key={o.id} value={o.id}>{o[L]}</option>)}
                  </select>
                </Field>
              )}
              {node.variants && (
                <Field label={t.f_variant}>
                  <div className="flex gap-2">
                    <Btn active={node.variant !== 'semi'} onClick={() => api.patchNode(node.id, { variant: 'auto' }, true)}>{t.variant_auto}</Btn>
                    <Btn active={node.variant === 'semi'} onClick={() => api.patchNode(node.id, { variant: 'semi' }, true)}>{t.variant_semi}</Btn>
                  </div>
                  <p className="text-xs text-slate-400 mt-1.5 leading-relaxed">{t.variant_note}</p>
                </Field>
              )}
              <Field label={t.f_node_title_zh}><input id="fld-title-zh" className={inputCls} value={txt.zh.title} onFocus={api.snap} onChange={e => setTxt('zh', 'title', e.target.value.slice(0, 200))} /></Field>
              <Field label={t.f_node_title_en}><input className={inputCls} value={txt.en.title} onFocus={api.snap} onChange={e => setTxt('en', 'title', e.target.value.slice(0, 200))} /></Field>
              <Field label={t.f_items_zh}><textarea rows={5} className={inputCls} value={txt.zh.items.join('\n')} onFocus={api.snap} onChange={e => setTxt('zh', 'items', e.target.value.split('\n').slice(0, 15))} /></Field>
              <Field label={t.f_items_en}><textarea rows={5} className={inputCls} value={txt.en.items.join('\n')} onFocus={api.snap} onChange={e => setTxt('en', 'items', e.target.value.split('\n').slice(0, 15))} /></Field>
              <Field label={rowPhases(tpl) ? t.f_tag_time : t.f_tag}><input className={inputCls} value={node.tag || ''} onFocus={api.snap} onChange={e => api.patchNode(node.id, { tag: e.target.value.slice(0, 60) })} /></Field>
              {tpl.xref && <Field label={t.f_xref}><input className={inputCls} value={node.xref || ''} placeholder={t.f_xref_ph} onFocus={api.snap} onChange={e => api.patchNode(node.id, { xref: e.target.value.slice(0, 24) })} /></Field>}
              <label className="flex items-center gap-2 mb-4 cursor-pointer"><input type="checkbox" checked={!!node.optional} onChange={e => api.patchNode(node.id, { optional: e.target.checked }, true)} /> <span>{t.f_optional}</span></label>
              <div className="flex flex-wrap gap-2">
                <Btn onClick={() => api.dupNode(node.id)}>{t.btn_dup_node}</Btn>
                <Btn danger onClick={() => api.deleteSel()}>{t.btn_delete_node}</Btn>
              </div>
            </div>
          );
        })()}

        {tab === 'edit' && edge && (
          <div className="animate-fade-in">
            <H3>{t.panel_edge}</H3>
            <Field label={t.from_to}><div className="text-sm py-1">{refName(edge.from)} → {refName(edge.to)}</div></Field>
            <Field label={t.f_kind}>
              <div className="flex flex-wrap gap-2">
                <Btn active={edge.kind === 'main'} onClick={() => api.patchEdge(edge.id, { kind: 'main' }, true)}>{(tpl.mainStyle === 'loop' ? t.kind_loop : t.kind_main).replace('{prefix}', tpl.prefix)}</Btn>
                <Btn active={edge.kind === 'flow'} onClick={() => api.patchEdge(edge.id, { kind: 'flow' }, true)}>{t.kind_flow}</Btn>
              </div>
            </Field>
            {tpl.signs && edge.kind === 'main' && (
              <Field label={t.f_sign}>
                <div className="flex flex-wrap gap-2">
                  {[['+', t.sign_pos], ['-', t.sign_neg], ['', t.sign_none]].map(([v, l]) => <Btn key={v || 'n'} active={edge.sign === v} onClick={() => api.patchEdge(edge.id, { sign: v }, true)}>{l}</Btn>)}
                </div>
              </Field>
            )}
            <Field label={t.f_edge_zh}><textarea rows={3} className={inputCls} value={edge.text.zh} onFocus={api.snap} onChange={e => api.patchEdge(edge.id, { text: { ...edge.text, zh: e.target.value.slice(0, 400) } })} /></Field>
            <Field label={t.f_edge_en}><textarea rows={3} className={inputCls} value={edge.text.en} onFocus={api.snap} onChange={e => api.patchEdge(edge.id, { text: { ...edge.text, en: e.target.value.slice(0, 400) } })} /></Field>
            <p className="text-xs text-slate-400 mb-4">{tpl.mainStyle === 'loop' ? t.f_edge_hint_loop : t.f_edge_hint}</p>
            <div className="flex flex-wrap gap-2">
              {!edge.to.startsWith('e:') && <Btn onClick={() => api.reverseEdge(edge.id)}>{t.btn_reverse}</Btn>}
              {edge.kind === 'main' && <><Btn onClick={() => api.moveEdge(edge.id, -1)}>{t.btn_up}</Btn><Btn onClick={() => api.moveEdge(edge.id, 1)}>{t.btn_down}</Btn></>}
              <Btn danger onClick={() => api.deleteSel()}>{t.btn_delete_edge}</Btn>
            </div>
          </div>
        )}

        {tab === 'add' && isC && <p className="text-slate-500 dark:text-slate-400 leading-relaxed">{t.c_no_add}</p>}
        {tab === 'add' && !isC && (
          <div className="animate-fade-in">
            <H3>{t.panel_add_node}</H3>
            <Field label={t.f_role}>
              <select className={inputCls} value={addRole} onChange={e => setAddRole(e.target.value)}>
                {tpl.roles.map(r => <option key={r.id} value={r.id}>{r[L]}</option>)}
              </select>
            </Field>
            {laneOn(tpl) && roleOf(tpl, addRole).perLane && (
              <Field label={t.f_lane}>
                <select className={inputCls} value={addLane} onChange={e => setAddLane(+e.target.value)}>
                  {d.lanes.map((ln, i) => <option key={i} value={i}>{ln.text[L] || ln.text.zh}</option>)}
                </select>
              </Field>
            )}
            <Btn active onClick={() => api.addNode(addRole, Math.min(addLane, d.lanes.length - 1))}>{t.btn_add}</Btn>

            <div className="mt-6"><H3>{t.panel_add_edge}</H3>
              <p className="text-slate-500 dark:text-slate-400 mb-2">{t.add_edge_desc}</p>
              <Btn onClick={api.startConnect}>{t.btn_connect}</Btn>
            </div>

            {laneOn(tpl) && (
              <div className="mt-6">
                <H3>{t.panel_lanes}</H3>
                <p className="text-slate-500 dark:text-slate-400 mb-3 leading-relaxed">{t.lanes_desc}</p>
                {d.lanes.map((ln, i) => (
                  <div key={i} className="mb-3 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                    <div className="flex items-center justify-between mb-2"><span className="font-bold">{String.fromCharCode(65 + i)}</span>
                      {d.lanes.length > 1 && <Btn danger onClick={() => api.removeLane(i)}>{t.btn_remove_lane}</Btn>}</div>

const b64 = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function openVault(code) {
  if (!window.crypto || !crypto.subtle) throw new Error('nocrypto');
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PDS_VAULT.salt), iterations: PDS_VAULT.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PDS_VAULT.iv) }, key, b64(PDS_VAULT.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function applyVault(p) {
  const tq = TEMPLATES.rp_quant;
  tq.title = p.title; tq.subtitle = p.subtitle; tq.nodes = p.nodes; tq.edges = p.edges;
  Object.assign(tq.glossary, p.glossary);
  tq.roles.forEach(r => { if (p.roleTerms[r.id]) r.terms = p.roleTerms[r.id]; });
  tq.encrypted = false;
  if (p.C) { const tc = TEMPLATES_C.rp_quant; tc.title = p.C.title; tc.subtitle = p.C.subtitle; tc.cards.forEach(c => { if (p.C.cards[c.id]) c.def = p.C.cards[c.id]; }); tc.encrypted = false; }
  if (p.B) { const tb = TEMPLATES_B.rp_quant; tb.title = p.B.title; tb.subtitle = p.B.subtitle; tb.nodes = p.B.nodes; tb.edges = p.B.edges; tb.encrypted = false; }
}

const TOUR_TARGETS = ['template', 'view', 'mode', 'canvas', 'connect', 'panel', 'export'];

const Tour = ({ t, onClose }) => {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const steps = t.tour_steps;
  useEffect(() => {
    const el = document.querySelector(`[data-tour="${TOUR_TARGETS[i]}"]`);
    if (!el) { setRect(null); return; }
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    const measure = () => { const r = el.getBoundingClientRect(); setRect({ x: r.left, y: r.top, w: r.width, h: r.height }); };
    measure(); const id = setTimeout(measure, 250);
    window.addEventListener('resize', measure);
    return () => { clearTimeout(id); window.removeEventListener('resize', measure); };
  }, [i]);
  const finish = () => { try { localStorage.setItem(LS_TOUR, '1'); } catch (e) { } onClose(); };
  useEffect(() => { const h = e => { if (e.key === 'Escape') finish(); }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); });
  const vw = window.innerWidth, vh = window.innerHeight;
  const pad = 6;
  const r = rect ? { x: Math.max(4, rect.x - pad), y: Math.max(4, rect.y - pad), w: Math.min(rect.w + pad * 2, vw - 8), h: Math.min(rect.h + pad * 2, vh - 8) } : null;
  const cardW = Math.min(340, vw - 24);
  let cx = 12, cy = vh / 2 - 90;
  if (r) {
    cx = Math.min(Math.max(12, r.x), vw - cardW - 12);
    const below = r.y + r.h + 12, above = r.y - 12 - 200;
    if (below + 200 < vh) cy = below; else if (above > 8) cy = above; else { cy = Math.max(12, Math.min(vh - 220, r.y + 20)); cx = Math.max(12, Math.min(vw - cardW - 12, r.x + r.w / 2 - cardW / 2)); }
  }
  return (
    <div className="fixed inset-0 z-[150]" role="dialog" aria-modal="true" aria-label={t.tour_label}>
      {r ? <div className="absolute rounded-xl transition-all duration-300 pointer-events-none" style={{ left: r.x, top: r.y, width: r.w, height: r.h, boxShadow: '0 0 0 9999px rgba(0,0,0,0.6)', outline: '3px solid #D8C3A5' }} />
        : <div className="absolute inset-0 bg-black/60" />}
      <div className="absolute bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-5 animate-fade-in" style={{ left: cx, top: cy, width: cardW }}>
        <div className="flex items-center justify-between mb-2">
          <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{t.tour_label} · {i + 1} / {steps.length}</span>
          <button onClick={finish} className="text-xs text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">{t.tour_skip}</button>
        </div>
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1.5">{steps[i].t}</h3>
        <p className="text-sm leading-relaxed text-slate-600 dark:text-slate-300">{steps[i].d}</p>

          <div className="flex gap-1">{steps.map((_, k) => <span key={k} className={`h-1.5 rounded-full ${k === i ? 'w-5 bg-[#004030] dark:bg-[#D8C3A5]' : 'w-1.5 bg-slate-300 dark:bg-slate-600'}`} />)}</div>
          <div className="flex gap-2">
            {i > 0 && <Btn onClick={() => setI(i - 1)}>{t.tour_prev}</Btn>}
            {i < steps.length - 1 ? <Btn active onClick={() => setI(i + 1)}>{t.tour_next}</Btn> : <Btn active onClick={finish}>{t.tour_done}</Btn>}
          </div>
        </div>
      </div>
    </div>
  );
};

    },
    removeLane: (i) => {
      const d0 = curDia(); const name = d0.lanes[i].text[lang] || d0.lanes[i].text.zh;
      if (!window.confirm(t.confirm_remove_lane.replace('{name}', name))) return;
      const dead = new Set(d0.nodes.filter(n => isPerLane(tpl, n) && n.lane === i).map(n => 'n:' + n.id));
      const gDead = r => r.startsWith('g:') && +r.split(':')[2] === i;
      const shiftG = r => { if (!r.startsWith('g:')) return r; const p = r.split(':'); return +p[2] > i ? `g:${p[1]}:${+p[2] - 1}` : r; };
      let edges = d0.edges.filter(e => !dead.has(e.from) && !dead.has(e.to) && !gDead(e.from) && !gDead(e.to));
      const alive = new Set(edges.map(e => 'e:' + e.id)); edges = edges.filter(e => !e.to.startsWith('e:') || alive.has(e.to)).map(e => ({ ...e, from: shiftG(e.from), to: shiftG(e.to) }));
      const nodes = d0.nodes.filter(n => !dead.has('n:' + n.id)).map(n => isPerLane(tpl, n) && n.lane > i ? { ...n, lane: n.lane - 1 } : n);
      const lanes = d0.lanes.filter((_, k) => k !== i).map((l, k) => ({ ...l, id: 'L' + k }));
      const nd = { ...d0, lanes, nodes, edges }; nd.nodes = autoLayout(nd, tpl, mode);
      setD(() => nd, true); setSelected(null);
    }
  };

  const onConnectPick = (ref) => {
    if (!connect) return;
    if (!connect.from) {
      if (ref.startsWith('e:')) { showToast(t.connect_err_edge); return; }
      setConnect({ from: ref }); return;
    }
    if (ref === connect.from) { showToast(t.connect_err_self); return; }
    const e = { id: uid('e'), from: connect.from, to: ref, kind: tpl.defaultEdgeKind, sign: tpl.signs ? '+' : '', text: { zh: '', en: '' } };
    setD(d => ({ ...d, edges: [...d.edges, e] }), true);
    setConnect(null); setSelected({ type: 'edge', id: e.id }); setTab('edit');
  };

  const layout = () => { if (!isC) setD(d => ({ ...d, nodes: autoLayout(d, tpl, mode) }), true); };
  const changeMode = (k) => {
    if (k === mode) return;
    setMode(k);
    const cur = docRef.current; const ds = {};
    NODE_VIEWS.forEach(v => { const dd = cur.diagrams[v]; ds[v] = { ...dd, nodes: autoLayout(dd, tplOf(cur.templateId, v), k) }; });
    commit({ ...cur, diagrams: { ...cur.diagrams, ...ds } });
    showToast(t.toast_relayout);
    setTimeout(fit, 30);
  };

  const switchTemplate = (id) => {
    if (id === doc.templateId) return;
    if (!window.confirm(t.confirm_template.replace('{name}', TEMPLATES[id].name[lang]))) return;
    commit(newDoc(id, mode, docRef.current.view)); setSelected(null); setConnect(null); setTab('help');
  };
  const switchView = (v) => {
    if (v === docRef.current.view) return;
    setDocRaw({ ...docRef.current, view: v }); setSelected(null); setConnect(null); setInfo(null);
    showToast(t.toast_view.replace('{name}', t['view_' + v]));
  };
  const clearAll = () => {
    if (!window.confirm(t.confirm_clear)) return;
    try { localStorage.removeItem(LS_DOC); } catch (e) { }
    hist.current = { past: [], future: [] };
    setDocRaw(newDoc(doc.templateId, mode, doc.view));
    setSelected(null); setConnect(null); showToast(t.toast_cleared); setTimeout(fit, 30);
  };

  /* export */
  const download = (blob, name) => { const a = document.createElement('a'); const url = URL.createObjectURL(blob); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500); showToast(t.toast_exported.replace('{file}', name)); };
  const svgString = () => {
    const src = svgRef.current; const clone = src.cloneNode(true);
    clone.querySelectorAll('.no-export').forEach(el => el.remove());
    const W = src.getAttribute('data-w'), H = src.getAttribute('data-h');
    clone.setAttribute('width', W); clone.setAttribute('height', H);
    clone.removeAttribute('style'); clone.setAttribute('font-family', G.FONT);
    clone.removeAttribute('data-w'); clone.removeAttribute('data-h');
    clone.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
    return { xml: '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone), W: +W, H: +H };
  };
  const base = () => `PDS_${tpl.short}_${stamp()}`;
  const exportSVG = () => { const { xml } = svgString(); download(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }), base() + '.svg'); };
  const exportPNG = () => {
    const { xml, W, H } = svgString(); const img = new Image();
    const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml;charset=utf-8' }));
    img.onload = () => {
      const c = document.createElement('canvas'); const s = 2; c.width = W * s; c.height = H * s;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(b => b && download(b, base() + '.png'), 'image/png');
    };
    img.src = url;
  };
  const printView = () => {
    const { xml } = svgString(); const w = window.open('', '_blank');
    if (!w) { showToast(t.print_blocked); return; }
    const portrait = docRef.current.view === 'C';
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${base()}</title><style>@page{size:A4 ${portrait ? 'portrait' : 'landscape'};margin:${portrait ? '0' : '8mm'}}html,body{margin:0;background:#fff}svg{width:100%;height:auto;display:block}</style></head><body>${xml.replace(/^<\?xml[^>]*>\s*/, '')}</body></html>`);
    w.document.close(); w.focus(); setTimeout(() => { try { w.print(); } catch (e) { } }, 500);
  };
  const exportJSON = () => download(new Blob([JSON.stringify({ app: 'PDS', version: 2, savedAt: new Date().toISOString(), ...doc }, null, 2)], { type: 'application/json' }), base() + '.json');
  const importJSON = (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 2 * 1024 * 1024) { showToast(t.import_error); e.target.value = ''; return; }
    const r = new FileReader();
    r.onload = () => {
      try {
        const clean = sanitizeDoc(JSON.parse(r.result), mode);
        if (window.confirm(t.confirm_import.replace('{file}', f.name.slice(0, 80)))) { commit(clean); setSelected(null); setTimeout(fit, 30); }
      } catch (err) { showToast(t.import_error); }
      e.target.value = '';
    };
    r.readAsText(f);
  };

  /* keyboard */
  useEffect(() => {
    const h = (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select'].includes(tag)) return;
      if (e.key === 'Escape') { setConnect(null); setSelected(null); setInfo(null); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && selected) { e.preventDefault(); api.deleteSel(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
    };
    window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h);
  });

  /* TTS narration of the diagram */
  const narrate = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTts('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTts('paused'); return; }
    if (tts === 'paused') { speechSynthesis.resume(); setTts('playing'); return; }
    const L = mode === 'both' ? lang : mode; const sep = L === 'zh' ? '。 ' : '. ';
    if (isC) {
      const Lc = layoutC(dia, doc.templateId, L, doc.diagrams); const tc = TEMPLATES_C[doc.templateId];
      const tx = [t.tts_intro, tc.pageTitle[L], dia.title[L], dia.subtitle[L]];
      Lc.cards.forEach(c => { tx.push(`${c.idx + 1}. ${c.card.title[L]}`); (L === 'en' ? c.content.lines.en : c.content.lines.zh).filter(Boolean).forEach(x => tx.push(x)); });
      speak(joinSay(tx, L), L, () => setTts('idle')); setTts('playing'); return;
    }
    const d = dia; const geo = computeGeometry(d, tpl, mode);
    const byRows = tpl.readOrder === 'rows';
    const nodes = [...d.nodes].sort((a, b) => byRows ? ((a.y - b.y) || (a.x - b.x)) : ((a.x - b.x) || (a.y - b.y)));
    const texts = [t.tts_intro, d.title[L], d.subtitle[L]];
    const band = []; 
    nodes.forEach(n => { const x = getText(n)[L]; if (!x) return; const arr = inBand(tpl, n) ? band : texts; arr.push(x.title); x.items.filter(Boolean).forEach(i => arr.push(i)); });
    if (band.length) { texts.push(tpl.band.label[L]); texts.push(...band); }
    const mains = d.edges.filter(e => e.kind === 'main');
    if (mains.length) texts.push(tpl.legendTitle[L]);
    mains.forEach(e => texts.push(`${geo.codes[e.id]}: ${e.text[L] || ''}`));
    if (tpl.owners) {
      texts.push(tpl.ownerTitle[L]);
      tpl.owners.forEach(o => { const ns = d.nodes.filter(n => n.owner === o.id).map(n => getText(n)[L].title).filter(Boolean); if (ns.length) texts.push(`${o[L]}: ${ns.join(L === 'zh' ? '、' : ', ')}`); });
    }
    speak(joinSay(texts, L), L, () => setTts('idle'));
    setTts('playing');
  };

  const onInfo = (n, terms, x, y, pin) => setInfo({ n, terms, x, y, pin });
  const selectNode = (s) => { setSelected(s); if (s) setTab('edit'); setInfo(i => (i && i.pin ? i : null)); };

  return (
    <div className="min-h-screen lg:h-screen flex flex-col bg-[#f4f4f4] dark:bg-[#121212] text-slate-800 dark:text-slate-100 font-sans selection:bg-[#004030] selection:text-white dark:selection:bg-[#D8C3A5] dark:selection:text-[#004030] overflow-x-hidden">
      {/* HEADER */}
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="px-3 sm:px-4 h-16 flex items-center justify-between gap-2">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.menu_templates}><IconMenu /></button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  <div className="px-4 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400">{t.menu_templates}</div>
                  {TEMPLATE_ORDER.map((id, i) => (
                    <button key={id} onClick={() => { setMenuOpen(false); switchTemplate(id); }}
                      className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700 ${doc.templateId === id ? 'font-bold text-[#004030] dark:text-[#D8C3A5]' : ''}`}>
                      <span className="w-6 text-center">{['📊', '🔍', '🧭', '🏪'][i]}</span><span className="truncate">{i + 1}. {TEMPLATES[id].name[lang]}</span>
                    </button>
                  ))}
                  <div className="px-4 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400 border-t border-slate-100 dark:border-slate-700 mt-1">{t.view_label}</div>
                  {VIEWS.map(v => (
                    <button key={v} onClick={() => { setMenuOpen(false); switchView(v); }}
                      className={`w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700 ${view === v ? 'font-bold text-[#004030] dark:text-[#D8C3A5]' : ''}`}>
                      <span className="w-6 text-center font-bold">{v}</span><span>{t['view_' + v]}</span>
                    </button>
                  ))}
                  <div className="px-4 pt-3 pb-1 text-xs font-bold uppercase tracking-wider text-slate-400 border-t border-slate-100 dark:border-slate-700 mt-1">{t.menu_tabs}</div>
                  {[['edit', '✏️', t.tab_edit], ['add', '➕', t.tab_add], ['terms', '📖', t.tab_terms], ['help', '🧾', t.tab_help]].map(([k, ic, lbl]) => (
                    <button key={k} onClick={() => { setTab(k); setMenuOpen(false); }} className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700"><span className="w-6 text-center">{ic}</span><span>{lbl}</span></button>
                  ))}
                  <div className="border-t border-slate-100 dark:border-slate-700 mt-1" />
                  <button onClick={() => { setMenuOpen(false); api.startTour(); }} className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700"><span className="w-6 text-center">🧭</span><span>{t.tour_label}</span></button>
                  <button onClick={() => { setMenuOpen(false); onLogout(); }} className="w-full flex items-center gap-3 px-4 py-2.5 text-sm text-left hover:bg-slate-100 dark:hover:bg-slate-700"><span className="w-6 text-center">🔒</span><span>{t.gate_logout}</span></button>
                </div>
              )}
            </div>
            <button onClick={() => { setSelected(null); setConnect(null); fit(); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Home"><IconHome /></button>
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2 shrink-0">
            <button onClick={() => narrate(tts === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg flex items-center gap-1" title={t.tts_play} aria-label={t.tts_play}>
              {tts === 'playing' ? <IconPause size={16} /> : <IconPlay size={16} />}<span className="hidden md:inline text-xs">{t.tts_play}</span>
            </button>
            {tts !== 'idle' && <button onClick={() => narrate('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.tts_stop}><IconSquare size={14} /></button>}
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2.5 py-1 border border-[#D8C3A5]/60 rounded-lg text-sm font-bold text-[#D8C3A5] hover:bg-white/10">{t.lang_toggle}</button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.theme_toggle}>{isDark ? <IconSun /> : <IconMoon />}</button>
          </div>
        </div>
      </header>

      {/* MAIN */}
      <main className="pt-16 flex-1 flex flex-col lg:flex-row min-h-0">
        <section className="flex-1 flex flex-col min-w-0 min-h-0">
          {/* Toolbar */}
          <div className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-3 py-2 flex flex-wrap items-center gap-2 shrink-0">
            <label data-tour="template" className="flex items-center gap-1.5 text-xs font-semibold text-slate-500"><IconLayers size={15} />{t.tpl_label}
              <select value={doc.templateId} onChange={e => switchTemplate(e.target.value)} className="ml-1 px-2 py-1.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm text-slate-800 dark:text-slate-100 font-medium">
                {TEMPLATE_ORDER.map(id => <option key={id} value={id}>{TEMPLATES[id].name[lang]}</option>)}
              </select>
            </label>
            <div data-tour="view" className="flex items-center gap-2"><span className="text-xs font-semibold text-slate-500 ml-1">{t.view_label}</span>
            <div className="flex" role="tablist" aria-label={t.view_label}>
              {['A', 'B', 'C'].map((k, i) => (
                <button key={k} role="tab" aria-selected={view === k} title={t['view_' + k]} onClick={() => switchView(k)}
                  className={`px-2.5 py-1.5 text-xs sm:text-sm border border-slate-300 dark:border-slate-600 ${i === 0 ? 'rounded-l-lg' : ''} ${i === 2 ? 'rounded-r-lg' : ''} ${i > 0 ? '-ml-px' : ''} disabled:opacity-40 disabled:cursor-not-allowed ${view === k ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`}>{t['view_' + k]}</button>
              ))}
            </div></div>
            <div data-tour="mode" className="flex items-center gap-2"><span className="text-xs font-semibold text-slate-500 ml-1">{t.disp_label}</span>
            <div className="flex">
              {[['zh', t.disp_zh], ['en', t.disp_en], ['both', t.disp_both]].map(([k, l], i) => (
                <button key={k} onClick={() => changeMode(k)} className={`px-2.5 py-1.5 text-xs sm:text-sm border border-slate-300 dark:border-slate-600 ${i === 0 ? 'rounded-l-lg' : ''} ${i === 2 ? 'rounded-r-lg' : ''} ${i > 0 ? '-ml-px' : ''} ${mode === k ? 'bg-[#004030] text-white dark:bg-[#D8C3A5] dark:text-[#004030] font-bold' : 'hover:bg-slate-100 dark:hover:bg-slate-700'}`}>{l}</button>
              ))}
            </div></div>
            <span className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />
            <Btn onClick={layout} disabled={isC}>{t.btn_layout}</Btn>
            <span data-tour="connect"><Btn active={!!connect} disabled={isC} onClick={() => connect ? setConnect(null) : api.startConnect()}>{t.btn_connect}</Btn></span>
            <Btn onClick={undo} disabled={!hist.current.past.length} title="Ctrl+Z">{t.btn_undo}</Btn>
            <Btn onClick={redo} disabled={!hist.current.future.length} title="Ctrl+Y">{t.btn_redo}</Btn>
            <span className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />
            <Btn onClick={() => setZoom(z => Math.max(0.3, +(z - 0.1).toFixed(2)))} title={t.zoom_out}>−</Btn>
            <span className="text-xs w-10 text-center tabular-nums">{Math.round(zoom * 100)}%</span>
            <Btn onClick={() => setZoom(z => Math.min(2, +(z + 0.1).toFixed(2)))} title={t.zoom_in}>＋</Btn>
            <Btn onClick={fit}>{t.zoom_fit}</Btn>
            <span className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block" />
            <span data-tour="export" className="flex flex-wrap gap-2">
            <Btn onClick={exportSVG}>{t.btn_export_svg}</Btn>
            <Btn onClick={exportPNG}>{t.btn_export_png}</Btn>
            <Btn onClick={exportJSON}>{t.btn_export_json}</Btn>
            <Btn onClick={() => fileRef.current && fileRef.current.click()}>{t.btn_import_json}</Btn>
            <Btn onClick={printView}>{t.btn_print}</Btn>
            </span>
            <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={importJSON} />
            <Btn danger onClick={clearAll}>{t.btn_clear}</Btn>
          </div>
          {connect && (
            <div className="bg-amber-50 dark:bg-amber-900/30 text-amber-800 dark:text-amber-200 border-b border-amber-200 dark:border-amber-800 px-4 py-2 text-sm flex items-center justify-between gap-3 shrink-0">
              <span>{connect.from ? t.connect_hint2 : t.connect_hint1}</span>
              <Btn onClick={() => setConnect(null)}>{t.connect_cancel}</Btn>
            </div>
          )}
          {/* Canvas */}
          <div ref={wrapRef} data-tour="canvas" className="flex-1 overflow-auto p-3 min-h-[60vh] lg:min-h-0 relative"
            style={{ backgroundImage: `radial-gradient(${isDark ? '#334155' : '#cbd5e1'} 1px, transparent 1px)`, backgroundSize: '18px 18px' }}
            onContextMenu={(e) => { e.preventDefault(); showToast(t.copyright_msg); }}
            onScroll={() => info && !info.pin && setInfo(null)}>
            <div className="inline-block shadow-xl rounded-md overflow-hidden ring-1 ring-slate-300 dark:ring-slate-600">
              {isC ? <CPage doc={doc} mode={mode} selected={selected} onSelect={selectNode} zoom={zoom} svgRef={svgRef} t={t} /> :
              <Diagram doc={doc} dia={dia} tpl={tpl} mode={mode} selected={selected} onSelect={selectNode}
                onDragNode={(id, x, y) => setD(d => ({ ...d, nodes: d.nodes.map(n => n.id === id ? { ...n, x, y } : n) }))}
                onDragEnd={(snapshot) => pushHist(snapshot)}
                connect={connect} onConnectPick={onConnectPick} zoom={zoom} svgRef={svgRef} onInfo={onInfo} />}
            </div>
          </div>
          <div className="px-4 py-1 text-[11px] text-slate-400 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 shrink-0">{t.saved_badge}</div>
        </section>
        <aside data-tour="panel" className="w-full lg:w-[360px] shrink-0 bg-white dark:bg-slate-800 border-l border-slate-200 dark:border-slate-700 min-h-[420px] lg:min-h-0 flex flex-col">
          <Panel t={t} lang={lang} tab={tab} setTab={setTab} doc={doc} dia={dia} tpl={tpl} selected={selected} api={api} mode={mode} />
        </aside>
      </main>

      {/* Term popover */}
      {info && (
        <div className="fixed z-[90] w-80 max-w-[calc(100vw-1rem)] bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 p-4 animate-fade-in"
          style={{ left: Math.max(8, Math.min(info.x + 12, window.innerWidth - 336)), top: Math.max(72, Math.min(info.y + 12, window.innerHeight - 320)) }}
          onMouseLeave={() => !info.pin && setInfo(null)}>
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{t.info_terms} · {getText(info.n)[lang === 'en' ? 'en' : 'zh'].title}</span>
            <button className="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 text-lg leading-none" aria-label={t.close} onClick={() => setInfo(null)}>×</button>
          </div>
          <div className="max-h-64 overflow-y-auto space-y-3">
            {info.terms.map(k => { const g = tpl.glossary[k]; return (
              <div key={k}>
                <div className="flex items-center justify-between gap-2"><span className="font-bold text-[#004030] dark:text-[#D8C3A5] text-sm">{g[lang][0]}</span>
                  <button className="shrink-0" aria-label={t.btn_speak} onClick={() => speak(joinSay([g[lang][0], g[lang][1]], lang), lang)}>🔊</button></div>
                <p className="text-sm leading-relaxed text-slate-700 dark:text-slate-300">{g[lang][1]}</p>
              </div>); })}
          </div>
        </div>
      )}

      {tour && <Tour t={t} onClose={() => setTour(false)} />}

      {/* Toast */}
      {toast && <div className="fixed bottom-12 left-1/2 -translate-x-1/2 z-[120] bg-[#004030] text-[#D8C3A5] dark:bg-[#D8C3A5] dark:text-[#004030] px-4 py-2 rounded-lg shadow-xl text-sm font-medium animate-fade-in">{toast}</div>}

      {/* FOOTER */}
      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0 gap-2">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span>{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">{t.architect_name}</a></span>
          <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

function Root() {
  const [state, setState] = useState('checking');
  useEffect(() => {
    let code = null; try { code = localStorage.getItem(LS_CODE); } catch (e) { }
    if (!code) { setState('locked'); return; }
    openVault(code).then(p => { applyVault(p); setState('open'); }).catch(() => { try { localStorage.removeItem(LS_CODE); } catch (e) { } setState('locked'); });
  }, []);
  const logout = () => { try { localStorage.removeItem(LS_CODE); } catch (e) { } location.reload(); };
  if (state === 'checking') return <div className="min-h-screen bg-[#f4f4f4] dark:bg-[#121212]" />;
  if (state === 'locked') return <Gate onOpen={() => setState('open')} />;
  return <App onLogout={logout} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root />);

}
</script>
</body>
</html>
